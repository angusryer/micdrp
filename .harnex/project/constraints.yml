constraints_version: "1.0.0"

# micdrp is a React Native app over a self-hosted PocketBase backend: one
# Go binary providing auth, record collections with per-record access rules,
# and file storage. Every domain's compute runs on-device against the pure-TS
# `logic` package; the backend only stores and guards.
#
# It replaced Supabase, whose free tier the project outgrew. Self-hosting
# removes the per-project ceiling entirely, and the four things this app
# needs — email auth, owned records, blobs, and server-side ownership rules —
# are all first-class in PocketBase.

runtime:
  language: typescript
  process_model: mobile_client
  client:
    framework: react-native
    packages: [packages/client]
  compute:
    location: on_device
    packages: [packages/logic, packages/shared]
    native_core: packages/client/cpp/dsp
  backend:
    provider: pocketbase
    database: sqlite
    auth: pocketbase_auth
    storage: pocketbase_files
    schema: backend/migrations
    deployment: self_hosted
  build:
    script: scripts/build.sh
  start:
    script: scripts/dev.sh

serialization:
  postgres:
    case: snake_case
  typescript:
    case: camelCase
  timestamps:
    format: epoch_millis
    field_suffix: Ms
    rationale: >
      Melodies are timed in milliseconds relative to take start, so
      every time value in the domain model is a number of milliseconds.
      Row creation times cross the wire as `createdAtMs`.
  ids:
    format: uuid_v4
    source: postgres
  nulls:
    typescript: "null (explicit, not undefined)"

permissions:
  # micdrp has no multi-tenant role ladder. A person is either signed
  # out or signed in, and a signed-in singer reaches exactly their own
  # rows — enforced by Postgres row-level security, not by app code.
  role_hierarchy:
    - visitor
    - singer
  role_access_levels:
    visitor: 10
    singer: 20
  ownership:
    model: record_access_rules
    predicate: "@request.auth.id = user"
    enforced_by: backend/migrations
    note: >
      Enforced by the backend on every request, never by client code. The
      client cannot widen its own access by editing a query.
  permission_matrix: {}
