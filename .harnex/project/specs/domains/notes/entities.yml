entities:
  - name: Note
    description: >
      One sung musical-idea memo. The row carries the symbolic melody as
      well as the descriptive analysis, so every later question is
      answered from data rather than from audio.
    properties:
      - name: id
        type: string
        required: true
        immutable: true
        description: Server-generated identifier.
      - name: userId
        type: string
        required: true
        immutable: true
        description: The singer this note belongs to.
      - name: title
        type: string
        required: true
        description: >
          What the singer calls this idea. Defaults to a timestamped name
          so a capture is never blocked on naming it.
      - name: createdAtMs
        type: number
        required: true
        immutable: true
        description: When the note was captured.
      - name: durationMs
        type: number
        required: true
        immutable: true
        description: Length of the capture.
      - name: sampleRateHz
        type: number
        required: true
        immutable: true
        description: Rate the audio was captured at.
      - name: audioPath
        type: string
        required: false
        description: >
          Path within the private notes bucket, or null until the upload
          completes. A note is usable without it.
      - name: melody
        type: array
        items: NoteEvent
        required: true
        description: >
          The symbolic melody. Source of truth for all later analysis;
          persisted so no corpus question ever re-touches a waveform.
      - name: key
        type: string
        required: false
        description: >
          Detected key, or null when the detection was too weak to assert.
      - name: tempoBpm
        type: number
        required: false
        description: Detected tempo, or null when too weak to assert.
      - name: inTuneRatio
        type: number
        required: false
        description: Fraction of frames within tolerance of the note sung.
        constraints: ["is within 0 and 1 inclusive when not null"]
      - name: meanCentsError
        type: number
        required: false
        description: Mean absolute cents deviation across the take.
      - name: noteCount
        type: number
        required: true
        description: How many discrete notes the take contains.
      - name: rangeLowMidi
        type: number
        required: false
        description: Lowest note sung, or null when the melody is empty.
      - name: rangeHighMidi
        type: number
        required: false
        description: Highest note sung, or null when the melody is empty.
    internal_properties:
      - name: melody_json
        type: jsonb
        description: The Postgres column the melody is stored in.

  - name: ChordTrack
    description: >
      The editing session over a note's harmonic backdrop. Holds the
      inferred progression and the singer's changes side by side, so any
      slot can be put back to what the melody implied without recomputing
      the analysis.
    properties:
      - name: slots
        type: array
        items: ChordSlot
        required: true
        description: The current progression, one slot per bar or half bar.
      - name: hasEdits
        type: boolean
        required: true
        description: True when any slot has been changed by hand.
      - name: auditionMs
        type: number
        required: true
        description: How long a chord sounds when tapped.

  - name: NoteMeta
    description: >
      The cached list projection. Enough to draw a note card without a
      round trip, including the melody so the shape renders offline.
    properties:
      - name: id
        type: string
        required: true
        description: The note's identifier.
      - name: title
        type: string
        required: true
        description: The note's title.
      - name: createdAtMs
        type: number
        required: true
        description: When it was captured.
      - name: durationMs
        type: number
        required: true
        description: How long it is.
      - name: melody
        type: array
        items: NoteEvent
        required: true
        description: The symbolic melody, carried into the cache.
      - name: audioUrl
        type: string
        required: false
        description: Resolved playback URL, or null when not yet available.

  # The layers a take is derived into (INV-NOTES-255). None is stored: each
  # is the output of one pure function over the layer beneath it and the
  # statements a person made about it. Listed so the boundary between them
  # is a named thing rather than a convention.

  - name: Transcription
    description: >
      What was sung, as read from the performance and corrected by hand.
      Carries no rhythm (INV-NOTES-257): no note here depends on a tempo,
      a bar or a beat. Converges on the performance as the reader improves.
    properties:
      - name: notes
        type: array
        items: NoteEvent
        required: true
        description: >
          The melody with corrections replayed, written notes merged in and
          deleted notes left out. Each says whether it was written rather
          than sung (INV-NOTES-246).
      - name: counted
        type: array
        items: NoteEvent
        required: true
        description: >
          Notes that were a sung count rather than the tune (INV-PITCH-022).
          Split off here because they are part of what was sung and not
          part of the music.

  - name: Rhythm
    description: >
      The beat, bars, tempo and count-in, read from the transcription and
      corrected by hand. Exists to group notes into bars for the harmony
      and to time an overdub; read by nothing that produces a note
      (INV-NOTES-258).
    properties:
      - name: timeline
        type: BeatTimeline
        required: false
        description: >
          Every beat, tapped, voiced or worked out, or null where nothing
          anchors one (INV-NOTES-236).
      - name: grid
        type: MusicalGrid
        required: true
        description: The constant grid the quantised and notated views use.
      - name: bars
        type: BarLayout
        required: true
        description: Where the bars fall, proposed or arranged.
      - name: pickup
        type: Pickup
        required: false
        description: The count-in, or null where nobody made one.

  - name: Harmony
    description: >
      The chords, read from the transcription grouped by the rhythm and
      corrected by hand. The layer most often edited, and the only one
      whose inference reads the rhythm.
    properties:
      - name: slots
        type: array
        items: ChordSlot
        required: true
        description: One slot per bar or half bar.
      - name: key
        type: string
        required: false
        description: The key the transcription implies, or null.

  - name: Interpretation
    description: >
      The statements a person made about a take, kept with the note. One
      flat document on the wire (INV-NOTES-260), read in three slices —
      one per derived layer — so a derivation can only see the statements
      that correct its own layer.
    properties:
      - name: transcriptionSlice
        type: object
        required: true
        description: notes, writtenNotes, deletedNotes.
      - name: rhythmSlice
        type: object
        required: true
        description: >
          beats, dismissedBeats, barLines, bpm, tapPattern, pickup.
      - name: harmonySlice
        type: object
        required: true
        description: chords, harmony.
