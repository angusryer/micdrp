# What choosing a thing on the graph must look like, and how the thing then
# moves. Split from invariants-graph.yml, which is at its file budget.
invariants:
  - id: INV-NOTES-056
    description: A drag is measured from where it was grabbed
    severity: critical
    check: >
      The position a dragged object is moved to is its position when the
      finger went down plus the distance the finger has travelled since —
      never its position now plus that same distance. Verified by feeding
      a sequence of increasing translations through the drag while the
      object's committed position updates between each one, and asserting
      the object lands where the finger is rather than further along.

      A drag reads a translation that is cumulative from touch-down, so
      adding it to a position that has already been moved by the earlier
      part of the same drag counts every pixel twice, then three times,
      then four. A bar line dragged a centimetre shot most of the way
      across the take, which reads as the graph being wildly oversensitive
      rather than as what it is — the object's own movement being fed back
      into the measurement of the finger's.

  - id: INV-NOTES-057
    description: What is chosen is lit from behind
    severity: major
    check: >
      A chosen object is drawn with a soft halo behind it, in its own
      colour, larger and blurred; nothing else on the graph carries one,
      and a graph with nothing chosen carries none. The halo is a stroke
      rather than a fill, so the object it lights is never dimmed or
      covered by it. Verified by asserting the halo resolves to exactly
      the chosen object, in that object's own colour, and to nothing when
      nothing is chosen or when what was chosen has since gone.

      Choosing was legible only by the controls appearing below the graph,
      which is a long way from the thing being pointed at and says which
      *kind* of thing was chosen rather than which one. A sung note gave
      no sign at all. Backlighting reads as "this one is live" without
      recolouring the object, which matters most for the chord notes,
      where the colour is not decoration — it says which part of the chord
      the note is playing, and must survive being chosen (INV-NOTES-052).

  - id: INV-NOTES-070
    description: A dragged pitch is heard as it is crossed, once each
    severity: major
    check: >
      While a chord note or a sung note is being dragged, each whole
      semitone it crosses sounds once, at the pitch it has just reached,
      and only while hearing is turned on. A drag that stays inside one
      semitone sounds nothing, and a drag back over a pitch already
      crossed sounds it again. Verified by asserting one sounding per
      crossing and none for movement that commits no change.

      Moving a note is a question about pitch, and answering it by eye
      alone means dropping the note and pressing a control to find out —
      by which point the thing being compared is gone. Sounding the pitch
      under the finger makes the drag itself the audition.

      It is a toggle because a phone speaker in a quiet room is not
      always welcome, and because a long drag across an octave is twelve
      notes nobody asked for. The same voice the graph already auditions
      with, so a drag can never sound over a tap.

  - id: INV-NOTES-091
    description: Moving the playhead is not a transport command
    severity: major
    check: >
      Dragging the handle, or tapping anywhere along the bar it sits in,
      moves where a press of play would start and sounds nothing. A press
      then begins from there. Moving it while something is sounding stops
      that rather than seeking through it. Verified by asserting the
      scrubber's callback places the head without entering the playing
      state.

      A scrubber that played what it passed over made placing the head
      impossible without hearing it, so choosing where to listen from cost
      a burst of audio every time. The head is a position; play is a verb;
      they were the same control.

      Stopping rather than seeking live is what this transport can
      honestly do: it starts at a moment, it does not jump to one, and a
      stutter would be a worse answer than a stop.

  - id: INV-NOTES-092
    description: A tap toggles whatever is under it
    severity: minor
    check: >
      Tapping an object that is not chosen makes it the whole selection.
      Tapping one that is chosen takes it out, however many others are in
      hand and whatever kind it is. Verified by asserting a second tap on the
      same object reports it gone, that tapping one of several leaves the
      rest, and that tapping something new still replaces the set.

      Letting go otherwise meant finding empty space to tap, and a graph
      carrying bar lines, chord notes and sung notes has little of it —
      the likeliest outcome of hunting for a gap is choosing something
      else by mistake.

      A tap on a chosen thing used to collapse the set onto it, so the one
      gesture that reads as "not this one" did the opposite of that whenever
      more than one thing was held. One meaning everywhere is what makes it
      predictable enough to use without looking, and adding to a set is what
      hold is for (INV-NOTES-093).

  - id: INV-NOTES-093
    description: Several things can be chosen, and they are all of one kind
    severity: major
    check: >
      Holding an object adds it to what is chosen, or takes it out again if
      it was already there. Tapping an object chooses that one alone.
      Everything chosen at once is of one kind: choosing a sung note while
      downbeats are held replaces them rather than joining them. Verified
      by asserting a hold adds, a second hold on the same object removes,
      a tap collapses to one, and a hold of a different kind replaces the
      set.

      A downbeat and a sung note take different verbs — one is removed,
      the other is heard and put back — so a set holding both could offer
      neither without grey controls, and the sheet would spend its room
      explaining what does not apply.

      Hold rather than tap because tap already means "choose this one",
      and a gesture that changed meaning depending on how many things were
      already chosen would make the first selection feel different from
      the second.

      Adding only applies once something is chosen. A set is grown from a
      set of one, so with nothing chosen there is nothing to add to and
      the hold keeps the meaning it always had — a downbeat where there is
      empty space, and nothing at all on an object.

  - id: INV-NOTES-094
    description: A chosen thing can be found from its own row
    severity: minor
    check: >
      With more than one thing chosen, the sheet lists them, and pressing
      a row makes that object flash on the graph without changing what is
      chosen. Verified by asserting the flash names exactly the pressed
      object and clears itself.

      Several chord notes read the same in a list — same name, same part,
      a bar apart — and the graph is the only place they are
      distinguishable. Without this, choosing four things means losing
      track of which row is which the moment they are chosen.

  - id: INV-NOTES-099
    description: Sideways, the selection arrives beside the graph, not over it
    severity: major
    check: >
      With the phone held sideways, choosing something brings its details in
      from the right edge as a panel that takes width, and the graph narrows
      to what is left rather than being covered. Both presentations show the
      same content, and the panel offers a way to put the selection down.
      Verified by asserting the graph is drawn to a measured width as well as
      a measured height, that the panel is absent until something is chosen,
      and that it can be dismissed.

      Sideways the short dimension is the graph, which is what the view is
      for: a sheet rising from the bottom takes the height the view exists to
      provide and covers the thing being acted on. Width is the dimension
      there is spare, so the panel takes that instead. It sits in the row
      rather than floating above the graph, because drawing over the bars
      would hide the same bars from the other side.

      The panel has no grabber to drag away, unlike the upright sheet, so
      putting the selection down has to be offered explicitly. Without it the
      graph stays narrow for the rest of the session.
