# What choosing a thing on the graph must look like, and how the thing then
# moves. Split from invariants-graph.yml, which is at its file budget.
invariants:
  - id: INV-NOTES-056
    description: A drag is measured from where it was grabbed
    severity: critical
    check: >
      The position a dragged object is moved to is its position when the
      finger went down plus the distance the finger has travelled since —
      never its position now plus that same distance. Verified by feeding
      a sequence of increasing translations through the drag while the
      object's committed position updates between each one, and asserting
      the object lands where the finger is rather than further along.

      A drag reads a translation that is cumulative from touch-down, so
      adding it to a position that has already been moved by the earlier
      part of the same drag counts every pixel twice, then three times,
      then four. A bar line dragged a centimetre shot most of the way
      across the take, which reads as the graph being wildly oversensitive
      rather than as what it is — the object's own movement being fed back
      into the measurement of the finger's.

  - id: INV-NOTES-057
    description: What is chosen is lit from behind
    severity: major
    check: >
      A chosen object is drawn with a soft halo behind it, in its own
      colour, larger and blurred; nothing else on the graph carries one,
      and a graph with nothing chosen carries none. The halo is a stroke
      rather than a fill, so the object it lights is never dimmed or
      covered by it. Verified by asserting the halo resolves to exactly
      the chosen object, in that object's own colour, and to nothing when
      nothing is chosen or when what was chosen has since gone.

      Choosing was legible only by the controls appearing below the graph,
      which is a long way from the thing being pointed at and says which
      *kind* of thing was chosen rather than which one. A sung note gave
      no sign at all. Backlighting reads as "this one is live" without
      recolouring the object, which matters most for the chord notes,
      where the colour is not decoration — it says which part of the chord
      the note is playing, and must survive being chosen (INV-NOTES-052).
