interactions:
  - id: INT-NOTES-001
    name: Sing an idea and keep it
    view: VIEW-NOTES-001
    precondition: The singer is signed in and the microphone permission is granted.
    steps:
      - Press record
      - Sing
      - Press stop
    outcome: >
      The capture is analysed and saved as a note, which appears at the
      top of the list. No quality threshold is applied.
    error_handling: >
      A denied microphone permission surfaces as a prompt to grant it and
      leaves no note behind. A failed save reports the failure and keeps
      the capture available to retry.
    maps_to:
      capability: notes.capture

  - id: INT-NOTES-002
    name: Browse kept ideas
    view: VIEW-NOTES-001
    steps:
      - Open the Notes tab
    outcome: >
      The cached list paints immediately, then the server's list replaces
      it. Nothing kept yet shows the empty state instead.
    error_handling: >
      A failed sync leaves the cached list on screen rather than blanking it.
    maps_to:
      capability: notes.list

  - id: INT-NOTES-003
    name: Delete an idea
    view: VIEW-NOTES-001
    precondition: The note belongs to the signed-in singer.
    steps:
      - Choose delete on a note card
      - Confirm
    outcome: >
      The row and its stored audio are removed and the note leaves the list.
    error_handling: >
      A failed delete leaves the note in place and reports the failure.
    maps_to:
      capability: notes.delete

  - id: INT-NOTES-004
    name: Look at an idea's shape
    view: VIEW-NOTES-002
    steps:
      - Open a note from the list
    outcome: >
      The melody is drawn over time and pitch with bar lines and a time
      signature, and the descriptive analysis is shown beside it.
    maps_to:
      capability: notes.open_chord_track

  - id: INT-NOTES-018
    name: See the take as sung or as written
    view: VIEW-NOTES-002
    precondition: The note has a melody.
    steps:
      - Open the playback options and choose as sung or as written for
        what is drawn
    outcome: >
      The graph and the note list are redrawn from the chosen reading.
      As sung, each note sits where it was sung and says how far off
      centre it was. As written, each onset sits on the grid at a
      notated length and nothing is off centre, because notation has no
      way to say a note was fourteen cents flat. The stored melody is
      untouched, and what pressing play sounds is left as it was.
    error_handling: >
      A take with no metre is not offered the written reading — there is
      no grid to write it against — and stays as sung.
    maps_to:
      capability: notes.set_notation_view

  - id: INT-NOTES-005
    name: Change a chord in the backdrop
    view: VIEW-NOTES-002
    precondition: The note's chord track has at least one slot.
    steps:
      - Drag a chord slot up or down to move it through the key
      - Or double-tap a slot to step its shape through the qualities
    outcome: >
      The slot takes the new chord, is marked as chosen, and later
      inference leaves it alone. A sideways drag is not an edit at all:
      it scrolls the track, so a progression longer than the screen can
      be reached.
    maps_to:
      capability: notes.edit_chord

  - id: INT-NOTES-006
    name: Put a chord back
    view: VIEW-NOTES-002
    precondition: At least one slot has been changed.
    steps:
      - Choose revert on a slot, or revert everything
    outcome: >
      The slot returns to what the melody implied and is no longer marked
      as chosen. Reverting everything hides the revert-all control.
    maps_to:
      capability: notes.revert_chord

  - id: INT-NOTES-007
    name: Hear a chord under the line
    view: VIEW-NOTES-002
    steps:
      - Tap a chord slot
    outcome: >
      The chord sounds briefly, voiced below the sung line, and the slot
      is not marked as chosen.
    maps_to:
      capability: notes.audition_chord

  # Playing a take back — INT-NOTES-008, INT-NOTES-010, INT-NOTES-011 —
  # lives in interactions-playback.yml.

  - id: INT-NOTES-009
    name: Take the idea elsewhere
    view: VIEW-NOTES-002
    steps:
      - Choose export
    outcome: >
      A MIDI file is produced from the persisted melody and offered to
      the singer.
    maps_to:
      capability: notes.export_midi

  - id: INT-NOTES-023
    name: Look at the notes and the numbers
    view: VIEW-NOTES-002
    steps:
      - Press the details control on the note's page
    outcome: >
      A full page rises carrying what the graph does not draw: every note
      as a row you can tap to hear, what was measured about the take, and
      the way to export it. Closing it returns to the graph with nothing
      changed.

      These sat below the graph, so every visit to a note scrolled past
      them and every edit to the graph pushed them further away. They are
      read occasionally and edited never, which is exactly what belongs
      behind a control rather than under the thing being worked on.

      It shares the open note rather than opening its own: reading the
      take a second time would re-measure it, and two readings of one take
      can disagree while an edit is still being made.
    maps_to:
      capability: notes.open_chord_track
