# What must hold of a person's readings of a take. Split by concern.
invariants:
  - id: INV-NOTES-021
    description: A person's decisions outlive the screen they were made on
    severity: high
    check: >
      An edit survives leaving the note and returning to it. Verified by
      editing, navigating away, and asserting the edit is still there.

      Chord editing shipped without this and every change was lost the
      moment the screen closed, which made the feature feel broken while
      being exactly as designed.

  - id: INV-NOTES-022
    description: The active reading is differences, never a copy
    severity: critical
    check: >
      The active interpretation stores only what a person overrode, and
      is replayed against whatever analysis currently infers. Verified by
      changing the inference and asserting an untouched slot follows it
      while an edited slot does not.

      The melody is the source of truth and the analysis is derived from
      it. Storing the analysis would make a second source that goes stale
      the moment detection improves (Axiom 2), and nothing would say so.

  - id: INV-NOTES-023
    description: A frozen reading never changes
    severity: critical
    check: >
      Re-analysis leaves every frozen interpretation byte-identical, and
      a frozen interpretation is never replayed against new inference.
      Verified by freezing one, re-analysing, and asserting it is
      unchanged.

      This is the one case where storing the whole reading is right
      rather than wrong: its purpose is to survive detection changing
      underneath it. A working copy replays; a commit does not.

  - id: INV-NOTES-024
    description: Re-analysis never discards work silently
    severity: critical
    check: >
      Re-analysis that would overwrite edits is refused until a person
      has either accepted the loss or kept the current reading aside.
      Verified by re-analysing an edited note and asserting nothing
      changes without that decision.

  - id: INV-NOTES-025
    description: A person can see what they are placing
    severity: high
    check: >
      While a drag that places something is live, the readout for it is
      never underneath the finger doing the dragging. Verified by
      asserting the readout's position is offset from the touch point,
      and that it moves to the other side rather than off-screen when the
      touch is near an edge.

      Chord editing already has this problem the other way round: a slot
      changes as you drag over it, under your own thumb, so you cannot
      see the thing you are choosing until you let go. Placement you
      cannot watch is placement by trial and error.

      The surface being dragged over can be shorter than the readout
      needs: the melody strip is 150 points tall, and the readout plus
      the clearance that keeps it off the fingertip is nearly all of
      that. Clamped inside such a surface, every placement settles level
      with the thumb — offset to the side by the letter of this rule,
      under the hand in fact. Where nothing above the surface clips, the
      readout rises above it instead: the bound it must stay inside is
      the screen, not the strip. Verified by placing on a surface too
      short to hold the readout and asserting it still clears the finger
      vertically rather than sitting beside it at thumb height.

  - id: INV-NOTES-026
    description: A take can be seen and heard as sung or as written down
    severity: high
    check: >
      As sung uses the pitch and timing that were detected, unrounded
      and unsnapped. As written uses the notated pitch and the grid.
      This holds of both surfaces: what the melody sounds when it is
      played, and what the graph and the note list draw. Both are chosen
      in the playback options, as two toggles in the same list as the
      track toggles and drawn like them, each naming the surface it is
      for. Verified by asserting the two readings differ for a take that
      was neither exactly in tune nor exactly in time, agree for one that
      was, that choosing the written one moves every drawn onset onto the
      grid while the stored melody is left alone, and that both toggles
      are reachable only from those options.

      These answer different questions and conflating them hides both.
      As sung, a mismatch is the detector's fault and worth chasing. As
      written, it is what transcription costs — a pure major third is
      fourteen cents from a tempered one, and no amount of better
      detection will change that.

      Hearing the difference is what makes the pitch detector testable
      at all: without it, every complaint about playback is ambiguous
      between the two. Seeing it is what makes the quantizer testable,
      since a snap onto the wrong step is plain in the picture and all
      but inaudible in a short take.

      A single control now sits above the two and moves both at once,
      along with the click and the export (INV-NOTES-202). It is not a
      replacement: turning a whole take from what was performed into
      what it would be written as, and back, is a different question
      from either of these, and it has to be one press to be worth
      anything — judging whether a tidied reading is right means hearing
      it against the untidied one immediately.

      The two stay because they answer what the combined one cannot.
      Looking at the notation while listening to the raw take is how a
      person tells which of the two is wrong. Sitting them among
      the tracks does not join them — they are one more thing that
      decides what you are about to hear and see, and a segmented
      control of their own beneath the graph made them look like a
      different kind of question than the toggles they belong with.

  - id: INV-NOTES-027
    description: The take and what was read from it can be heard together
    severity: high
    check: >
      The detected melody sounds over the take, on the take's own clock,
      and its level can be changed while both are playing. It is turned
      on and off by its own track toggle beside the play control, with
      the other tracks and by the same rules (INV-NOTES-019) — there is
      no second switch for it under the graph. Verified by starting
      mid-take and asserting the melody lands where the voice is, that a
      level set during playback moves what is sounding, and that the
      melody track's toggle is what decides whether it sounds at all.

      Hearing them apart says each is plausible; hearing them together
      says whether they are the same. A note read a semitone out, or a
      beat late, is obvious against the voice and easy to miss beside it.

      Mixing is done by ear while listening, so the level has to move
      what is already sounding rather than only what is scheduled next.
      Everything a player sounds passes through one gain for that reason.

  - id: INV-NOTES-028
    description: Everything the app sounds shares one clock
    severity: critical
    check: >
      The take, the melody and the chords are rendered by one engine on
      one sample counter, and a note scheduled for a given moment is
      produced at that sample. Verified by rendering a schedule and
      asserting each voice begins on the sample it was given.

      Three separate audio graphs cannot agree on a moment. Alignment
      went through a measured elapsed time passed between them, which is
      as accurate as a render and a context creation allow — audible on
      anything with a sharp attack. One counter makes it exact rather
      than close.

  - id: INV-NOTES-029
    description: Playing a long take costs no more than playing a short one
    severity: high
    check: >
      Rendering allocates nothing per note. Verified by rendering a
      schedule of thousands of notes and asserting the voice pool is
      fixed and bounded.

      A node per note meant a minute-long take built hundreds of them
      before a sound was made. A fixed pool of voices, each reused as
      notes finish, is what keeps a long idea as cheap to hear as a
      short one.

  - id: INV-NOTES-064
    description: The thing being dragged moves with the finger dragging it
    severity: high
    check: >
      While a bar-line drag is live, the line is drawn at the step it
      would land on if the finger let go now — not at the step it started
      from. Releasing puts it exactly where it was last drawn. Verified by
      dragging a line and asserting both its drawn position and the step
      the drop commits follow the finger.

      The readout already followed the finger (INV-NOTES-025) while the
      line stayed behind, which left the one thing being placed as the one
      thing that did not move. A gesture whose subject is frozen reads as
      a gesture that was not registered, and a person presses harder
      rather than further.

      Where it would land, not where the finger is: the line stops against
      its neighbours instead of crossing them, and what the drop commits
      is the step the drag last drew — a line that snaps back on release
      is worse than one that never moved, because it lies twice.

  - id: INV-NOTES-143
    description: Snapping is a choice, and it applies to notes as well as bars
    severity: minor
    check: >
      A toggle in the rail beside the graph decides whether an edit lands on
      the grid. With it on, a note moved or resized ends on the nearest step
      and a bar line lands on a step; with it off, both go exactly where the
      finger left them. It is on to begin with, kept with the note, and never
      changes what was heard — only where an edit settles. Verified by
      asserting a note edited with snapping on sits on a step, that the same
      edit with it off does not, and that a note nobody edited is untouched
      either way.

      Bars snapped and notes did not, which was never a decision — the bar
      drag was written against a grid and the note edits were written against
      milliseconds. So a take could not be tidied onto its own grid, and a bar
      could not be placed anywhere but on it. One control now says which
      behaviour is wanted, for both.

      On to begin with, because a grid exists to be landed on: somebody who
      has a tempo and bar lines is usually trying to make the notes agree with
      them, and the person who wants a note exactly where they sang it is the
      one who will go looking for the switch.

      It moves edits, never readings. What was heard stays what was heard,
      and turning snapping off afterwards leaves the edits already made where
      they were put — an edit is a decision, not a preference re-applied.

