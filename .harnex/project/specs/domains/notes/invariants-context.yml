# A second take sung against the first, as context for reading the harmony.
# Its own file: the chord invariants are at their line budget.
invariants:
  - id: INV-NOTES-071
    description: A sung bass decides the root, without overruling the melody
    severity: major
    check: >
      Where a context layer is sounding, the chord read over that span
      prefers the chord rooted on the bass pitch class, and where nothing
      is sounding in the layer the read is exactly what it was without
      one. The preference is a weight and not a constraint: a melody that
      strongly implies another chord can still win. Verified by asserting
      an ambiguous span resolves to the bass's root, that an unambiguous
      contradiction survives, and that a span the layer does not cover is
      byte-for-byte the reading it had before.

      A monophonic melody only implies harmony, which is why naming a
      chord from three sung pitch classes is a guess dressed as a
      reading. The one thing the system cannot know is what the singer
      heard underneath — and the singer can simply sing it. A root is the
      single most decisive piece of that, and the chord matcher already
      had somewhere to put one.

      A weight rather than a rule because the layer is a performance too:
      it can be sung as an inversion, and it is read by the same detector
      that misreads the melody.

  - id: INV-NOTES-072
    description: Where the bass moves is where the chord changes
    severity: major
    check: >
      With a context layer present, the proposed downbeats are the moments
      its pitch class changes, rather than the moments the melody's
      harmony appears to turn over. Without one, the melodic reading is
      unchanged. A layer that never changes pitch proposes one downbeat at
      its first note, not none. Verified by asserting the proposals follow
      the layer's changes and that removing the layer restores the
      melodic proposal exactly.

      Reading harmonic rhythm out of a melody alone is the weakest
      inference in the pipeline and the one most often corrected by hand.
      A bass line states it outright: the chord lasts until the bass
      moves.

  - id: INV-NOTES-073
    description: A context layer is a recording like any other
    severity: major
    check: >
      A layer is captured, stored, detected, drawn and sounded by the same
      path as the first take, and can be silenced from the same place as
      the other tracks. Muting it silences it without withdrawing it from
      the reading. Verified by asserting a layer round-trips through
      storage as a take does, and that muting changes what is heard and
      not what is read.

      It is a performance of part of the idea, not a setting. Anything
      that treated it as configuration would have to reimplement capture,
      detection and playback, and would drift from them.

      Muting is about the ear, not the analysis: the reason to silence the
      bass is to hear the melody alone, and losing the harmony reading at
      the same moment would be a second, unasked-for change.

  - id: INV-NOTES-074
    description: An overdub is placed where it was sung, not where it was heard
    severity: critical
    check: >
      A layer captured against a playing take has the round-trip latency
      subtracted from every one of its timings before it is stored, and
      the amount subtracted is kept with the layer. The correction is the
      output latency plus the input latency plus one buffer, read from the
      audio session at the moment of capture rather than assumed. A layer
      captured with no take playing under it is corrected by nothing.
      Verified by asserting the stored timings equal the detected ones
      less the reported latency, and that the amount stored is the amount
      applied.

      A voice sung against playback reaches the microphone after the
      output and input paths have both run, so every onset lands late by
      a fixed few tens of milliseconds. Left alone, every downbeat this
      layer states is dragged late with it — which would make a take read
      worse with the layer than without one, and the feature would be
      worth less than nothing.

      Fixed per device rather than guessed at one number: the round trip
      differs between the built-in speaker, wired headphones and
      Bluetooth, and Bluetooth is far enough out that a constant would be
      wrong on every route but the one it was measured on.

      Stored rather than folded silently into the timings, so a
      correction that is wrong can be seen to be wrong instead of being
      inferred from bass lines that all sit slightly late.

  - id: INV-NOTES-087
    description: An overdub keeps the take audible and out of the microphone
    severity: critical
    check: >
      A capture recorded while something is playing uses an audio session
      that leaves the playback sounding and applies echo cancellation; a
      first take, with nothing playing, keeps the measurement session that
      strips all processing. Verified by asserting the capture is started
      as an overdub whenever a layer is being sung.

      Measurement mode is right for a first take — nothing between the
      voice and the detector — and exactly wrong for a second one. It
      takes the session, so the take the singer is singing against goes
      silent; and with no echo cancellation the microphone hears that take
      through the speaker, so the detector reads the melody back as the
      bass line it was supposed to be reading.

  - id: INV-NOTES-088
    description: A second voice is counted in, at the take's own tempo
    severity: major
    check: >
      A click track is offered whenever the take has room before its first
      note, counting back from that note at the take's own tempo and
      landing a marked click on the note itself. It counts only into the
      pickup that exists, and is silent for a take that begins
      immediately or has no tempo. It is a track like any other, with its
      own level and mute, off until asked for. Verified by asserting the
      clicks land on the beat before the first note and that a take with
      no pickup produces none.

      Singing a second part against a take means knowing when to come in,
      and a take gives no cue at all — the first thing heard is the thing
      you were supposed to be ready for.

      Where the take has no room for the whole count, the take waits
      rather than the count being cut short. A shortened count is worse
      than none: the singer comes in on a beat that was never
      established. This is also the common case — most takes begin near
      their first note, which is exactly when a second voice most needs
      telling when to come in, so offering the count only to takes with a
      pickup offered it almost nowhere.

  - id: INV-NOTES-089
    description: An overdub plays out of the speaker, not the earpiece
    severity: critical
    check: >
      A capture started as an overdub forces output to the speaker.
      Verified by asserting the speaker override is applied on the overdub
      path and not on a plain take.

      The voice-chat session that keeps playback alive and cancels the
      echo also routes output to the receiver, whatever the category
      options asked for — it is built for holding a phone to your ear.
      Left alone it plays the take into the side of the singer's head at
      conversation volume, which from arm's length is indistinguishable
      from it not playing at all.

  - id: INV-NOTES-090
    description: An overdub follows the ear
    severity: major
    check: >
      While a layer is being sung, output goes to the speaker when the
      phone is held away and to the earpiece when it is held to the head,
      switching as the phone moves. On a device with no proximity sensor
      it stays on the speaker. Verified by asserting the route is set from
      the sensor's state on every change while overdubbing, and that
      monitoring is turned off when the capture ends.

      A part is sung both ways: held out while working on a phrase, and
      up to the ear in a room where a speaker would be rude or would bleed
      into the microphone. Asking which would be a setting about where the
      phone is, which the phone already knows — the same reason a call
      does this without being asked.

      Only during an overdub. Nothing else here plays and records at once,
      and a sensor that dimmed the screen and moved the audio during
      ordinary listening would be a phone call nobody made.

  - id: INV-NOTES-115
    description: A take is read according to what it was recorded as
    severity: major
    check: >
      A recording carries a role. A mixed take is read for both notes and
      hits; one recorded as a melody or a bass line is read for notes and no
      hits are looked for; one recorded as drums is read for hits and no notes
      are looked for. A declared drum track accepts quieter and longer hits
      than a mixed take will. Every role that reads notes reads the same notes.
      Verified by asserting each role returns only what its role has, that a
      soft long hit is found in a declared drum track and refused in a mixed
      one, and that the notes are identical across roles.

      The first take of an idea is somebody switching between humming and
      drumming without announcing it, so it has to be read both ways and
      guessed at — and that guess will need tuning for as long as the app
      exists. A track recorded deliberately is not a guess, and knowing which
      is worth more than any amount of cleverness on ambiguous input: told
      that a track is drums, the reader stops asking whether each sound might
      have been a note, and every borderline case resolves the right way
      rather than being argued about.

      So the role is not a label on a recording. It is the instruction for how
      to read it, and the mixed reading is best-effort precisely because it is
      the only one nobody declared.

      What a note is does not change with the role. Two roles disagreeing
      about the same singing would be two segmenters wearing one name, which
      is the failure INV-PITCH-021 exists to prevent.

  - id: INV-NOTES-116
    description: The audio is the take; everything else is a reading of it
    severity: critical
    check: >
      A take can be read again from its recording, replacing the melody, the
      hits and everything derived from them, and carrying the version of the
      reading that produced them. The interpretation is not touched. The
      offer appears only on a take an older reading produced, states that the
      reading will be replaced before it is taken, and reports when the
      recording could not be opened rather than appearing to succeed.
      Verified by asserting the offer is absent on a current take, present on
      an older one, that it names what it replaces, and that a failure to open
      says so.

      A take has exactly two things that cannot be produced again: the
      recording, and what a person did to it. The melody, the hits, the
      chords, the grid, the key and the tempo are all readings of the first.
      Treating them as stored facts rather than as a cache is what made every
      improvement to the engine reach only the next recording — the library
      kept whatever it was given on the day.

      So re-reading goes back to the audio rather than to stored frames.
      Frames would let the symbolic stages improve and nothing else, and the
      changes worth carrying back are as often in the engine: a detector that
      hears a quiet whistle, or a transform that can tell a thump from a hiss,
      is no use to a take whose frames were captured before it existed.

      The version is what makes staleness a fact rather than a guess. Without
      it the only honest offer is one on every take in the library, which
      trains a person to ignore it. A version from the future is not stale: a
      bundle can be older than the take it is reading, and re-reading there
      would be the one case that makes things worse.

      Interpretations survive because edits are anchored to the moment the
      detector first heard them (INV-NOTES-096) and replay against whatever is
      read now. An edit whose note is no longer heard finds nothing, which is
      the honest outcome and precisely what the warning has to say.

  - id: INV-NOTES-122
    description: A layer is a recording; a track is a channel
    severity: major
    check: >
      A layer carries audio, a role and a reading of its own, and its role
      decides how it is read: a bass line and a melody for notes, drums for
      hits, anything undeclared the way a first take is read. A role the build
      has never seen falls back to undeclared rather than refusing. A layer's
      hits are shifted by the same latency its notes are. Verified by
      asserting each role maps to its reading, that an unknown one falls back,
      and that every role says what it is for.

      The two are deliberately different and stay different. A TRACK is a
      channel in the mixer — a level, a switch and a bus, declared once
      (INV-NOTES-121) — and most tracks are readings of the take that own no
      audio at all. A LAYER is a second performance: it owns a recording, and
      a recording is the one thing about a take that cannot be produced again
      (INV-NOTES-116). Every layer sounds through a track and no track needs a
      layer, which is the whole of the relationship.

      Merging them would lose exactly that. A reading can be thrown away and
      made afresh; a recording cannot, and a model that cannot tell them apart
      cannot safely re-read anything.

      The role had been carried all the way to storage and never consulted, so
      a layer recorded as drums was read as singing — the reader was told what
      it was looking at and ignored it. Being told is worth more than any
      amount of cleverness on ambiguous input (INV-NOTES-115), and it was the
      reason for declaring the role in the first place.

      Hits are aligned with the notes because a layer is heard back through
      the speaker and recorded again, so everything in it lands late by the
      round trip (INV-NOTES-074). Correcting one and not the other would put a
      drum and the note struck with it in two different places.
