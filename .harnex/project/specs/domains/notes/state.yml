# Domain Development State — overwrite each meaningful change
updated_at: "2026-08-22T23:59:00Z"
updated_by: agent
phase: specifying
phase_detail: >
  Specs written from a crawl of screens/Notes, analysis/note.ts, the
  data layer, and the notes table in migration 0001. 12 capabilities,
  20 invariants, 35 acceptance tests, 2 views, 11 interactions.

  The detail view now draws the take as sung or as written down
  (notes.set_notation_view, INT-NOTES-015, ACC-NOTES-036/037), which is
  INV-NOTES-026 — until now only about what play sounded — extended to
  what the graph and the note list show. logic/notation.ts holds the
  mapping: as written puts each onset on its gridStartMs at its
  gridDurationMs and zeroes the cents, since notation has no way to say
  a note was fourteen cents flat. useNotationView holds the choice and
  forces it back to as sung when a take has no grid. SeeItAs is the
  control, above the graph so the picture and the control that changes
  it are visible together, leaving the chord cards straight after the
  graph (INV-NOTES-029). It is a second control rather than a second
  use of HearItAs on purpose: reading the notation while hearing the
  raw take is how the detector and the quantizer are told apart. The
  segmented row both use was lifted into ModeChoice.

  The melody control under that graph is a toggle: the press that
  sounds the melody stops it again (notes.play_melody, INV-NOTES-031,
  INT-NOTES-016, ACC-NOTES-038/039). It was a one-way press, so a
  melody, once started, ran to its end whatever the singer did while
  the button went on offering to start it — the take's transport had
  already been made a toggle for that reason (INV-NOTES-030).
  useTonePreview now owns the one preview voice the detail view has —
  the melody, a tapped note, a tapped chord — which is what makes the
  state honest: anything else taking that voice, the reading changing
  beside it, the melody running out on its own timer, or the view
  going away all put the control back to offering play. HearItAs draws
  it, with a square rather than a pause since what it ends starts
  again from the top; Icon gained that glyph. The melody heard *over*
  the take keeps its own player, but no longer its own switch: that is
  now its track toggle (INV-NOTES-027).

  Play on the detail view sounds the take and the chord backdrop
  together (notes.play_backdrop, INV-NOTES-018, ACC-NOTES-032), and
  sounds it where the take already is (INV-NOTES-020, ACC-NOTES-035).
  The chords cannot be scheduled in the instant the audio starts — a
  render commits and an audio context is built first — so usePlayback
  marks the take's start (useTakeAnchor, beside usePlaybackClock) and
  usePlaybackMix hands that elapsed reading to the backdrop, which
  shifts the progression onto it: a slot already passed is dropped, the
  one underway starts where the take is and still ends where it ends.
  Chords sounded alone are given 0, having nothing to catch up to.
  Backdrop specs were split into acceptance/backdrop.yml for the
  150-line budget.
  useChordTrack voices the whole track once, from the same floor an
  audition uses, so an edit made before the press is the chord that
  plays; useChordBackdrop flattens those slots into reference tones on
  the take's own clock — melody and audio are both measured from the
  capture's start, so no second clock is needed — at a lower per-tone
  gain than an audition, on its own AudioContext so a tap does not cut
  it off.

  What a press sounds is turned beside it, one toggle per track — take,
  chords, melody (notes.set_playback_mix, INV-NOTES-019, INT-NOTES-011,
  ACC-NOTES-033/034/040/041). The maintainer asked to drop the "play
  over the recording" switch once the toggles covered the tracks, which
  they only could once the melody was one of them: three tracks cannot
  be named by a single exclusive pick. playbackTracks.ts holds the mix
  shape, the default (take and chords on, melody off — what the old
  choice and the switch together already gave), and the two locks that
  stop a control promising a sound nothing makes: the last audible
  track cannot be turned off, and the melody cannot be turned on with
  no take to ride. usePlaybackMix is the single transport over all
  three: usePlayback for anything with a take in it, and for chords
  alone the backdrop itself, ended on a timer the length of the
  progression. No take means the resolver is never called, so such a
  press mints no file token (useChordBackdrop reports durationMs). The
  backdrop is still driven from the transport through a ref, so
  re-voicing mid-take cannot restart it, and a track turned mid-play
  stops what is sounding. PlaybackBar holds the mix and offers only the
  tracks a note has; PlaybackMixToggle is the control, and MelodyMix
  under the graph is now the melody's level alone. PlaybackButton,
  interactions-playback, acceptance/playback-mix and
  __fixtures__/renderPlaybackBar were all split off for the budgets.

  A chord slot answers only vertical drags and taps (INV-NOTES-017,
  INT-NOTES-005). The card used to lock an axis mid-drag and read
  sideways movement as a shape change, which meant the horizontal
  scroll view holding the track never saw that drag: later bars were
  unreachable and trying to reach them edited a chord. Shape now steps
  on a double tap, which wraps, so one gesture reaches every quality.
  ChordCard was split out of ChordTrack for the 150-line budget and
  ChordCard.test.tsx pins the gesture axes; the shared reanimated mock
  gained useEvent and setGestureState, without which rendering any
  GestureDetector under jest throws.

  The line above a card's play control is the take's clock
  (INV-NOTES-016, ACC-NOTES-030/031): the length at rest, the running
  position against that length while the take plays. It stands in the
  space the close control vacated. usePlaybackClock owns the ticking —
  wall clock, not the audio clock, since audioApi.ts types no position —
  and usePlayback exposes it as positionMs; formatPlaybackCounter bounds
  it by the take's length. Playback specs were split out
  (invariants-playback.yml, acceptance/playback.yml) and the NoteCard
  suite with them (NoteCardTime.test.tsx, playbackCounter.test.ts, over
  shared __fixtures__), all to hold the 150-line budget.

  The list card's play button is the card's player (INT-NOTES-010,
  INV-NOTES-015): NoteCard holds usePlayback directly, so the press
  starts the take and turns that same button into Stop. It no longer
  discloses a PlaybackBar — which meant a second play button and a
  Close for a player the singer never opened — and shouldAutoPlay,
  whose only consumer that was, is gone. A decode failure now reads as
  a line beside the control. A card whose note has no audioPath shows
  no play button at all, which is what the capability already
  promised. PlaybackBar remains the note detail view's player.
  NoteCard and PlaybackBar were split —
  NoteCardMeta, NoteCardActions, noteCardFormat, usePlayback, audioApi
  — to bring both back under the 150-line budget.

  Three product commitments that were previously only prose in the
  design doc are now invariants: every capture is kept with no score
  gate (INV-NOTES-001), a note is described and never graded
  (INV-NOTES-002), and the persisted melody is the source of truth so
  no later question re-touches the audio (INV-NOTES-003).
blockers:
  - >
    No verification target. Acceptance tests report SKIP until an
    adapter with a fake engine and a row-level-security-enforcing fake
    backend client is wired.
known_conflicts:
  - >
    NoteDetailScreen.tsx is 412 lines, well over the 150-line file
    budget, and its component function is longer than 40 lines. Both
    pre-date the notation choice and the melody toggle, which each put
    their own logic in a hook (useNotationView, useTonePreview) so the
    screen only wires them. Splitting the screen is a refactor of its
    own and there is no test over it to hold a split honest.
  - >
    usePlayback.play() is 49 lines, over the 40-line function budget. It
    was already 47 before the backdrop was aligned to the take's clock;
    splitting it would move the decode-and-start sequence, which two
    separate playback fixes already turned over, and pushes the file past
    150 lines. Left as it is, deliberately.
  - >
    test-extensions.yml is 160 lines, over the 150-line spec-file
    budget. The framework loads exactly one test-extensions.yml per
    domain (test_executor.py) with no sibling glob, unlike entities,
    capabilities and invariants. Splitting is impossible and cutting the
    resolution prose would leave the patterns unimplementable, so the
    overage is deliberate.
    Filed upstream as harnex#153.
