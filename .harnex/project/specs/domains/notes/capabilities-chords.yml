# The chord-track editing session. Split from capabilities.yml to stay
# inside the 150-line spec-file budget (Axiom 3).
capabilities:
  - name: notes.open_chord_track
    description: >
      Build the harmonic backdrop for a note's melody and hold it as an
      editing session, keeping the inferred progression alongside the
      singer's changes.
    actor: singer
    implemented_by: packages/client/src/screens/Notes/useChordTrack.ts
    parameters:
      required: [melody]
      optional: [grid, chordsPerBar]
    preconditions:
      - the note belongs to the signed-in singer
    postconditions:
      - the progression is inferred from the persisted melody
      - every slot starts unedited
      - hasEdits is false on a freshly opened track
      - an empty melody yields an empty track rather than an error
    permissions:
      - role: singer
        notes: The track is derived from the singer's own note.

  - name: notes.edit_chord
    description: >
      Change one chord in the backdrop — nudge it through the key, step
      its shape, or set it outright — and remember that it was changed.
    actor: singer
    implemented_by: packages/client/src/screens/Notes/useChordTrack.ts
    parameters:
      required: [index]
      optional: [degrees, step, rootPc, quality]
    preconditions:
      - index names a slot that exists in the track
    postconditions:
      - the change is applied by the pure transform in transcription
      - the changed slot is marked as edited
      - hasEdits becomes true
      - no other slot changes
      - re-inference leaves the changed slot alone
    permissions:
      - role: singer
        notes: Editing is local to the session until the singer keeps it.

  - name: notes.revert_chord
    description: >
      Put one slot, or the whole track, back to what the melody implied.
    actor: singer
    implemented_by: packages/client/src/screens/Notes/useChordTrack.ts
    parameters:
      required: []
      optional: [index]
    preconditions:
      - the track has at least one slot
    postconditions:
      - a reverted slot carries the inferred chord and is no longer edited
      - reverting every slot sets hasEdits false
      - reverting a slot that was never edited changes nothing
    permissions:
      - role: singer
        notes: Reverting is local to the session.

  - name: notes.audition_chord
    description: >
      Sound one chord from the backdrop so the singer can hear it under
      their line.
    actor: singer
    implemented_by: packages/client/src/screens/Notes/useChordTrack.ts
    parameters:
      required: [index]
    preconditions:
      - index names a slot that exists in the track
    postconditions:
      - the chord sounds for the track's audition length
      - the voicing sits at or above the backdrop's floor so it does not
        compete with the sung line
      - auditioning does not mark the slot as edited
    permissions:
      - role: singer
        notes: Local playback only.

  - name: notes.play_backdrop
    description: >
      Sound the whole backdrop under the take, so pressing play gives the
      singer their line and the harmony it implied together rather than
      the bare recording.
    actor: singer
    implemented_by: packages/client/src/screens/Notes/useChordBackdrop.ts
    parameters:
      required: [progression]
      optional: [elapsedMs]
    preconditions:
      - the take is playing
    postconditions:
      - each chord sounds across its own slot, on the take's own clock,
        because melody and audio are measured from the same capture start
      - the progression is placed against how far the take has already
        run, so the gap between the audio starting and the backdrop being
        scheduled does not put the harmony behind the line
      - a slot the take has already passed is not sounded, and the slot
        underway starts where the take is and ends where the slot ends
      - the backdrop uses the voicing an audition of that slot would use
      - the backdrop sounds quieter than an audition, which is heard alone
      - a slot the grid places before the take begins is clamped to its
        start rather than scheduled in the past
      - a track with no slots plays the take alone
    permissions:
      - role: singer
        notes: Local playback only.

  - name: notes.set_playback_mix
    description: >
      Choose what pressing play sounds — the take alone, the chord
      backdrop alone, or both — so the harmony a line implied can be
      heard without the line sitting on top of it.
    actor: singer
    implemented_by: packages/client/src/screens/Notes/usePlaybackMix.ts
    parameters:
      required: [mix]
    preconditions:
      - the note has stored audio
      - the note's melody implied at least one chord
    postconditions:
      - the choice is take, chords, or both, and both is what a note
        offers before anything is chosen
      - a press sounds exactly the chosen sources and nothing else
      - choosing the chords alone mints no audio URL and decodes no take
      - the chords alone end when the progression runs out, handing the
        control back to offering play
      - changing the choice while something is sounding stops it, so no
        mix is ever half-applied
      - a melody that implied no chords offers no choice at all
    permissions:
      - role: singer
        notes: Local playback only.
