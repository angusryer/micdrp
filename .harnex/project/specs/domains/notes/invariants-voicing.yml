# A chord's individual notes: moving them, silencing them, and what that does
# to the chord they belong to. Split for the 150-line spec-file budget.
invariants:
  - id: INV-NOTES-036
    description: A chord is named after the notes it actually has
    severity: critical
    check: >
      When a chord's notes are moved, the slot is renamed to whatever
      they now spell, if they spell anything: its root, quality, label
      and roman numeral all follow. Notes that spell nothing recognised
      leave the slot named as it was and marked altered. Verified by
      asserting that moving the third of a major chord down a semitone
      renames it minor, and that a note moved somewhere that spells no
      chord leaves the name alone and sets the altered flag.

      Dragging notes about is how a chord is built here — the point of
      putting them on the graph was to make harmony something you shape
      by hand rather than choose from a list. A shape that kept its old
      name while sounding like something else would be the interface
      lying about what it just made.

      This was written the other way round at first, out of a worry that
      renaming on every nudge would rewrite the harmony under someone
      mid-experiment. That worry was misplaced: a nudge that does not
      change what the notes spell does not change the name either, since
      the name is read from the notes. Renaming happens exactly when
      something else is now being sounded, which is exactly when saying
      so is useful.

  - id: INV-NOTES-037
    description: A silenced note is quiet, not gone
    severity: major
    check: >
      A silenced note is absent from what sounds while remaining visible
      and able to be brought back by the same gesture that silenced it.
      Silencing every note of a slot leaves the slot present and empty
      rather than deleting it. Verified by asserting a silenced note is
      missing from the voiced output, still present in the slot, and
      restored by silencing it again.

      Leaving out the fifth is a voicing a piano player makes without
      thinking, not a different chord. And an edit that cannot be undone
      by the gesture that made it is a trap: the singer has to know they
      can try something.

  - id: INV-NOTES-038
    description: Moving the chord carries its voicing along
    severity: critical
    check: >
      Nudging a whole slot through the key, or stepping its shape, moves
      every note with it and keeps the voicing: an individual note's
      offset is held relative to its chord tone rather than as an
      absolute pitch, and a silenced note stays silent. Verified by
      asserting that a voiced-then-transposed slot and a
      transposed-then-voiced slot sound the same notes.

      An offset stored as an absolute pitch would be undone by the next
      transpose, so the singer's own adjustment would quietly survive
      until they moved the chord and then vanish.

  - id: INV-NOTES-039
    description: A voicing is kept the way every other edit is kept
    severity: major
    check: >
      Offsets and silences travel through the same collect-and-replay
      path as the rest of a chord edit, anchored to a moment rather than
      to a slot number, and round-trip unchanged. A voicing whose moment
      lands in no slot is dropped rather than applied to whatever now
      occupies that position. Verified by round-tripping a voiced
      progression and by replaying a voicing whose slot has gone.

      Only differences from what was inferred are stored (INV-NOTES-022),
      and a voicing is a difference like any other. Applying an orphaned
      one to whichever chord happened to move into its place would put
      notes the singer never chose into a chord they never edited.

  - id: INV-NOTES-040
    description: The root has a voice of its own
    severity: major
    check: >
      The root of each chord sounds on its own bus, apart from the rest
      of the chord, so it can be mixed or silenced without touching them.
      Silencing the root's note in the chord silences that voice too —
      there is one decision about whether a root sounds, not two.
      Verified by asserting the root bus carries one note per slot at the
      chord's root, and nothing when that note is silenced.

      A bass under a line is heard as the ground the harmony stands on
      rather than as another note in it, and it is the one voice a phone
      speaker struggles with most. Giving it its own level is what lets
      it be turned up on headphones and down when it is only rattling.

  - id: INV-NOTES-051
    description: A chord note is picked up before it moves
    severity: critical
    check: >
      A chord's note does not move on contact. It is held first, and
      only then does dragging take it — and while held it says so, and
      is felt. Verified by asserting a drag that begins on a note
      without a hold leaves the chord alone.

      The band sits inside a graph that scrolls and pinches, so a finger
      landing on a note is the common case rather than the rare one.
      Without a hold, every attempt to move along the take or look
      closer would rewrite the harmony instead — the same fault the bar
      lines had, and the same fix (INT-NOTES-012).

  - id: INV-NOTES-052
    description: A chord's notes are coloured by the part they play
    severity: major
    check: >
      Every note of a chord is drawn in a colour fixed by which member
      of the chord it is — root, third, fifth, seventh — and not by
      where it sits on the screen. The colours run in spectrum order
      from the root upward, so the ordering itself carries the meaning.
      A silenced note keeps its colour and is drawn as an outline, and a
      note in hand keeps it too. Verified by asserting the colour of a
      note follows its position in the chord across renamings and
      inversions.

      Colour is what makes the root findable at a glance in a band of
      small rectangles, and findable is what makes it draggable with
      intent. It also makes renaming legible: pull the fifth of a C up
      to A and the chord becomes A minor, and the note being dragged
      turns from the fifth's colour to the root's — the reading is
      visible in the thing that changed rather than only in a label
      elsewhere.

      By part and not by height, because the two only agree in root
      position. Once a note has been moved, or a chord inverted, the
      lowest thing on screen may not be the root — and it is the root
      the eye is looking for.

      Colour reinforces; it never carries a fact alone. Vertical
      position remains the pitch and the label remains the name, since
      red against green is the commonest way for colour to fail a
      reader.
