# A chord's individual notes: moving them, silencing them, and what that does
# to the chord they belong to. Split for the 150-line spec-file budget.
invariants:
  - id: INV-NOTES-036
    description: A chord keeps its name while its voicing changes
    severity: critical
    check: >
      Moving or silencing one of a chord's notes leaves the slot's root
      and quality alone, so its label and its roman numeral still read.
      A slot whose notes no longer spell the chord it is named after is
      marked as altered rather than renamed. Verified by asserting that
      a slot's label, roman and root survive every voicing change, and
      that a note moved off a chord tone sets the altered flag.

      The root and quality are what the diatonic drag steps through and
      what the roman numeral is read from. Renaming the chord every time
      a note is nudged would rewrite the harmony underneath the person
      experimenting with it, and the numeral would stop describing where
      they are in the key.

  - id: INV-NOTES-037
    description: A silenced note is quiet, not gone
    severity: major
    check: >
      A silenced note is absent from what sounds while remaining visible
      and able to be brought back by the same gesture that silenced it.
      Silencing every note of a slot leaves the slot present and empty
      rather than deleting it. Verified by asserting a silenced note is
      missing from the voiced output, still present in the slot, and
      restored by silencing it again.

      Leaving out the fifth is a voicing a piano player makes without
      thinking, not a different chord. And an edit that cannot be undone
      by the gesture that made it is a trap: the singer has to know they
      can try something.

  - id: INV-NOTES-038
    description: Moving the chord carries its voicing along
    severity: critical
    check: >
      Nudging a whole slot through the key, or stepping its shape, moves
      every note with it and keeps the voicing: an individual note's
      offset is held relative to its chord tone rather than as an
      absolute pitch, and a silenced note stays silent. Verified by
      asserting that a voiced-then-transposed slot and a
      transposed-then-voiced slot sound the same notes.

      An offset stored as an absolute pitch would be undone by the next
      transpose, so the singer's own adjustment would quietly survive
      until they moved the chord and then vanish.

  - id: INV-NOTES-039
    description: A voicing is kept the way every other edit is kept
    severity: major
    check: >
      Offsets and silences travel through the same collect-and-replay
      path as the rest of a chord edit, anchored to a moment rather than
      to a slot number, and round-trip unchanged. A voicing whose moment
      lands in no slot is dropped rather than applied to whatever now
      occupies that position. Verified by round-tripping a voiced
      progression and by replaying a voicing whose slot has gone.

      Only differences from what was inferred are stored (INV-NOTES-022),
      and a voicing is a difference like any other. Applying an orphaned
      one to whichever chord happened to move into its place would put
      notes the singer never chose into a chord they never edited.

  - id: INV-NOTES-040
    description: The root has a voice of its own
    severity: major
    check: >
      The root of each chord sounds on its own bus, apart from the rest
      of the chord, so it can be mixed or silenced without touching them.
      Silencing the root's note in the chord silences that voice too —
      there is one decision about whether a root sounds, not two.
      Verified by asserting the root bus carries one note per slot at the
      chord's root, and nothing when that note is silenced.

      A bass under a line is heard as the ground the harmony stands on
      rather than as another note in it, and it is the one voice a phone
      speaker struggles with most. Giving it its own level is what lets
      it be turned up on headphones and down when it is only rattling.

  - id: INV-NOTES-048
    description: The chords sit where the downbeats were placed
    severity: critical
    check: >
      Every chord slot begins at a downbeat and runs to the next one,
      whatever their number or spacing, and the last runs to the end of
      what was sung. Moving a downbeat moves the chord that starts
      there; adding one opens a new chord; taking one away gives its
      span to the chord before it. Verified by asserting a progression
      built from a set of downbeats has one slot per downbeat, spanning
      exactly the gaps between them.

      A downbeat is where a new chord may start — that is what the line
      means, and the harmony has to be the same object rather than a
      second structure drawn on the same timeline. Until now the slots
      came from an even division of the detected grid and never saw the
      arrangement at all, so dragging a line moved the line and nothing
      else, and the two drifted apart in front of the singer.

      The number of chords is therefore the singer's, not the metre's.
      Two chords inside what would be one bar is two downbeats close
      together, and needs no bar to be redefined to say so.

  - id: INV-NOTES-049
    description: The opening downbeats are read from the music, not counted out
    severity: major
    check: >
      A take opens with downbeats where its implied harmony turns over:
      at every note onset, the run of notes before it is weighed against
      the run after, and the onset is proposed when the two spell
      different chords. Never closer together than a beat, and always
      one at the first note. Verified by asserting a melody whose
      harmony changes once is proposed two downbeats, at the start and
      at the change, and that a melody implying one chord throughout is
      proposed a single one.

      An even division counted out from a detected tempo is a guess
      about metre wearing the clothes of a reading. Where the harmony
      turns over is the thing a downbeat actually marks, and it is
      measurable.

      The runs are counted in notes, not in milliseconds. A chord is
      established by notes: a fast passage packs six into two seconds
      and a slow one holds two, so any fixed span reads the first as
      noise and the second as silence. The same phrase sung fast and
      sung slow must be read the same way, and only a note count does
      that. Three is the fewest that can spell a chord — two notes are
      an interval, and an interval belongs to several chords equally.

      Candidates are onsets and nothing else, so no boundary needs
      pulling into place afterwards: a chord starting in the middle of a
      held note is almost never what was meant.

      Gaps that are already nearly even are evened out, since most
      people sing to a regular pulse and a proposal that wobbles by a
      semiquaver reads as wrong rather than as precise. Gaps that are
      not nearly even are left alone: that is a take with its own
      shape, and straightening it would be the rigid model this whole
      arrangement exists to avoid.

  - id: INV-NOTES-050
    description: Metre is read back from the downbeats, and never has the last word
    severity: major
    check: >
      A time signature is derived from the spacing of the placed
      downbeats rather than constraining where they may go, and is
      carried as a suggestion that a person's own choice replaces
      outright. Nothing in the editing surface consumes it. Verified by
      asserting a reading is produced from a set of downbeats, and that
      a stated override survives in its place.

      The reading takes the largest grouping the spacing is consistent
      with, not the spacing itself. Downbeats every two beats are as
      much a bar of four with harmony changing halfway as a bar of two,
      and four is the better guess — reading the gap directly would put
      the half-bar problem back, one stage further down.

      It cannot be authoritative because it cannot see intent. Three
      half notes meant as a bar of four are six beats to any arithmetic,
      and only the person who sang them knows they were not six four.
      So the last step before anything is written out is a human's.
