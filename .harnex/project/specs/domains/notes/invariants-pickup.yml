# The pickup, and the view following a rewind. Its own file: the pickup
# stopped being a measurement of the take and became a thing a person makes.
invariants:
  - id: INV-NOTES-250
    description: A pickup is stated, never worked out
    severity: critical
    check: >
      A take has no pickup until somebody makes one. Nothing reads a pickup
      out of where the singing starts, and opening a take that has never
      had one shows none. Verified by asserting a freshly read take
      reports no pickup whatever its opening silence.

      The old pickup was a measurement — how far into a bar the singing
      began — worked out from wherever the first bar line landed. That
      makes it a consequence of the bar lines rather than a statement about
      the music, so it moved whenever they did and said something nobody
      had claimed. A count-in is a decision: how many beats you would give
      somebody before they came in. Only the person who wrote the tune
      knows it, and before this there was no way for them to say it.

  - id: INV-NOTES-251
    description: A pickup's pulse is the steadiest run of the taps that made it
    severity: critical
    check: >
      A pickup is made by playing the take and tapping along, then
      stopping. The beat comes from the steadiest run of consecutive taps
      in that pass, not from all of them: a pass begins before the hand has
      settled and ends after it has stopped meaning it, and averaging those
      in moves the answer away from the pulse actually played. Verified by
      asserting a pass with ragged taps at each end reports the pulse of
      the steady middle.

      Fewer than three taps say nothing about a rate — two are an interval,
      and an interval alone says nothing about whether it would have
      happened again (INV-NOTES-198). A pass with fewer is refused rather
      than guessed at.

      This pulse spaces the pickup's beats and nothing else. It is not
      applied to the take: a pass tapped to size a count-in would otherwise
      move every bar line through the whole take, which is the silent
      re-cutting INV-NOTES-161 exists to prevent.

  - id: INV-NOTES-252
    description: A pickup lives before the recording, and the graph opens to let it in
    severity: critical
    check: >
      A pickup's beats sit before the singing, and the drawing widens to
      the left to show them. Nothing of the recording moves: the audio,
      the notes, the beats and every stored moment stay exactly where they
      were. Verified by making a pickup and asserting the take's notes are
      at the same moments as before, while the drawn window now begins
      earlier.

      Before the *singing*, not before the recording. A person presses
      record, waits, and then comes in, so the recording's first moment is
      somewhere in that silence and a count ending there counts in nothing.
      A count is made to be come in on, so it ends where the coming in
      happens: at the first sung note by default, and wherever it is
      dragged to after (INV-NOTES-268).

      Widened rather than shifted, because the take is a recording of
      something that happened and its moments are facts. A count-in is
      something added in front of it, and moving the recording to make room
      would rewrite every one of those facts to record a decision about
      what comes before them.

  - id: INV-NOTES-253
    description: Nothing of the take goes into the pickup unless the pickup is moved over it
    severity: major
    check: >
      A note added, moved or lengthened, and a beat tapped or moved, stay
      at or after the take's first moment however far the finger travels.
      The pickup itself can be dragged later, and where it is dragged over
      the start of the take the two overlap and the rule does not stop
      anything already there. Verified by dragging a note past the start of
      the take and asserting it stops there, and by dragging the pickup
      over the take and asserting nothing of the take moved.

      The pickup is empty by construction — it is counted, not sung — so a
      note in it would be a note in a place where, by definition, nothing
      was performed. Moving the pickup is the one way to say the count-in
      and the singing overlap, and that is a statement about the count
      rather than about the take.

  - id: INV-NOTES-254
    description: Rewinding takes the view back with the head
    severity: major
    check: >
      A press of rewind puts the beginning of the take in the middle of the
      drawing, whether or not it was sounding, and a hand that had scrolled
      away no longer holds the view back. Verified by scrolling away from
      the start, rewinding a stopped take, and asserting the view moved.

      Rewind goes to the beginning (INV-NOTES-160), and the head goes with
      it — but the view did not, so the control moved a line that was off
      screen and looked like it had done nothing at all. The view follows
      the head while a take sounds; the one moment it was not following was
      the moment a person asked for the head to move.

  - id: INV-NOTES-268
    description: The count-in is a block that can be dragged onto the singing
    severity: major
    check: >
      The count-in is drawn as one block spanning its beats, and dragging
      it moves the whole count — every beat keeping its spacing — so its
      end can be put on the moment the singing starts. The take does not
      move with it (INV-NOTES-253). Where it lands is kept with the note
      and survives reopening. Verified by dragging the block and asserting
      the count's beats all moved by the same amount while every note of
      the take stayed where it was.

      Its end is what is being placed, so that is what the block's right
      edge shows: a count of four beats ending on the first sung note is
      four clicks and then the singer, which is what a count-in is.

      Dragging it moves the drawn window with it, since the window opens
      to the earliest thing there is. The block is placed as a base plus
      an offset for that reason (INV-NOTES-235): the base moves the moment
      the drag is committed, and an offset still measured from the old one
      would draw the block a second drag further on.

  - id: INV-NOTES-269
    description: A tap on the count-in opens what it is made of; a drag moves it
    severity: major
    check: >
      A quick tap on the count-in block opens a sheet holding what the
      count is made of — how many beats it runs for, the pulse it was
      tapped at, where it ends — and marks the block as the thing being
      worked on. A tap that travels is a drag and moves it instead
      (INV-NOTES-268); neither gesture can trigger the other. Verified by
      asserting a tap opens the sheet and moves nothing, and a drag moves
      it and opens nothing.

      One thing under the finger answering two questions: where it goes,
      and what it is. A handle that only moved left the count's own
      numbers reachable from nowhere near it, and a control for something
      already under the finger is one nobody looks for.

      The block claims the touch only once the finger has travelled far
      enough to be going somewhere. Everything else on this graph claims
      it at once, because a handle is only ever dragged; this one is not.
