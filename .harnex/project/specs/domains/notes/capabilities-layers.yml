# Deriving a take, and re-analysing it (INV-NOTES-259).
capabilities:
  - name: notes.derive
    description: >
      Turn a reading and the statements kept with a note into every derived
      layer — transcription, rhythm, harmony — with no screen, store or
      device involved. The screen calls it to draw; the corpus tool calls
      it to re-analyse every take with a newer reader.
    actor: system
    implemented_by: packages/logic/src/derive/index.ts
    parameters:
      required: [reading, interpretation]
    preconditions:
      - the reading carries its analysis version
    postconditions:
      - the transcription depends on the reading and the transcription
        slice only (INV-NOTES-257, INV-NOTES-260)
      - the rhythm depends on the transcription and the rhythm slice only
      - the harmony depends on the transcription, the rhythm and the
        harmony slice only
      - every statement is in force after a re-derivation from a newer
        reading of the same performance (INV-NOTES-256)
      - the same inputs produce the same output, so the screen and the
        corpus tool cannot disagree
    permissions:
      - role: system
        notes: Pure. Anyone holding the inputs may derive.

  - name: notes.reanalyse
    description: >
      Derive every sample in the corpus from its kept reading and
      statements, and report what changed. How a better reader is measured
      against every take at once rather than by opening each.
    actor: singer
    implemented_by: scripts/corpus/reanalyse.ts
    parameters:
      required: []
    preconditions:
      - samples have been pulled with 'yarn dogfood samples'
    postconditions:
      - every sample's audio is read into frames by the device's own C++
        engine, compiled for this machine from the same sources, never by
        a port of it (INV-NOTES-261)
      - the frames are read with the thresholds the sample was read with
      - every sample is derived by notes.derive and nothing else
      - a sample whose statements no longer anchor is reported, not
        silently dropped
    permissions:
      - role: singer
        notes: Their own takes, on their own machine.

  - name: notes.next_step
    description: >
      Say where a take is in its workflow and what comes next
      (INV-NOTES-267), derived from what the take already has rather than
      remembered. Shown on the take with the step's own control, so the
      take leads the person through INT-NOTES-028..033 in order.
    actor: system
    implemented_by: packages/logic/src/workflowStep.ts
    parameters:
      required: [noteId]
    preconditions:
      - the take exists
    postconditions:
      - the next step is the first of count-in, bassline, chords that the
        take does not have
      - a step already satisfied is skipped, not shown
      - correcting is offered alongside every step and gates none
      - with everything present, nothing is asked for
    permissions:
      - role: singer
        notes: Their own take.
