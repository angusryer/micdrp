# Playback invariants — hearing a kept take back, from either surface.
# Split from invariants.yml to keep both files inside the 150-line budget.

invariants:
  - id: INV-NOTES-012
    description: Playback plays whatever the resolved audio URL points at
    severity: major
    check: >
      A note's playback source is the resolved audio URL, which is remote
      while the note is served from the backend and local only for a capture
      that has not synced. Playback must accept both. Treating the resolved
      URL as a local filesystem path fails every backend-served note, which
      is every note after a sync.

  - id: INV-NOTES-014
    description: A note's audio URL is minted for playback, never stored
    severity: critical
    check: >
      The cached note record holds the audio's durable server-side path,
      not a URL. The URL is built at the moment playback starts and is
      never persisted. Verified by asserting the cache contains no
      token-bearing URL after a sync, and that starting playback requests
      a fresh one.

      A PocketBase file token is valid for roughly two minutes. Storing a
      signed URL in the on-disk cache and refreshing it only on sync meant
      every note played more than two minutes after the last sync fetched
      with a dead token, which is every note in ordinary use.

  - id: INV-NOTES-015
    description: The list card's play control is the player
    severity: major
    check: >
      Pressing play on a note card transitions that control through the
      playback states — play, loading, stop — and produces no second
      control, no disclosed player, and no close or dismiss affordance
      anywhere on the card. Verified by asserting the card renders
      exactly one playback control before and after the press, and that
      no close control exists in either state.

      Opening a bar the singer then had to close made the card carry two
      play buttons and asked for a press that only undid a press.

  - id: INV-NOTES-018
    description: The chord backdrop follows the one transport
    severity: major
    check: >
      The backdrop sounds only while the transport says it should: it is
      scheduled when playback starts, and silenced when playback is
      stopped, ends on its own, fails to decode, or the view goes away.
      Playing the chords alone makes the backdrop the thing the
      transport runs, and it still ends itself when the progression runs
      out. Verified by asserting nothing is scheduled before the press,
      that stopping silences every scheduled tone, and that unmounting
      leaves nothing sounding.

      Chords still running after the take stopped would be a second
      transport with no control to stop it.

  - id: INV-NOTES-020
    description: The backdrop is scheduled on the take's clock, not on its own
    severity: major
    check: >
      A backdrop scheduled after the take has already begun is placed
      against where the take has reached, not against the moment it was
      scheduled. A slot the take has already passed is not sounded, a
      slot underway starts at the take's current position and still ends
      where the slot ends, and every later slot keeps its own place.
      Sounding the chords alone starts them from the top, since there is
      no take for them to be behind. Verified by asserting that a
      backdrop started with the take some way in schedules no tone for a
      finished slot, shortens the one in progress, and leaves the rest
      untouched.

      The backdrop cannot be scheduled in the same instant the take
      starts: a render commits and an audio context is built first.
      Starting the progression from zero at that later instant puts every
      chord that gap behind the voice for the whole take, which is heard
      as harmony trailing the line rather than sitting under it.

  - id: INV-NOTES-019
    description: Play sounds the tracks turned on and nothing else
    severity: major
    check: >
      One toggle per track beside the play control — the take, the chord
      backdrop, the melody — each on or off on its own, and a press
      sounds exactly those that are on. The take off schedules no decode
      and resolves no audio URL, so a press that plays no take asks the
      server for nothing; the chords off schedules no backdrop; the
      melody off sounds no melody over the take. Turning any track while
      something is sounding stops it. Verified by asserting no decode
      with the take off, no backdrop with the chords off, no melody with
      the melody off, and silence after a track is turned mid-playback.

      A control that only half-applies — chords added to a take already
      running, or a take left running after the take track went off —
      would make what is heard depend on when it was pressed.

      Independent toggles rather than one exclusive choice: three tracks
      cannot be named by a single pick, and the melody over the take is
      the pairing the whole reading is judged by (INV-NOTES-027).

  - id: INV-NOTES-016
    description: The line above the card's play control is the take's clock
    severity: minor
    check: >
      While a take plays, the line directly above that card's play
      control reports the running position against the take's length,
      and the position never exceeds the length. In every other state
      the line is the length alone. Exactly one such line exists on a
      card, in the block that holds the play control. Verified by
      asserting the line reads the length before the press, reads a
      position against the length while playing, and is the length alone
      again after stopping.

      The counter stands where the card's close control used to: the
      space above Play was freed when the disclosed player went away
      (INV-NOTES-015), and the fact a singer wants there is how far into
      the take they are.

  - id: INV-NOTES-030
    description: The detail transport is one round control showing what a press does
    severity: minor
    check: >
      The note detail's play control is a single circular button of one
      size in every state, carrying a triangle while a press would start
      the take and a pair of upright bars while a press would pause it,
      and it never carries a word. Fetching and decoding happens inside
      that same circle rather than replacing it. Verified by asserting
      the control is as tall as it is wide and fully rounded, that the
      glyph it draws swaps between play and pause with the transport
      state, and that no button text is rendered.

      A transport is read at a glance mid-take, so the shape is the
      message: a word has to be read, and a control that changes size
      between states — or vanishes while a take is fetched — moves the
      thing the singer is aiming at. The label a screen reader hears is
      unchanged; only the drawing is.

  # The melody's own control — INV-NOTES-031 — lives in
  # invariants-melody.yml, so this file stays inside the budget.
