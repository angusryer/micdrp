# Playback invariants — hearing a kept take back, from either surface.
# Split from invariants.yml to keep both files inside the 150-line budget.

invariants:
  - id: INV-NOTES-012
    description: Playback plays whatever the resolved audio URL points at
    severity: major
    check: >
      A note's playback source is the resolved audio URL, which is remote
      while the note is served from the backend and local only for a capture
      that has not synced. Playback must accept both. Treating the resolved
      URL as a local filesystem path fails every backend-served note, which
      is every note after a sync.

  - id: INV-NOTES-014
    description: A note's audio URL is minted for playback, never stored
    severity: critical
    check: >
      The cached note record holds the audio's durable server-side path,
      not a URL. The URL is built at the moment playback starts and is
      never persisted. Verified by asserting the cache contains no
      token-bearing URL after a sync, and that starting playback requests
      a fresh one.

      A PocketBase file token is valid for roughly two minutes. Storing a
      signed URL in the on-disk cache and refreshing it only on sync meant
      every note played more than two minutes after the last sync fetched
      with a dead token, which is every note in ordinary use.

  - id: INV-NOTES-015
    description: The list card's play control is the player
    severity: major
    check: >
      Pressing play on a note card transitions that control through the
      playback states — play, loading, stop — and produces no second
      control, no disclosed player, and no close or dismiss affordance
      anywhere on the card. Verified by asserting the card renders
      exactly one playback control before and after the press, and that
      no close control exists in either state.

      Opening a bar the singer then had to close made the card carry two
      play buttons and asked for a press that only undid a press.

  - id: INV-NOTES-018
    description: The chord backdrop follows the one transport
    severity: major
    check: >
      The backdrop sounds only while the transport says it should: it is
      scheduled when playback starts, and silenced when playback is
      stopped, ends on its own, fails to decode, or the view goes away.
      Playing the chords alone makes the backdrop the thing the
      transport runs, and it still ends itself when the progression runs
      out. Verified by asserting nothing is scheduled before the press,
      that stopping silences every scheduled tone, and that unmounting
      leaves nothing sounding.

      Chords still running after the take stopped would be a second
      transport with no control to stop it.

  - id: INV-NOTES-020
    description: The backdrop is scheduled on the take's clock, not on its own
    severity: major
    check: >
      A backdrop scheduled after the take has already begun is placed
      against where the take has reached, not against the moment it was
      scheduled. A slot the take has already passed is not sounded, a
      slot underway starts at the take's current position and still ends
      where the slot ends, and every later slot keeps its own place.
      Sounding the chords alone starts them from the top, since there is
      no take for them to be behind. Verified by asserting that a
      backdrop started with the take some way in schedules no tone for a
      finished slot, shortens the one in progress, and leaves the rest
      untouched.

      The backdrop cannot be scheduled in the same instant the take
      starts: a render commits and an audio context is built first.
      Starting the progression from zero at that later instant puts every
      chord that gap behind the voice for the whole take, which is heard
      as harmony trailing the line rather than sitting under it.

  - id: INV-NOTES-019
    description: Play sounds the tracks turned on and nothing else
    severity: major
    check: >
      One toggle per track in the options the play control opens — the
      take, the chord backdrop, the melody — each on or off on its own,
      alongside the two reading toggles (INV-NOTES-026), and a press
      sounds exactly those that are on. The take off schedules no decode
      and resolves no audio URL, so a press that plays no take asks the
      server for nothing; the chords off schedules no backdrop; the
      melody off sounds no melody over the take. Turning any track while
      something is sounding stops it. Verified by asserting no decode
      with the take off, no backdrop with the chords off, no melody with
      the melody off, and silence after a track is turned mid-playback.

      A control that only half-applies — chords added to a take already
      running, or a take left running after the take track went off —
      would make what is heard depend on when it was pressed.

      Independent toggles rather than one exclusive choice: three tracks
      cannot be named by a single pick, and the melody over the take is
      the pairing the whole reading is judged by (INV-NOTES-027).

  - id: INV-NOTES-016
    description: The line above the card's play control is the take's clock
    severity: minor
    check: >
      While a take plays, the line directly above that card's play
      control reports the running position against the take's length,
      and the position never exceeds the length. In every other state
      the line is the length alone. Exactly one such line exists on a
      card, in the block that holds the play control. Verified by
      asserting the line reads the length before the press, reads a
      position against the length while playing, and is the length alone
      again after stopping.

      The counter stands where the card's close control used to: the
      space above Play was freed when the disclosed player went away
      (INV-NOTES-015), and the fact a singer wants there is how far into
      the take they are.

  - id: INV-NOTES-030
    description: A bundle never assumes the binary can hear it
    severity: critical
    check: >
      Every tone player works on a binary that lacks the native synth
      module: when the module is absent, playback falls back to the
      per-context players rather than going silent or throwing. Verified
      by exercising the player factory with no native module registered
      and asserting notes still schedule through the fallback.

      JavaScript ships over the air to binaries built before the synth
      existed. A bundle that reaches for a module the binary never had
      does not degrade — it silences every screen that makes sound, on
      exactly the installs that cannot be rebuilt to fix it.

  - id: INV-NOTES-031
    description: Changing the route does not end the sound or move the clock
    severity: critical
    check: >
      Plugging in headphones, unplugging them, or joining a Bluetooth
      device leaves playback sounding and leaves every scheduled note at
      the moment it was scheduled for. Verified on a device, since no
      host test can change an audio route.

      An engine's connections are torn down when its configuration
      changes, and an engine nobody restarts stays silent for the rest
      of the session. Rendering at a rate the app chooses rather than
      the rate the hardware happens to want is what keeps the clock
      still through that: the output converts, and a note's sample
      position goes on meaning the moment it always meant.

  - id: INV-NOTES-065
    description: The detail transport is one round control showing what a press does
    severity: minor
    check: >
      The note detail's play control is a single circular button of one
      size in every state, carrying a triangle while a press would start
      the take and a pair of upright bars while a press would pause it,
      and it never carries a word. Fetching and decoding happens inside
      that same circle rather than replacing it. Verified by asserting
      the control is as tall as it is wide and fully rounded, that the
      glyph it draws swaps between play and pause with the transport
      state, and that no button text is rendered.

      A transport is read at a glance mid-take, so the shape is the
      message: a word has to be read, and a control that changes size
      between states — or vanishes while a take is fetched — moves the
      thing the singer is aiming at. The label a screen reader hears is
      unchanged; only the drawing is.

  # The melody's own control — INV-NOTES-031 — lives in
  # invariants-melody.yml, so this file stays inside the budget.

  - id: INV-NOTES-069
    description: Moving to a moment moves every track to that moment
    severity: critical
    check: >
      Starting playback at a position starts the take, the chord backdrop
      and the melody over it at that same position, and the counter reads
      from there rather than from zero. A position past the end, or below
      zero, is brought inside the take. Verified by asserting each track
      is handed the same offset and that the clock is anchored to it.

      They are one performance heard three ways. A backdrop that restarts
      from the top while the take resumes in the middle is not merely out
      of step, it is a different chord under every note — which reads as
      the harmony being wrong rather than the transport.

  - id: INV-NOTES-114
    description: A note remembers how it was being listened to
    severity: major
    check: >
      Which tracks are audible, how loud each sits, and the register the
      chords play in are kept with the note and read back on returning to it.
      Each note keeps its own; a setting absent from what was kept falls back
      to that setting's default rather than to nothing. A screen with no note
      still works and simply forgets. Verified by asserting a balance survives
      the screen unmounting, that a second note does not inherit the first
      one's, and that a partial record is filled in from the defaults.

      They were component state, so they lasted exactly as long as the screen
      did. The balance is often the point — a bass layer sitting under a take
      at the right level is something arrived at over several passes, not
      something set once — and losing it on every visit made the controls feel
      like a demonstration rather than a mixer.

      Kept apart from the interpretation, which is what somebody made of a
      take: the notes they corrected, the bars they arranged. That can be
      frozen, named and kept beside other readings. How loud you like the
      chords is not a reading of the music, and freezing it into one would be
      a category error — so this is a local listening preference and stays
      local, syncing nowhere.

  - id: INV-NOTES-119
    description: The click keeps time, and is switched from the transport
    severity: major
    check: >
      The metronome counts the take in and then goes on clicking to the end of
      it, accented on the downbeat from the arrangement's own bar length. It
      sounds on a bus of its own. It can be turned on and off from the
      transport, while its level stays with every other level in the options.
      Verified by asserting the metronome's opening clicks are exactly the
      count's, that it continues past them to the end of the take, that it
      accents, and that it is silent without a tempo.

      The count was only ever the beats before the first note, which is what
      you need to come in on time and nothing at all once you have. Keeping
      time through a take is that same job continued, so it is the same clicks
      continued — one voice rather than two, with the count as its opening
      bars.

      Its own bus because it did not have one. It sounded on the melody's, so
      turning the click down turned the tune down with it and neither control
      did what it said. Two voices on one bus share a level, which is not a
      mixer.

      Switched from the transport because it is the one track reached for
      mid-take: the click goes on and off while working, where a level is set
      once and left. The level stays in the options with every other level, so
      the options remain the place where everything is set and the transport
      remains the place where things are done.

  - id: INV-NOTES-120
    description: The struck sounds can be heard
    severity: major
    check: >
      The hits read out of a take sound as their own track, on their own bus,
      with their own level, offered only where something was actually struck.
      Each kind speaks in its own register. Off until asked for. Verified by
      asserting the track appears only when there are hits and that each kind
      is given a distinct pitch.

      A reading nobody can hear cannot be checked. The drums were being found,
      stored and drawn, and the only way to know whether the app had heard
      what you played was to compare a picture against a memory.

      The registers are not pitches. A struck sound has none; they are how the
      synth is asked to stand in for a drum it has no voice for, low for a
      thump and high for a hiss, so the kit is legible by ear the way the band
      is by eye. When the synth gains a noise voice this is where it goes.

      Off until asked for, like the melody: it is a reading of the take, and
      the take already contains the sound it is reading. Offered only where
      something was struck, because a control for a track that would make no
      sound is a control that lies.

  - id: INV-NOTES-121
    description: A track is declared once, and costs no build
    severity: major
    check: >
      Every track is one entry in a registry naming what it is, what it is
      called, whether it starts on, and how loud it sits. The mix, the levels,
      the titles, the order and the availability rules all derive from it, and
      each track's mixer bus is its position in the list. No two tracks share
      a bus, and no track's bus collides with the buses that are not tracks.
      Verified by asserting every derived map matches the registry entry for
      entry, that the buses are distinct and in range, and — by adding a
      track — that nothing else needs changing.

      A track used to be spelled out in six places plus a C++ enum, so adding
      one meant an Xcode build and a TestFlight upload to hand the synth an
      integer the caller already knew. The synth's entire notion of a bus is
      an index into a level array; it has never known what "chords" means, and
      naming them natively was the only thing that made a track a native
      change. The array is a capacity now, and what a bus means is decided in
      TypeScript.

      The tedium was not the reason to fix it. The click was given the
      melody's bus, so turning the click down turned the tune down with it and
      neither control did what it said (INV-NOTES-119) — a duplicated list
      does not merely cost edits, it lets two things claim the same thing and
      says nothing about it.

      What a track does not declare is how it is drawn. A melodic track is
      pitch against time and a percussive one is lanes; those are different
      pictures, and two of a thing is not a pattern worth an abstraction. The
      role names which reading a track gets (INV-NOTES-115) and stops there.

  - id: INV-NOTES-123
    description: The tempo can be set by hand
    severity: major
    check: >
      A take's tempo can be set by hand, standing in front of the one read
      from it rather than replacing it, and the reading stays available to go
      back to. It is kept with the interpretation, so it survives the take
      being read again. Verified by asserting the set tempo is what the grid
      uses, that the read one is still reported, and that going back restores
      it.

      Every other reading on the screen could be corrected — a pitch, a
      downbeat, a chord, how long a note lasts — and the one everything else
      is measured against could not. A wrong tempo does not merely say the
      wrong number: the bar lines land wrong, the notation snaps to the wrong
      grid, and every correction made on top of it inherits the error.

      Kept with the edits rather than written over the reading, because it is
      a decision about the take rather than a fact of it. A reading can be
      thrown away and made afresh (INV-NOTES-116); a decision must not be, and
      writing it into the reading would let a re-read silently undo it.

  - id: INV-NOTES-124
    description: A note plays from the list the way it plays in the note
    severity: minor
    check: >
      The play control in the notes list sounds the take at the level that
      note was left at, and does not offer to play a take that was silenced
      there. Verified by asserting the level is applied and that a silenced
      take is not offered.

      The balance is kept per note (INV-NOTES-114), and a list that ignored it
      would be playing a different thing from the one the note plays — the
      same recording, at a volume nobody chose.

      The whole mix, not the take alone. A take is a recording of a person
      singing over nothing; the note plays the chords, the transcription and
      the drums with it, and a list playing only the recording is playing a
      different piece of music from the same file.

      One note sounds at a time, and the player is mounted for that note
      alone. Sounding a mix needs the note read, which costs about a sixth of
      a second for two minutes of audio — affordable once on a press, and not
      affordable once per row. The card asks; the screen sounds. The card's
      counter reads the position reported back to it, because lifting the
      player out must not cost the thing the player was showing.

  - id: INV-NOTES-125
    description: The beat can be felt instead of heard
    severity: minor
    check: >
      The metronome can be set, per note, to tap against the hand rather than
      sound. It uses the same beats the sounded click does, accents the
      downbeat more heavily, fires nothing while stopped or turned off, and
      skips beats already gone by when playing starts partway in. Verified by
      asserting one tap per beat, a heavier downbeat, silence when off, and
      that a mid-take start does not fire the beats behind it at once.

      A click over a take is a click in the take: you hear it while listening
      to what you sang, and on a phone speaker it competes with the very thing
      it is there to help you follow. Felt instead, it keeps time without
      taking any of the room the music is in.

      Booked ahead against the clock rather than fired when a position update
      arrives. Updates land sixty times a second at best and unevenly, so a
      tap driven by them would land wherever they did — which for a metronome
      is the one thing that must not happen.

      Beats already behind the playhead are skipped rather than fired late. A
      tap after its beat reads as the next one, and three at once reads as a
      single beat rather than three.

  - id: INV-NOTES-126
    description: Everything sounding is measured against one clock
    severity: critical
    check: >
      The take and every voice sounding with it are placed against the audio
      device's clock, not the wall clock, and against one reading of it rather
      than one each. The take begins at a moment chosen in advance rather than
      as soon as possible, and its anchor is that moment. A voice is given
      where the take WILL be when the voice sounds, not where it is. Verified
      by asserting the anchor reports a position including the scheduling
      lead, that it takes a stated moment rather than the moment of the call,
      and that a take not yet begun reports nothing elapsed.

      The synth schedules on the engine's sample clock, which advances with
      the audio device. The take was tracked with the wall clock, which
      advances with the CPU. Two clocks that are not the same clock do not
      merely differ by a constant — they drift, so a backdrop that started in
      time wanders out of it over a long take, and no fixed correction can
      hold it.

      Starting the take at a named moment removes the other half. Started "as
      soon as possible" it begins at whatever block boundary comes next, and
      an anchor taken beside the call could only estimate that — an error
      landing on everything scheduled against the take.

      The lead is part of the position because a voice scheduled now does not
      sound now: it sounds a lead later, by which time the take has moved on.
      Lining a voice up against where the take is places it early by exactly
      that lead, every time.

      One reading for all of them because each voice used to take its own, in
      its own effect. The chords, the transcription, the drums and the click
      were each placed against a slightly different idea of where the take had
      reached, so they were out of time with each other as well as with it.

  - id: INV-NOTES-127
    description: A take is never booked against a clock that is not moving
    severity: critical
    check: >
      Before a take is started, a context that is not running is asked to
      start. Where its clock then runs, the take is booked ahead of it; where
      the clock is stopped, absent or not a number, the take is started at
      once instead. Pressing play makes a sound whatever state the context is
      in. Verified by asserting a running clock is booked ahead of, a
      suspended one is resumed and then booked ahead of, and one that will not
      resume — or reports no clock — is started at once.

      Starting the take at a moment chosen in advance is what lets everything
      lined up against it be exact rather than estimated (INV-NOTES-126). That
      only holds for a clock that advances. A context made while a recording
      session is live can arrive suspended, and a suspended clock does not
      move — so a booking against it is a booking for a time that never comes,
      and nothing sounds at all.

      That is what silenced the whole backing while recording a bass line: the
      capture holds the session, the playback context could not start, and a
      take booked half a second into a clock frozen at zero simply waited
      forever.

      It went unseen because the context double had no clock. Every test took
      the "start now" path while the device took the other one, so the suite
      stayed green over silence. The double reports a clock and a state now,
      and both paths are exercised.

  - id: INV-NOTES-128
    description: A session that refuses is silence, not a failure
    severity: major
    check: >
      Where the audio context cannot be started — a live capture holding the
      session — the take is played at once rather than booked, and the
      transport does not report an error. Verified by asserting a context that
      refuses to start still starts the take and leaves the transport out of
      its error state.

      Asking a suspended context to start is worth doing (INV-NOTES-127), but
      letting its refusal escape turned a quiet take into "Playback failed" —
      a worse answer to the same situation, and one that also stops the
      playhead. A refusal is a fact about the session, not a fault in the
      take.

  - id: INV-NOTES-130
    description: The beat is tapped in, and a tapped beat outranks every reading
    severity: major
    check: >
      One button taps the beat while the take sounds, armed only while
      something is actually running, each press landing as the finger does
      rather than as it lifts and stamped against where the take has reached.
      Three or more beats state a tempo; two state nothing. A beat can be
      moved, remembers where the finger landed, and can be put back. A beat
      can be marked as a bar start, and two marks state a bar length. The
      tempo and bars they state stand in front of every reading of the same
      thing, below only a tempo typed by hand. Verified by asserting the
      tempo read back matches what was tapped, that a late tap does not drag
      it, that a moved beat keeps its tapped position, that one mark states no
      bar length, and that a tap against a stopped take lays nothing down.

      Everything else infers where the beat is. The fitter deduces it from
      onsets, which is genuinely hard; a sung count states it, but only for
      the bars somebody counted (INV-PITCH-022). Tapping along says it for the
      whole take, continuously, by the one party who knows — and there is
      nothing to detect in a tap, so there is nothing to get wrong. That is
      what puts it at the top of the order.

      One button, because there is one thing being said: here is the beat.
      Three pads were a drum machine, which is a different instrument
      answering a different question, and a pulse is singular.

      Armed only while the take sounds. A tap against a stopped transport has
      no moment to be at, so it lands wherever the playhead was left — a beat
      placed by accident, which is worse than no beat.

      On press-in rather than release, or every beat is late by however long
      the button was held.

      A grid fitted to the taps rather than read off them, because tapping
      along is played and is never complete (INV-NOTES-131). Two taps are an
      interval and not a tempo — nothing in them says whether it would have
      happened again.

      A moved beat keeps where the finger landed. Tapping along is played
      rather than typed, so a beat can be a little late without being wrong
      about which beat it is — and correcting one must never destroy the
      record of what was performed (INV-NOTES-022). Moving one does not snap
      it to the grid: a tapped beat is what the grid is derived from, and
      snapping would be the reading correcting the statement it came from.

      One mark says where a bar begins and nothing about how long one is, so
      a bar length needs two.

  - id: INV-NOTES-131
    description: Superseded — tapped beats are marks, not evidence for a grid
    severity: info
    check: >
      Nothing infers a tempo, a bar length or a set of downbeats from what was
      tapped. The taps are drawn where they were put, can be moved, can be put
      on the grid, and can be marked as bar starts — and that is the whole of
      what they do. Superseded by INV-NOTES-161.

      Fitting a grid to them worked, and was wrong to do. A handful of taps
      changed the tempo, which moved the bar lines, which re-cut the chord
      slots — so tapping four times rearranged the harmony of a take somebody
      was in the middle of reading. Every step was defensible and the whole
      was a surprise, which is the shape of a feature that infers too much.

      What a person taps is a mark on their own recording. Letting a mark
      redraw the thing it was made on is the app arguing with the person who
      made it.

  - id: INV-NOTES-132
    description: A vertical line is thrown away by flicking across it
    severity: minor
    check: >
      A drag that finishes at least 40px across a chosen vertical line, still
      travelling at 700px/s or more, and at least twice as far across as
      along, removes it — bar lines and tapped beats alike, every one in the
      selection, highest index first. Anything slower, shorter or more
      sideways places the line as before. Verified by asserting a fast
      vertical drag removes the chosen lines and a slow or sideways one does
      not.

      Everything vertical on the graph is a claim about time that somebody may
      simply want gone, and there was no way to say so: a line could be moved
      and chosen, and getting rid of one meant finding a control elsewhere for
      a thing already under the finger.

      A flick because these lines already move horizontally — dragging
      sideways is how a line is placed, so the direction left free is across
      it, and throwing something off the graph is the gesture people already
      have for discarding.

      Speed is what separates a decision from a wobble. A slow vertical drag
      is somebody who has not decided, and losing a hand-placed bar line to a
      stray finger is worse than having to flick twice.

      Highest index first, because removing one shifts every index after it
      and taking them in order would delete the wrong neighbours.

  - id: INV-NOTES-133-supersedes-note
    description: Superseded — INV-NOTES-127 and INV-NOTES-128 no longer apply
    severity: info
    check: >
      Both described how the take behaved when the AudioContext it was played
      through arrived suspended under a live capture: started at once rather
      than booked, and a refused resume reported as a fact about the session
      rather than a failure of the take. There is no such context any more —
      the take is a voice on the engine (INV-NOTES-133), and an engine that is
      already running owns its output and asks the session for nothing. The
      two invariants are kept for the history of why the code looked the way
      it did; nothing implements them and nothing tests them.

  - id: INV-NOTES-133
    description: The recorded take sounds through the one engine, on the one clock
    severity: critical
    check: >
      A take is decoded once into the engine's own rate, held in a sample slot,
      and scheduled on its bus by the same call and the same clock as every
      synthesized voice. Its level is that bus's level. No AudioContext is
      created to play a note, and nothing sounding is booked against
      `ctx.currentTime`. A slot's audio is never freed while a voice may still
      be reading it. Verified by asserting a scheduled sample sounds its own
      frames at its own offset, that it stops when its span ends, that a bus
      level scales it, and that replacing a slot leaves a sounding voice
      reading what it started with.

      Everything the app synthesizes already runs on one engine, one sample
      counter, sixteen buses (INV-NOTES-028). The take did not, because the
      synth is an oscillator bank with no notion of a sample — so recorded
      audio stayed on the path that predates the engine, a fresh AudioContext
      per press.

      Which made every alignment an estimate. The synth books on a sample
      counter; a context books on its own clock; the bridge between them adds
      a fixed lead and hopes. Two clocks do not differ by a constant, they
      drift, so a backdrop that started in time wanders out of it — and no
      correction applied in JS can hold it, because the error is not constant.

      It also put the take at the mercy of the session. A context created
      while a capture holds PlayAndRecord arrives suspended and refuses to
      resume, which is what silenced a take under a layer being sung
      (INV-NOTES-127) and then reported it as a failure (INV-NOTES-128). Both
      were treated at the symptom. An engine already running owns its output
      and has nothing to ask for.

      And it cost a decode per press — about a sixth of a second for two
      minutes of audio, for a file already decoded — plus a second mixer,
      since the take's level was a gain node while every other track's was a
      bus.

      Resampled at load rather than while rendering. Rate conversion in the
      render loop is a per-sample cost on the audio thread for a conversion
      that is the same every time; done once at load it is a memory cost and
      nothing else.

      A slot's audio outlives every voice reading it. The audio thread holds
      raw pointers by design — that is what makes rendering allocation-free —
      so freeing a buffer the moment a slot is replaced would be a read of
      freed memory in the render callback, which is a crash rather than a
      glitch.

  - id: INV-NOTES-134
    description: A layer is heard as it was sung, not as it was read
    severity: major
    check: >
      Every layer with audio and without a mute is decoded into a slot of its
      own and scheduled against the take on the engine's clock, shifted by the
      `alignedByMs` it recorded. They share one bus and one level, and a muted
      layer is not scheduled at all. A note with more layers than there are
      slots sounds the ones it has room for and says which it left out.
      Verified by asserting a layer sounds at its aligned offset alongside the
      take, that a muted one does not sound, that a layer with no audio is
      skipped, and that each layer that sounds occupies a different slot from
      the take and from the others.

      A layer used to reach the ear only as a synthesized reading of what was
      detected in it — the bass line arrived as an oscillator playing the
      notes we thought we heard. That is the wrong object: a layer is a
      performance (INV-NOTES-071), and a performance is worth more than a
      transcription of it. The reading is still drawn and still carries the
      harmony; what changed is that the recording itself now sounds.

      On its own bus rather than the take's, because a layer is not the take
      and balancing one against the other is the point of having both. One bus
      for all of them rather than one each: a layer is silenced by not being
      scheduled, which is exactly what a mute means, so per-layer levels would
      be a control nobody has asked for.

      Shifted by `alignedByMs`. An overdub is heard by the microphone after
      the output and input latencies, so it lands late by a fixed amount, and
      a layer scheduled at face value sits behind the take it was sung over.

      Fewer slots than a note could have layers, so the limit is stated rather
      than discovered: audio held for the whole take costs real memory, and
      quietly dropping the seventh layer would be a note that sounds different
      from the note that was made.

  - id: INV-NOTES-135
    description: The bass read from a take is its own track, and starts off
    severity: minor
    check: >
      The synthesized root movement is a track in the list with its own
      toggle, its own bus and its own level, turned off until somebody turns
      it on. Turning the chords off no longer silences it and turning it off
      no longer silences them. Verified by asserting the bass sounds only
      when its own track is on, that it is off in a fresh mix, and that the
      chords and the bass start and stop independently.

      It used to start and stop with the chords, on the grounds that a root is
      part of the harmony it belongs to. That was true when the reading was
      all there was to hear. Now a note can carry the bass line as it was
      actually sung (INV-NOTES-134), so the synthesized one is a second
      opinion about a recording that is already playing — useful for checking
      what was read, and clutter the rest of the time.

      So it starts off, like the transcription of the melody and for the same
      reason (INV-NOTES-027): a voice that says what the app thinks it heard
      is worth offering and wrong to impose.

  - id: INV-NOTES-136
    description: The playhead reads the engine's clock, and moves every frame
    severity: major
    check: >
      Where the take has reached is computed from the engine's own clock — the
      moment the take was scheduled to begin, subtracted from what `nowMs()`
      reads — and never from the wall clock. The drawn playhead advances on
      the UI thread every frame between samples of that clock, so it moves
      smoothly without a React render per step, and is corrected to the engine
      several times a second so it cannot drift. The counter shown as text
      stays low-frequency: it is read to the second. Verified by asserting the
      position follows the engine clock rather than elapsed wall time, that it
      counts from where a resumed take began, and that the drawn head does not
      re-render the graph to move.

      The playhead was a wall clock ticking twice a second. The reason written
      beside it was that a BufferSourceNode reported no position, which
      stopped being true when the take became a voice on the engine
      (INV-NOTES-133) — so what was left was a third clock, approximating the
      one the audio actually runs on, and drifting from it over a long take.

      Twice a second is also visibly wrong. A line that jumps half a second at
      a time is not showing where the take is; it is showing where the take
      was, up to half a second ago, which is worse on the graph than in the
      counter because the graph is what a beat is placed against.

      Interpolated on the UI thread rather than sampled at frame rate. The
      engine's clock is read from JavaScript, and reading it sixty times a
      second to set React state would re-render the graph sixty times a
      second — the drawing is the expensive part, and none of it changes when
      only the head moves.

      Corrected rather than free-running. Advancing a shared value by frame
      time alone is a wall clock again, dressed differently; each sample of
      the engine pulls it back to the truth before it can accumulate.

  - id: INV-NOTES-137
    description: The beat is tapped in while the take is being sung
    severity: major
    check: >
      The recording view carries the same beat button the detail view does,
      armed for as long as a capture is running, each press stamped against
      the capture's own clock and tapping the fingertip back. What was tapped
      is saved with the note as its beats, so opening it shows them where they
      were put. Nothing is stamped while a capture is paused or before one
      starts. Verified by asserting a tap during a capture lands at the
      capture's own elapsed time, that the saved note carries them, and that a
      tap outside a running capture lays nothing down.

      Tapping the beat existed only on the detail view, against a take being
      played back (INV-NOTES-130). But the moment a person is surest where the
      pulse is, is while they are singing to it — asking them to sing it, open
      it, play it and tap along is asking them to perform it twice, and the
      second performance is the one being measured.

      Which makes this the primary way beats arrive, and the detail view the
      place they are corrected. Both write the same thing (INV-NOTES-131), so
      a take tapped while sung and then tapped again on the detail view is a
      second pass replacing the first, exactly as two passes there would be.

  - id: INV-NOTES-138
    description: The recording view keeps the screen awake
    severity: minor
    check: >
      The idle timer is disabled for as long as the recording view is open and
      restored when it goes, whatever route it goes by. Verified by asserting
      the flag is set on opening and cleared on leaving, including when the
      view is left while a capture is running.

      A phone that dims mid-take is a phone that stopped showing the thing it
      was asked to show, at the one moment nobody has a free hand. Recording
      is the only view that asks for this: every other one is read between
      touches, and a screen that never sleeps is a battery that does not last
      the day.

  - id: INV-NOTES-141
    description: The tracks start at the loudness the take was sung at
    severity: major
    check: >
      A note's starting levels are derived from how loud its sung notes
      actually were — the median of the per-note loudness, ignoring notes
      nothing measured — and every synthesized track is scaled by one factor
      so a quiet take gets a quiet accompaniment and a loud one gets a loud
      accompaniment. The relative balance the tracks were given stays as it
      was; only the whole is moved. A take with no measured loudness keeps the
      flat defaults. A level set by hand still wins and still persists.
      Verified by asserting a quiet take yields quieter tracks than a loud
      one, that the ratios between tracks are unchanged, and that a note whose
      loudness was never measured is left alone.

      Dead for as long as it has existed, and silently. The engine
      measures a level for every frame and reports it, the segmenter
      builds a note's loudness out of those frames, and the match was
      written and tested against both — but the function normalising a
      native frame into a PitchSample listed the fields it wanted and
      levelDb was not among them. So every frame arrived without a
      level, every note was measured as unmeasured, and the match
      correctly declined to move anything. Nothing failed; the whole
      chain simply resolved to "leave it alone".

      A normaliser that drops a field it does not name is the shape of
      this: the loss is invisible at the seam and only shows up as a
      feature that quietly never happens (INV-PITCH-020).

      The tracks were balanced at fixed numbers chosen by ear against one
      take. Against a take sung twice as quietly, the same numbers bury it;
      against a loud one they vanish under it. The singer then does by hand,
      on every note, what a measurement could have done once.

      From the notes rather than from the file. The file's average includes
      every silence between phrases and the room behind them, so a take with
      long gaps reads as quiet when the singing was not — raising the floor
      instead of matching the voice. What was sung is what has to be matched,
      and the per-note loudness is exactly that (INV-PITCH-020).

      The median rather than the mean, because one shouted note is not the
      loudness of a performance.

  - id: INV-NOTES-142
    description: The graph's controls ride beside it rather than scrolling away
    severity: minor
    check: >
      A strip down the left edge of the graph stays put while the graph
      scrolls, carrying one mute for each track the note has. It sits flush
      against the drawing with nothing between them, and the drawing begins
      where the strip ends. Verified by asserting the strip does not move with
      the graph's scroll and that a mute in it silences the same track the
      options list does.

      The mutes lived in a sheet reached from the top bar, which is the wrong
      place for them: silencing a track is something done WHILE listening and
      looking at the graph, and a control that has to be opened first is a
      control that interrupts the thing it is for.

      Flush against the drawing because the two are one instrument. A gap
      would read as two panels, and the strip would stop being the graph's
      edge and start being a sidebar.

  - id: INV-NOTES-144
    description: Each track has a voice of its own, chosen and kept
    severity: major
    check: >
      Every bus carries a timbre, set from JavaScript and applied to voices
      admitted after it, and a note remembers the choice made for each of its
      tracks. The waveforms with edges are band-limited, so a bass low enough
      to be felt does not fold a ladder of false partials over the take. A
      voice already sounding keeps the timbre it started with. Verified by
      asserting two buses set to different waveforms produce different output
      from the same pitch, that a saw at a low pitch has no significant energy
      above the Nyquist image of its fundamental, and that changing a bus mid
      note does not change that note.

      Every synthesized voice was a sine — chords, bass, transcription, drums
      and click alike. A sine is the one waveform with nothing but its
      fundamental, so five parts playing at once were five things the ear had
      only pitch and level to separate. Which is why the mix always sounded
      crowded before it sounded loud.

      Per bus rather than per note, because a bus is already what a track is
      (INV-NOTES-121) — so a timbre needs no new routing, no change to
      scheduling, and no build to add a track that sounds different from the
      others.

      Band-limited, because the alternative is worse than the plain sine it
      replaces. A naive saw at 55Hz on a 48kHz engine folds hundreds of
      partials back down the spectrum, and they land as a metallic buzz that
      sits exactly where a voice does.

      A sounding voice keeps its timbre. Changing an instrument under a note
      that is already speaking is a click, and the singer changing it is
      listening to the next thing rather than editing this one.

  - id: INV-NOTES-152
    description: A pause leaves the take where it reached
    severity: major
    check: >
      Pressing the transport while a take is playing silences every track and
      leaves the playhead, the counter, and anything drawn from them at the
      moment the take had got to. The next press carries on from there rather
      than from the top or from wherever the last press began. Verified by
      asserting the position after a pause is where the take had run to, and
      that the following press schedules the take from that same offset.

      The control has drawn a pause and called itself Pause since there was a
      transport, and it stopped: the head jumped back to where the last press
      started, taking with it the one thing worth stopping for. Stopping
      mid-take is how you look at what is under the head — which note that
      was, where in the bar it sat — and the answer was being cleared by the
      question.

      The moment is taken from the engine's own clock at the instant of the
      press, without the scheduling lead — where the ear is, not where a
      voice scheduled now would land (INV-NOTES-126). Not from the counter,
      which is sampled a few times a second and read to the second
      (INV-NOTES-136), because a pause landing half a second from the ear is
      a rewind nobody asked for.

      A pause is not a seek (INV-NOTES-091). Nothing moves, so nothing has to
      be sounded to find the moment again, and resuming is the same
      every-track-together start as any other (INV-NOTES-069).

      With the take turned off there is nothing to hold. That transport is a
      timer over the chord track with no clock to read, so its head never
      moved and a press there silences and starts from the top next time.

  - id: INV-NOTES-160
    description: Rewind moves the playhead and decides nothing about sound
    severity: major
    check: >
      Rewind moves the head back from where the head actually is — where the
      take has reached while it is sounding, and where a press would start it
      when it is not. A take that was playing goes on playing from the new
      moment; a take that was stopped stays stopped. Never before the
      beginning. Verified by asserting a rewind while stopped moves the head
      and sounds nothing, that a rewind while playing keeps playing, and that
      a rewind from near the start lands at zero rather than below it.

      It always started the take, so the only way to move the head backwards
      was to begin listening. Going back to look at something is not the same
      act as going back to hear it, and a transport that cannot tell them
      apart makes the quieter one impossible.

      And it measured from the wrong clock. The anchor says how long the audio
      has been running, which is nothing before the first play and stale after
      a stop — so a rewind from a stopped take went to a place unrelated to
      the head the singer was looking at. The head has one position and both
      the drawing and the transport must read the same one.

  - id: INV-NOTES-161
    description: A tapped beat is a mark, and changes nothing but itself
    severity: major
    check: >
      Tapping lays a mark at the moment the finger landed and does nothing
      else: no tempo is read from it, no bar length, no downbeats, and the
      chord slots do not move. A mark can be moved, put on the grid, marked as
      the start of a bar, and thrown away. Verified by asserting that adding
      taps leaves the grid, the bar lines and the chord slots exactly as they
      were, and that marking one as a bar start does the same.

      The taps used to be fitted to a grid, and the grid drove everything
      downstream — so four taps changed the tempo, which moved the bar lines,
      which re-cut the harmony of a take somebody was in the middle of
      reading. Every step defensible, the whole a surprise.

      A person tapping along is saying "here, and here, and here". They are
      not saying "and therefore the piece is at 96 with four to a bar". The
      second is a conclusion the app drew, and drawing it made the first
      impossible to do quietly.

  - id: INV-NOTES-162
    description: A tap lands where the take was when the finger touched it
    severity: major
    check: >
      A beat tapped against a playing take is stamped against a reading of the
      take's position accurate to a frame, never against the counter shown as
      text. Verified by asserting a tap lands within a frame of where the take
      actually was rather than within the counter's refresh interval.

      It was stamped against the counter, which is refreshed a few times a
      second because it is read to the second (INV-NOTES-136). So a tap could
      be recorded up to half a second after the finger landed, and every mark
      sat late by an unpredictable amount — on a feature whose entire value is
      that the moment came from a person rather than from a detector.

  - id: INV-NOTES-163
    description: A beat is a beat, and anything done to one can be done to any
    severity: major
    check: >
      Every tapped beat can be moved, thrown away, and marked or unmarked as
      the start of a bar, whether or not it is currently marked. A beat is
      dragged by holding it and moving, so a drag is told apart from the
      page's own scrolling by intent rather than by direction. Verified by
      asserting a plain beat offers the same actions as a marked one, and that
      a hold followed by a drag moves the beat rather than scrolling the page.

      A marked beat could be deleted and a plain one could not, which made
      "start a bar here" a one-way door: the only way to be rid of a beat was
      to promote it first. Nothing about a beat changes when it is marked
      except what it means, so nothing about what can be done to it should
      change either.

      Held before dragged because the graph lives inside a page that scrolls.
      A vertical drag is ambiguous — the page wants it and so does the beat —
      and holding first says which was meant, without spending the direction
      that a horizontal drag already uses for placing.

      Where there is something to snap to, a held drag lands on it. There is
      not yet: the grid is being taken out of the app's hands and put into the
      singer's, so for now a beat goes exactly where the finger leaves it
      (INV-NOTES-161).

  - id: INV-NOTES-204
    description: Stopping stops, including a press that has not started yet
    severity: critical
    check: >
      Stopping or pausing cancels a press still waiting on the count-in,
      so nothing begins sounding afterwards. Verified by pressing play
      with a count in force, stopping before the count ends, and
      asserting the take never starts.

      Play waited out the count on a bare timer that nothing could
      cancel. Pressing stop during the count cleared what was sounding
      and set the transport to stopped — and then the timer resolved and
      started the take regardless. From the outside the take began
      playing after it had been stopped, and nothing would end it: the
      transport already read stopped, so pressing stop again did
      nothing, pausing did nothing, and the scrubber had no run to move.
      It played to its end, including into the background.

      A press is cancellable from the moment it is made. Anything that
      resumes after an await checks that the run it belongs to is still
      the current one, the way the tone player already does.

