# What the melody graph promises about its own axes. Split from invariants.yml
# to stay inside the 150-line spec-file budget (Axiom 3).
invariants:
  - id: INV-NOTES-032
    description: A beat is the same width wherever it falls
    severity: critical
    check: >
      Two beats are the same distance apart everywhere in the graph at a
      given zoom, whatever the take's length. A take wider than the
      viewport extends past it and is reached by scrolling, rather than
      being compressed to fit. Verified by asserting that the same
      passage laid out inside two takes of different lengths occupies
      the same width.

      Fitting a whole take to the screen made a bar of a long idea
      narrower than a bar of a short one. Nothing could be compared
      between two takes, the same note changed size depending on what
      else was sung, and a bar of a minute-long idea was too narrow to
      put a finger on — which is what per-note editing needs.

  - id: INV-NOTES-033
    description: Zoom changes the scale, never the content
    severity: major
    check: >
      Zooming changes how many pixels a beat occupies, within bounds,
      and changes nothing else: every note, bar line and chord is still
      present, still in the same musical position, and still in the same
      order. Verified by asserting the set of laid-out elements is
      unchanged across zoom levels and only their coordinates move.

      Zooming out stops when the whole take fits, counting the pickup
      before the first sung note, and never goes past it. Zooming in
      stops before a bar has left the screen entirely. Verified by
      asserting the floor for a given take lays that take out at exactly
      the width it has.

      A zoom that dropped detail as it went would make the graph a
      different picture at every scale, and the singer could not trust
      that what they were editing was what they had sung. Past the
      whole take there is nothing further to see, only the take getting
      smaller in the middle of an empty screen.

  - id: INV-NOTES-034
    description: A finger lands where the graph says it is
    severity: critical
    check: >
      Every gesture on the graph — moving a bar line, dragging a chord
      note, scrubbing — resolves its position through the same axis that
      drew what is under it, at the current zoom and scroll. Verified by
      asserting that a gesture at a given x resolves to the time whose
      element was drawn there, at more than one zoom and scroll offset.

      Two pieces of arithmetic that both convert between time and pixels
      will disagree the moment one of them gains a scale or an offset
      the other does not. The graph already exports the axis it drew
      with so hit-testing cannot drift from it; zoom and scroll make
      that the only tolerable arrangement.

  - id: INV-NOTES-035
    description: A thumbnail still shows the whole idea at once
    severity: major
    check: >
      Where the graph stands in for a note rather than being worked on —
      a row in the list, a fragment on the dashboard — the whole take is
      fitted to the width it has and nothing scrolls. Verified by
      asserting a thumbnail's laid-out span equals its available width
      whatever the take's length.

      A list row is for recognising an idea, not reading it. Fixed beat
      spacing there would show the first two seconds of everything, so
      every row would look alike, which is the one thing a list must not
      do.

  - id: INV-NOTES-041
    description: Turned sideways, the graph is the view
    severity: major
    check: >
      Held in landscape, a note's detail gives the graph the height and
      keeps the chord track as a thin row beneath it, so the harmony
      stays visible and editable against the line. Nothing else competes
      for the space. Turning back upright restores the full page with
      everything where it was, and the take's own scroll position and
      scale survive the turn. Verified by asserting the same note renders
      the graph and the chord track in landscape and the whole page in
      portrait, from one piece of state.

      A sung idea is wide and short, which is the shape of a phone on its
      side and the opposite of one held upright. Turning it is the
      cheapest way to see more bars at a readable scale, and the reading
      is what the screen is for — everything else on the page is about
      the take rather than in it.

  - id: INV-NOTES-042
    description: Only plain values cross from a gesture to the app
    severity: critical
    check: >
      Every gesture callback on the graph hands the JavaScript side plain
      numbers and nothing else: no function it was given is called from
      inside the callback. Anything that has to be worked out from a
      touch — which grid step it landed on, which line it was near — is
      worked out after the crossing, not before it. Verified by reading
      each gesture: what goes through runOnJS is an argument, never the
      result of calling something passed in.

      Gesture callbacks run on the UI thread. Calling an ordinary
      function there is a hard crash in a release build, not a warning,
      and the test setup cannot see it: the reanimated mock runs
      everything on one thread, so a gesture that kills the app on a
      device passes every test. Holding between the bar lines to add one
      did exactly that — it converted a touch to a grid step inside the
      callback — while holding on a line, which passed only its index,
      was fine.

  - id: INV-NOTES-043
    description: A pinch zooms about the point between the fingers
    severity: major
    check: >
      The moment under the midpoint of the two touches when a pinch
      begins is the moment still under that midpoint as the pinch runs,
      whichever way it goes. Verified by asserting the content position
      under a given focal point is unchanged by a scale change anchored
      there.

      Anchoring to the middle of the screen instead means the take slides
      under the fingers doing the pinching, so the thing being looked at
      is the thing that moves away. A pinch is a statement about a place,
      and the place is between the fingers.

  - id: INV-NOTES-044
    description: The scale can always be put back
    severity: minor
    check: >
      A control returns the graph to the scale it opened at, from
      wherever it has been taken, and is offered only once the scale has
      actually been changed. Verified by asserting the beat width after
      a reset equals the width a freshly opened take is given.

      Zoom is a place you can get lost in — several pinches deep on a
      long take, finding your way back by pinching is guesswork. One
      control makes the way back exact.
