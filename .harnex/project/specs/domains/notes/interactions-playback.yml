# Hearing a kept take back — from the list card and from the detail view.
# Split from interactions.yml to keep both files inside the 150-line budget.

interactions:
  - id: INT-NOTES-008
    name: Play the take back
    view: VIEW-NOTES-002
    precondition: The note has stored audio.
    steps:
      - Press play
    outcome: >
      The capture plays and its position is shown while it runs. The
      chord backdrop sounds under it, each chord across its own slot and
      in step with the take, and stops when the take stops. A note whose
      melody implies no chords plays on its own.
    error_handling: >
      A note whose upload never completed shows no playback bar at all.
      A take that fails to decode leaves no backdrop sounding.
    maps_to:
      capability: notes.play

  - id: INT-NOTES-011
    name: Turn the tracks a press sounds on and off
    view: VIEW-NOTES-002
    precondition: >
      The note has stored audio and a track beyond the take — chords read
      from it, a melody read from it, or both.
    steps:
      - Turn the take, the chords and the melody on or off beside the
        play control
      - Press play
    outcome: >
      Play sounds exactly the tracks left on: the recorded take, the
      chord backdrop under it, the detected melody over it, in any
      combination. The take and the chords are on and the melody off
      before anything is turned. The chords with the take off run to the
      end of the progression and hand the control back to play. Turning
      a track while something is sounding stops it, so the next press
      starts the mix as it now stands.
    error_handling: >
      Only tracks the note has are offered, and a note with nothing to
      turn shows no toggles and plays the take alone. The melody rides
      the take, so its toggle cannot be turned on with the take off.
    maps_to:
      capability: notes.set_playback_mix

  - id: INT-NOTES-016
    name: Hear the melody that was read, and stop it
    view: VIEW-NOTES-002
    precondition: The note has a melody.
    steps:
      - Press the melody control under the graph
      - Press it again
    outcome: >
      The first press sounds the melody in whichever reading is chosen
      beside it, and the control becomes the stop for what it started.
      The second press silences it. Left alone, it silences itself when
      the melody runs out and the control offers play again.
    error_handling: >
      A note with no melody offers no such control. Changing the
      reading, or tapping a note or a chord, stops what is sounding
      rather than leaving the control claiming to play.
    maps_to:
      capability: notes.play_melody

  - id: INT-NOTES-010
    name: Play a kept idea from the list
    view: VIEW-NOTES-001
    precondition: The note has stored audio.
    steps:
      - Press play on the note's card
    outcome: >
      That press starts the capture playing and the control itself
      becomes the playing state, offering stop. The line directly above
      the control counts the position while the take runs and returns to
      the length alone once it stops. The singer is not asked to press a
      second control to make sound, and is never handed a close control
      to dismiss a player they did not ask to open.
    error_handling: >
      A note whose upload never completed shows no play control at all,
      so there is no press that does nothing. A take that cannot be
      decoded says so beside the control, which returns to offering
      play.
    maps_to:
      capability: notes.play
