# How the playback options sheet is opened — as against what it holds, which
# is INV-NOTES-019 in invariants-playback.yml and INV-NOTES-026 in
# invariants-edits.yml. Its own file so both of those stay inside the
# 150-line spec-file budget.

invariants:
  - id: INV-NOTES-075
    description: What opens the playback options is drawn, not written
    severity: minor
    check: >
      The control at the far end of the note detail's transport row draws
      a vector glyph and renders no text at all, and pressing it opens
      the playback options sheet. The label a screen reader hears still
      names what it opens. Verified by asserting the control renders the
      glyph, that no word is rendered on it, and that a press reports the
      sheet should open.

      The transport it sits beside is already wordless (INV-NOTES-065),
      so a written control there was the one thing on the bar to be read
      rather than recognised — and the widest thing on a row that has a
      counter and a failure line to fit. The glyph is an SVG path drawn
      through the same Skia icon set as the rest of the app, so changing
      it stays a JavaScript change and ships over the air.

  - id: INV-NOTES-077
    description: A sheet is dragged by a handle outside its own scroll
    severity: major
    check: >
      Every bottom sheet is a native sheet whose grabber lives in the
      sheet chrome rather than inside the scrolling body, so dragging it
      pans the sheet — to a taller detent, or away. Verified by asserting
      no sheet draws its own handle inside its scroll view.

      A handle drawn inside a ScrollView is the one place a handle cannot
      work: the scroll view claims the drag first, so the body moves and
      the sheet never does. It reads as a sheet that has stopped
      responding.

  - id: INV-NOTES-078
    description: Choosing a thing never puts a sheet between you and it
    severity: critical
    check: >
      The sheet carrying a chosen object's details and actions leaves the
      graph reachable: nothing behind it is dimmed and nothing behind it
      stops taking touches, so the object can still be dragged while its
      own sheet is open. Verified by asserting the selection sheet is
      presented undimmed, which is what keeps the background live.

      The point of choosing something is to act on it, and dragging is one
      of the actions. A sheet that covered the graph would make the
      controls and direct manipulation exclusive — buttons or movement,
      never both — and movement is the one that has to be watched while it
      happens.

  - id: INV-NOTES-082
    description: Every control sits in the card of the thing it controls
    severity: major
    check: >
      The playback options are one card per thing that can sound. Each
      carries the same two controls in the same place — a level, and a
      speaker that mutes — and anything else belonging to that track sits
      beneath them: its readings as glyph toggles, and a register slider
      where the track is a line that can be moved. Nothing about a track
      appears outside that track's card. Verified by asserting each
      offered track renders a card, and that a track the note lacks
      renders none.

      The sheet had become a column of switches under a row of pills, so
      nothing said which control was about which line — "align to the
      beat" sat as far from the melody as "lift the chords" did. Grouping
      by subject is what makes a long list readable without reading it.

      Glyphs rather than pill pairs: these are all yes-or-no, and a pair
      of pills spends a word on each answer to say what a lit or unlit
      icon says for nothing. The words survive in the accessibility
      label, which is the one place a name costs nothing.

      The take sits at full and the voices read from it sit under it. They
      describe the performance; at equal level they argue with it.

  - id: INV-NOTES-083
    description: A press sounds exactly what the cards say it will
    severity: critical
    check: >
      Pressing play honours every setting in the options: each track's
      level, each track's mute, and the register the melody is set to.
      Nothing gates a track except its own control, and no level has two
      writers. Verified by asserting a track turned on sounds, and that
      the level reaching a voice is the one its card holds.

      Two ways this broke at once when the loose controls became cards.
      The melody stayed gated behind a "play over the recording" switch
      that had gone into the track list, so its own toggle turned a track
      that could never sound. And its level had two writers — the old
      slider's effect and the mix — so whichever committed second won,
      and moving the card's slider did nothing or was undone a frame
      later.

      A control that does not govern what it claims to govern is worse
      than no control: it teaches that the settings do not matter.

  - id: INV-NOTES-084
    description: A layer is sung against the mix, from the very beginning
    severity: major
    check: >
      Recording a layer plays the take under it honouring every option
      set — levels, mutes and register — and starts from the beginning of
      the recording rather than from the first note. Verified by asserting
      the layer capture starts playback at zero and through the same mix
      the transport uses.

      The singer has to hear what they are singing against, and what they
      chose to hear is what they chose for a reason. Starting at the first
      detected note would also throw away the count-in: a take that begins
      with the singer counting themselves in carries its own tempo and its
      own downbeat, and that is exactly the part a second voice needs to
      come in on.
