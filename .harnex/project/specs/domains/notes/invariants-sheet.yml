# How the playback options sheet is opened — as against what it holds, which
# is INV-NOTES-019 in invariants-playback.yml and INV-NOTES-026 in
# invariants-edits.yml. Its own file so both of those stay inside the
# 150-line spec-file budget.

invariants:
  - id: INV-NOTES-075
    description: What opens the playback options is drawn, not written
    severity: minor
    check: >
      The control at the far end of the note detail's transport row draws
      a vector glyph and renders no text at all, and pressing it opens
      the playback options sheet. The label a screen reader hears still
      names what it opens. Verified by asserting the control renders the
      glyph, that no word is rendered on it, and that a press reports the
      sheet should open.

      The transport it sits beside is already wordless (INV-NOTES-065),
      so a written control there was the one thing on the bar to be read
      rather than recognised — and the widest thing on a row that has a
      counter and a failure line to fit. The glyph is an SVG path drawn
      through the same Skia icon set as the rest of the app, so changing
      it stays a JavaScript change and ships over the air.

  - id: INV-NOTES-077
    description: A sheet is dragged by a handle outside its own scroll
    severity: major
    check: >
      Every bottom sheet is a native sheet whose grabber lives in the
      sheet chrome rather than inside the scrolling body, so dragging it
      pans the sheet — to a taller detent, or away. Verified by asserting
      no sheet draws its own handle inside its scroll view.

      A handle drawn inside a ScrollView is the one place a handle cannot
      work: the scroll view claims the drag first, so the body moves and
      the sheet never does. It reads as a sheet that has stopped
      responding.

  - id: INV-NOTES-078
    description: Choosing a thing never puts a sheet between you and it
    severity: critical
    check: >
      The sheet carrying a chosen object's details and actions leaves the
      graph reachable: nothing behind it is dimmed and nothing behind it
      stops taking touches, so the object can still be dragged while its
      own sheet is open. Verified by asserting the selection sheet is
      presented undimmed, which is what keeps the background live.

      The point of choosing something is to act on it, and dragging is one
      of the actions. A sheet that covered the graph would make the
      controls and direct manipulation exclusive — buttons or movement,
      never both — and movement is the one that has to be watched while it
      happens.
