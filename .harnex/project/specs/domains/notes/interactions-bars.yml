# Correcting how a take is written down. Split from interactions.yml.
interactions:
  - id: INT-NOTES-012
    name: Pick a bar line up, then move it
    view: VIEW-NOTES-002
    steps:
      - Press and hold a bar line until it lifts
      - Drag it left or right
      - Release
    outcome: >
      The line lands on the nearest grid step. The bar before it and the
      bar after it change length and are relabelled; the audio, the beat
      grid and every note stay exactly where they were.

      Nothing moves until the line has been picked up. A press alone does
      not take hold of it, so a swipe along the take or a pinch that
      happens to begin on a line scrolls or zooms rather than dragging
      the metre out from under the singer — the graph is covered in bar
      lines, so landing on one is the common case, not the rare one.

      While the drag is live a readout follows the finger, showing where
      the line will land and what the two bars either side will become.
      It sits above the finger and to one side, never under it: a person
      cannot judge a placement they are covering with their own hand.
    maps_to:
      capability: transcription.move_bar_line

  - id: INT-NOTES-013
    name: Split a bar in two
    view: VIEW-NOTES-002
    steps:
      - Press and hold inside a bar, away from its lines
    outcome: >
      A new bar line appears at the nearest grid step, splitting that bar.
      Moving lines alone cannot change how many bars there are, so this is
      what makes every arrangement reachable.
    maps_to:
      capability: transcription.add_bar_line

  - id: INT-NOTES-014
    name: Slide a bar line away
    view: VIEW-NOTES-002
    steps:
      - Press and hold a bar line until it lifts
      - Drag or flick it upward
      - Release
    outcome: >
      The line goes and the bars either side become one, and is thrown
      clear as it goes rather than simply vanishing. A flick releases it
      on speed alone; a slow drag releases it once it has been carried
      far enough. Either way the line marks itself as doomed before the
      finger lifts — it reddens and takes a cross — so the throw can be
      taken back by bringing it down again. Honouring only speed would
      leave a careful, slow removal failing after the line had already
      said it was going.

      The last remaining line cannot be removed, because a take with no
      bars is one nothing downstream can describe.

      The same hold that picks a line up decides by direction what
      becomes of it: sideways is where it goes, upward is away. Asking
      instead to "join two bars" never said which two — the one being
      touched with the bar ahead of it, or with the bar behind — while
      taking a line out says exactly one thing.
    maps_to:
      capability: transcription.remove_bar_line
