# Turning the tracks a press sounds on and off — notes.set_playback_mix.
# Split out of playback.yml, which crossed the 150-line spec-file budget when
# the melody became a track of its own.
acceptance:
  - id: ACC-NOTES-033
    interface: ui
    title: Turning the take track off plays no take
    given:
      - a signed-in singer S
      - singer S has a note N with stored audio
    when:
      - singer S calls notes.set_playback_mix on note N
    then:
      - the note field takeTrackOn is false
      - the note field takeDecoded is false
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-019]
      interaction: INT-NOTES-011

  - id: ACC-NOTES-034
    interface: ui
    title: Turning the chord track off sounds no chords
    given:
      - a signed-in singer S
      - singer S has a note N with stored audio
    when:
      - singer S calls notes.set_playback_mix on note N
    then:
      - the note field chordTrackOn is false
      - the note field backdropScheduled is false
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-019]
      view: VIEW-NOTES-002

  - id: ACC-NOTES-040
    interface: ui
    title: The melody sounds over the take only when its track is on
    given:
      - a signed-in singer S
      - singer S has a note N with stored audio and a detected melody
    when:
      - singer S calls notes.set_playback_mix on note N
    then:
      - the note field melodyTrackOn is true
      - the note field melodyScheduled is true
      - the note field melodyOverTakeSwitchShown is false
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-019, INV-NOTES-027]
      interaction: INT-NOTES-011

  - id: ACC-NOTES-041
    interface: ui
    title: A note with nothing to turn shows no track toggles
    given:
      - a signed-in singer S
      - singer S has a note N with stored audio, no chords and no melody
    when:
      - singer S views note N
    then:
      - the note field trackTogglesShown is 0
      - the note field takeTrackOn is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-019]
      interaction: INT-NOTES-011

  - id: ACC-NOTES-216
    interface: ui
    title: Toggling a track does not freeze the level match
    given:
      - a signed-in singer S
      - singer S has a note N whose take was measured as quiet
      - no level on note N has been moved by hand
    when:
      - singer S turns a track on and reopens note N
    then:
      - the note field tracksFollowTheTake is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-141]

  - id: ACC-NOTES-217
    interface: ui
    title: A level moved by hand is kept and still wins
    given:
      - a signed-in singer S
      - singer S has a note N whose take was measured as quiet
    when:
      - singer S sets the melody level by hand and reopens note N
    then:
      - the note field melodyLevelSetByHand is true
      - the note field otherTracksFollowTheTake is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-141]

  - id: ACC-NOTES-218
    interface: ui
    title: A quiet take is lifted rather than leaving the tracks above it
    given:
      - a signed-in singer S
      - singer S has a note N whose take was sung far below the reference
    when:
      - singer S plays note N with the transcription on
    then:
      - the note field takeMakeUpGain is above 1
      - the note field takeSitsWithTheTracks is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-141]

  - id: ACC-NOTES-219
    interface: module
    title: A loud take is not lifted into the ceiling
    given:
      - a take whose median note is quiet but whose loudest note is near full
    when:
      - the take's make-up gain is worked out
    then:
      - the loudest note stays below the ceiling
      - the gain is smaller than the median alone would ask for
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-141]

  - id: ACC-NOTES-220
    interface: ui
    title: A tapped note sounds at the transcription's level
    given:
      - a signed-in singer S
      - singer S has set the transcription level to a quarter
    when:
      - singer S taps a sung note to check it
    then:
      - the note field auditionLevel is 0.25
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-175, INV-NOTES-144]

  - id: ACC-NOTES-221
    interface: ui
    title: A sheet opened from the graph leaves the graph in view
    given:
      - a signed-in singer S viewing a note with a melody
    when:
      - singer S taps a sung note on the graph
    then:
      - the note field selectionSheetOpensPartWay is true
      - the note field graphRemainsVisible is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-078]

  - id: ACC-NOTES-222
    interface: module
    title: The same taps read differently under a different pattern
    given:
      - a take tapped evenly four times
    when:
      - the pattern is beats two and four of four
      - and then every beat of four
    then:
      - the second tempo is half the first
      - the downbeat moves with it
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-209]

  - id: ACC-NOTES-223
    interface: ui
    title: A take says nothing about its taps until somebody does
    given:
      - a signed-in singer S with a freshly recorded note that was tapped
    when:
      - singer S opens the note
    then:
      - the note field tapPatternSet is false
      - the note field gridUnchanged is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-209, INV-NOTES-161]

  - id: ACC-NOTES-224
    interface: ui
    title: Taking the pattern back restores the grid
    given:
      - a signed-in singer S with a note whose taps were said to be two and four
    when:
      - singer S unsets the pattern
    then:
      - the note field tapPatternSet is false
      - the note field gridUnchanged is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-209, INV-NOTES-161]

  - id: ACC-NOTES-225
    interface: ui
    title: Moving the first note leaves the pickup where it was
    given:
      - a signed-in singer S with a note whose take has a pickup
    when:
      - singer S moves the first note later
    then:
      - the note field pickupEndsAtMs is unchanged
      - the note field headReachesStartOfTake is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-210, INV-NOTES-174]

  - id: ACC-NOTES-226
    interface: ui
    title: A pickup can be set in beats
    given:
      - a signed-in singer S with a note whose take opens on a downbeat
    when:
      - singer S sets the pickup to two beats
    then:
      - the note field pickupBeats is 2
      - the note field barLengthsUnchanged is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-211, INV-NOTES-210]

  - id: ACC-NOTES-227
    interface: ui
    title: Rewind during playback plays from the beginning
    given:
      - a signed-in singer S with a note playing a minute in
    when:
      - singer S presses rewind
    then:
      - the note field headAtMs is 0
      - the note field isPlaying is true
      - the note field viewShowsStart is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-160, INV-NOTES-212]

  - id: ACC-NOTES-228
    interface: ui
    title: Choosing a note says everything the list said
    given:
      - a signed-in singer S viewing a note with a melody
    when:
      - singer S taps a sung note on the graph
    then:
      - the note field selectionCarriesName is true
      - the note field selectionCarriesStart is true
      - the note field selectionCarriesLength is true
      - the note field selectionCarriesTuning is true
    maps_to:
      capability: notes.set_playback_mix
      invariants: [INV-NOTES-213, INV-NOTES-175]

  - id: ACC-NOTES-229
    interface: ui
    title: A reading can be put back after reading again
    given:
      - a signed-in singer S with a note read once
    when:
      - singer S reads the take again and does not like it
      - singer S puts the previous reading back
    then:
      - the note field melodyMatchesPrevious is true
    maps_to:
      capability: notes.reread_take
      invariants: [INV-NOTES-215, INV-NOTES-116]

  - id: ACC-NOTES-232
    title: A phrase in six-eight, tapped on one, three and five
    given: A take with taps and no pattern set
    when: The bar is set to six beats and beats 1, 3 and 5 are chosen
    then: >
      The pattern is six beats to a bar with those three tapped, and the
      tempo is read through it (INV-NOTES-218).

  - id: ACC-NOTES-233
    title: Shortening the bar drops what no longer fits
    given: Six beats to a bar with 1, 3 and 5 tapped
    when: The bar is set to four beats
    then: >
      Beat 5 is dropped and 1 and 3 stay, rather than leaving a pattern the
      bar cannot hold (INV-NOTES-219).

  - id: ACC-NOTES-234
    title: Taps survive the take being uploaded
    given: A take kept on the device with beats tapped while singing
    when: It uploads and the server's record replaces the local one
    then: >
      The beats are still on the note, and are queued to reach the server
      (INV-NOTES-220).

  - id: ACC-NOTES-235
    title: A take nobody tapped can still be told its bar is six beats
    given: A take with no tapped beats
    when: The bar length is set to six
    then: >
      The grid holds six beats to a bar, and no tempo is claimed from the
      taps that are not there (INV-NOTES-221).

  - id: ACC-NOTES-236
    title: What moves the bar lines is at the top of the sheet
    given: The analysis sheet open over the graph
    when: It is read from the top
    then: >
      Tempo and tap pattern come first, and the measured summary follows
      them (INV-NOTES-222). The count-in is not among them: it is reached
      by tapping the block it is (INV-NOTES-269), and made from the step
      sheet (INV-NOTES-270).

  - id: ACC-NOTES-237
    title: A dragged pitch is still sounding after the drag has moved it
    given: A sung note chosen on the graph, with drag hearing on
    when: The finger crosses a semitone, moving the note as it goes
    then: >
      The pitch it reached is scheduled and still sounding — the engine is
      still held and the audition bus is not cleared — though the reading
      changed in the same frame (INV-NOTES-223, INV-NOTES-070).

  - id: ACC-NOTES-238
    title: Corrected pitches are still there on coming back to the take
    given: A take whose notes have been corrected on the graph
    when: The note is left for the list — which syncs — and opened again
    then: >
      Every correction is still on the graph, whether or not the server
      received it, and a sync does not replace a reading still waiting to
      be delivered (INV-NOTES-224, INV-NOTES-021).

  - id: ACC-NOTES-239
    title: A take still plays after a note has been moved in time
    given: A take with a note that has been moved earlier or later
    when: Play is pressed
    then: >
      The take plays from where the head is, and the stretch marked by the
      retiming sounds once when it was marked rather than again on every
      redraw (INV-NOTES-225, INV-NOTES-178).

  - id: ACC-NOTES-240
    title: Choosing a note brings the graph above the sheet
    given: A note detail page with the graph at its usual size
    when: A note is chosen and the sheet describing it opens
    then: >
      The page is scrolled to the graph and the graph is sized to the room
      between the header and the top of the sheet, never larger than it was
      and never smaller than a graph can be drawn in (INV-NOTES-226).

  - id: ACC-NOTES-241
    title: The take is played from the graph's own edge
    given: A note detail page, with or without a sheet over it
    when: The rail's play control is pressed while the take runs
    then: >
      The take pauses where it reached rather than returning to the top, and
      the moment it reached is shown beside the control against the take's
      length (INV-NOTES-227).

  - id: ACC-NOTES-243
    title: The levels and the analysis are behind one control
    given: A note detail page
    when: The control at the foot of the rail's switches is pressed
    then: >
      Both what each track sounds at and the take's analysis are offered,
      opening out of the rail across the graph rather than up from the bottom
      of the screen, each opening what it names, closing on a touch anywhere
      else, and neither reachable any other way (INV-NOTES-229).

  - id: ACC-NOTES-250
    title: Dragging an end of a stretch writes it down once
    given: A note with a playable stretch marked on its graph
    when: An end of that stretch is dragged across the graph and released
    then: >
      The end follows the finger the whole way without the page re-rendering,
      the take falls silent once as the drag begins rather than on every
      frame, and the moved end is written down once, on release
      (INV-NOTES-235).

  - id: ACC-NOTES-251
    title: Dragging a level does not re-render what holds it
    given: A track with a level control
    when: The level is dragged
    then: >
      What is heard follows the finger, the control's own thumb is drawn from
      a value the UI thread owns, and the gesture is not rebuilt as the drag
      runs (INV-NOTES-235).

  - id: ACC-NOTES-249
    title: A note with no reading yet does not recompute for ever
    given: A note whose take has been kept but not yet read
    when: The page renders twice with nothing changed
    then: >
      The reading it works from is the same object both times, and so is
      everything derived from it — no memo downstream of an absent reading is
      invalidated by the absence itself (INV-NOTES-234).

  - id: ACC-NOTES-248
    title: A rail with more switches than room still offers all of them
    given: A note with every track, beside a graph too short to hold them
    when: The rail is read
    then: >
      The switches and the grid scroll within the room left over, on their own
      and without moving the graph, while the menu, the question mark, the
      rewind and the play control stay where they are — every track still
      reachable, and the transport still at the graph's foot (INV-NOTES-233).

  - id: ACC-NOTES-247
    title: The rail can be read rather than guessed at
    given: A note detail page whose take has no bass line
    when: The question mark under the rail's menu control is pressed
    then: >
      A legend rises from the bottom of the screen naming every mark on the
      rail and in its foot — the letter of each track the note has, the grid,
      the menu, the question mark, the rewind, the play control and the
      moment, the handle and each act behind it — carrying the same mark the
      rail carries in each row, saying nothing about the bass line the note
      does not have, and closing again (INV-NOTES-232).

  - id: ACC-NOTES-242
    title: A corrected note changes what the card says about the take
    given: A take whose highest note has been corrected upward by hand
    when: The list is read
    then: >
      The card's range and shape carry the correction, and so does the open
      note's analysis, while the steadiness measured against the recording is
      unchanged (INV-NOTES-228).

  - id: ACC-NOTES-244
    title: The instruments under the graph are swiped through
    given: A note detail page with a melody
    when: The row under the graph is swiped sideways
    then: >
      It settles on one instrument at a time, opens on the guitar neck, and
      ends on a card saying more instruments are coming rather than on an
      empty edge (INV-NOTES-151).

  - id: ACC-NOTES-245
    title: The foot opens into what remakes the graph
    given: A note detail page with a take
    when: The handle down its right edge is dragged, or the moment touched
    then: >
      The foot follows the thumb as far as there is to open, settles fully
      open or fully shut when it leaves, and offers — each the same width — a
      record for a bass line, a re-read of the take, and the chords
      (INV-NOTES-230).

  - id: ACC-NOTES-246
    title: The chords come and go on one control
    given: A take whose chords have been read and then edited by hand
    when: The chord control is pressed twice more
    then: >
      The chords leave the graph and come back read afresh, with the hand-made
      decisions still on them (INV-NOTES-231, INV-NOTES-022).
