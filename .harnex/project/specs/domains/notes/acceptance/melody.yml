# Sounding the melody read out of a take, and stopping it again —
# INV-NOTES-067. Its own file so acceptance/playback.yml stays inside the
# 150-line spec-file budget.
acceptance:
  - id: ACC-NOTES-038
    interface: ui
    title: The control that starts the melody is the control that stops it
    given:
      - a signed-in singer S
      - singer S has a note N with stored audio
    when:
      - singer S calls notes.play_melody on note N
    then:
      - the note field melodyPlaying is true
      - the note field melodyControlsShown is 1
    maps_to:
      capability: notes.play_melody
      invariants: [INV-NOTES-067]
      interaction: INT-NOTES-019

  - id: ACC-NOTES-039
    interface: ui
    title: A second press stops the melody and sounds nothing new
    given:
      - a signed-in singer S
      - singer S has a note N with stored audio
    when:
      - singer S calls notes.play_melody on note N
    then:
      - the note field melodyPlayingAfterSecondPress is false
      - the note field melodyScheduledOnSecondPress is false
    maps_to:
      capability: notes.play_melody
      invariants: [INV-NOTES-067]
      interaction: INT-NOTES-019

  - id: ACC-NOTES-230
    title: A take is read again with its own settings, not today's
    given: A take read in August, and thresholds changed since
    when: The take is read again
    then: >
      The settings stored on the take are the ones in force, and the
      app-wide values do not reach it (INV-NOTES-216).

  - id: ACC-NOTES-231
    title: Tuning beside a take does not move the app or the library
    given: The tuning panel open beside one take
    when: A knob is turned
    then: >
      That take's stored settings change; the app-wide value and every
      other take are left as they were (INV-NOTES-217).

