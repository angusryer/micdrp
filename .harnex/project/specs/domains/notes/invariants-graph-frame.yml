# How much of the screen the graph gets, and what is drawn over it. Split from
# invariants-graph.yml to stay inside the 150-line spec-file budget (Axiom 3).
invariants:
  - id: INV-NOTES-100
    description: The playhead runs the height of the graph, over the notes
    severity: major
    check: >
      Where the take has reached is drawn as a vertical line spanning the
      whole drawing, over the notes rather than behind them, and it takes no
      touches. It marks nothing for a moment outside the take. Verified by
      asserting the line is the graph's full height, that it is transparent
      to touch, and that it is absent before the start and after the end.

      The scrubber's handle sits in a band above the drawing so it never
      covers the notes it points at (INV-NOTES-081). That solves the handle
      and leaves the position: a mark only in the band answers "where am I"
      for the top edge of the graph and leaves the eye to trace downward and
      guess. The line is the answer carried the whole way.

      Over rather than under, because the notes are what the position is
      being read against — a playhead hidden behind the bar it is passing is
      not telling anyone where the take is. Transparent to touch, because it
      crosses every note in the take and a line that swallowed touches would
      make the notes under it unpickable.

  - id: INV-NOTES-101
    description: The graph runs to the edges of the screen
    severity: major
    check: >
      The drawing has no border and no rounded corners, and reaches the edges
      of the screen: upright it breaks out of the page's own margins, and
      sideways it runs from the left edge to the right edge, or to the
      selection panel when one is out (INV-NOTES-099). Verified by asserting
      the graph is drawn to the full room it was measured into, with nothing
      subtracted for a frame.

      Every pixel of width is a moment of the take, and every pixel of height
      is a semitone of the range. A frame spends both on saying where the
      drawing stops, which the drawing already says — and it spends them at
      the scale where they are scarcest, since a take runs past the screen
      and is reached by scrolling (INV-NOTES-032).

  - id: INV-NOTES-102
    description: Each kind of vertical line is drawn at its own weight
    severity: major
    check: >
      Four things are drawn down the graph, in this order of strength: the
      solid line marking the downbeat currently in hand, the solid line where
      the singing starts, the dotted rule marking every downbeat, and the
      fainter dotted rule marking the pulse between them. Only the two rules
      are dotted, with more gap in the pulse than in the downbeats. Verified
      by asserting the order holds between all four, that both rules are
      dotted, that the bar's rule is the more continuous of the two, and — on
      the canvas itself — that every rule drawn carries a dash and the
      boundary does not.

      The two solid ones are content: one is a thing you are holding, the
      other is a fact about the recording (INV-NOTES-080). The two dotted ones
      are rulings the app laid down to measure by. The boundary line used to
      sit at exactly a bar rule's strength, so a thing being reported looked
      like a thing being measured with.

      The order is what says which lines can be touched. A downbeat can be
      picked up and moved (INV-NOTES-045); the pulse between them cannot.
      Drawn at equal weight the picture said nothing about the difference,
      and the eye had no way to tell a thing it could act on from a ruling.

      Dotted rather than merely faint, because faintness alone is a matter of
      degree and reads as the same kind of thing drawn more weakly. A dotted
      line reads as a ruling, which is what it is.

  - id: INV-NOTES-103
    description: The chord strip is its own ground, not a row of frames
    severity: minor
    check: >
      The chord cards under the graph carry no border. The strip they sit in
      has a background of its own, distinguishable from the drawing above it,
      separated by a single hairline. A chord that was edited is still marked.
      Verified by asserting the strip has its own background and a hairline
      top border, and that an unedited card draws neither border nor fill.

      A card is placed by its left edge on the downbeat it describes
      (INV-NOTES-061), so its position already says which chord it is and a
      frame around it said nothing further. It was not free: the frame took
      width at exactly the scale where a chord is already too narrow to name
      and has to be drawn as a mark instead (INV-NOTES-063).

      The strip keeps a ground of its own because it is a reading of the
      drawing rather than part of it, and the eye needs to know where one
      stops. One hairline is enough to say so — anything heavier reads as a
      bar line, which is the one thing a horizontal rule on this graph must
      not look like.

      Each card carries a faint tick down its left edge. Without frames the
      strip is one field of text, and the tick is what says a chord starts
      here rather than continuing from the one before it — the same thing the
      frame said, at the one edge where it was carrying information.

  - id: INV-NOTES-104
    description: A downbeat is drawn where it can be picked up
    severity: critical
    check: >
      The rule drawn for a downbeat and the handle the touch surface reads
      come from one arrangement through one time axis. The dotted rules mark
      the arrangement's own lines whether a person placed them or they were
      read from the music, and the pulse between them is still drawn. A solid
      line is drawn for the downbeat in hand and for no other. Verified by
      asserting the painting layer and the listening layer are handed the same
      array, that a downbeat lands past the pickup rather than at the start of
      the recording, and that beats survive an arrangement.

      Two layers each worked this out for itself, and the one that listened
      laid the take out again from the notes alone — so it never learned the
      recording began before the singing did, and placed every line the whole
      length of the pickup earlier than the downbeat it marked. Each was
      correct against its own arithmetic, which is why nothing caught it: the
      only fix that holds is that there is one answer rather than two that
      agree today (Axiom 2).

      A solid line for every downbeat, on top of the dotted rule already
      marking it, said the same thing twice and read as a second kind of
      object that could not be selected. What is left is the one job the
      dotted rule cannot do, which is to show which line is in hand.

  - id: INV-NOTES-105
    description: The chords are drawn quieter than the performance
    severity: minor
    check: >
      The colours that say which part of a chord a note plays are muted rather
      than saturated, light enough to read on a dark ground, and still held
      apart in hue. Verified by asserting each is below full strength, above
      half lightness, and separated from its neighbours by hue.

      Two different things are drawn on this graph. The sung line and the
      hummed bass are performances — someone did that. The chord notes are a
      reading of what those performances implied, produced by the app. At
      equal strength the reading pulled the eye first, which inverts what the
      screen is about.

      Muted in strength and not in hue, because which part a note plays has to
      stay readable at a glance and colour is the only thing carrying it
      (INV-NOTES-052). Turning a colour down is a change of emphasis; changing
      it is a change of identity.

  - id: INV-NOTES-106
    description: Upright, the graph takes half the screen
    severity: minor
    check: >
      The graph card upright is half the height of the screen, with a floor
      below which it does not shrink. Verified by asserting the height given
      to it is derived from the window rather than fixed.

      It is what the page is about, and everything else on the page is
      support. A fixed number of points read well on the phone it was chosen
      on, and was a third of the screen on a larger one and most of it on a
      smaller one — so the same take looked like a different amount of work
      depending on the device.

  - id: INV-NOTES-107
    description: The pickup is drawn as ground, not as empty graph
    severity: minor
    check: >
      The stretch of recording before the first sung note carries a very faint
      crosshatch, drawn under everything else, with no line escaping that
      stretch. The pattern is placed on a fixed grid so it holds still while
      the graph zooms. Verified by asserting every segment stays inside the
      region, that lines run both ways, and that widening the region keeps the
      lines already drawn.

      A single line already marks where the singing starts (INV-NOTES-080),
      which says where the boundary is and nothing about which side is which.
      Empty graph before it reads as a passage with no notes detected — a
      failure to hear something — when in fact nothing was sung there and
      there is nothing to correct.

      Under everything, and faint enough to be ground. A hatch that competed
      with the rules or the notes would be a mark on the graph rather than the
      surface it is drawn on, which is the opposite of what it is for.

  - id: INV-NOTES-108
    description: The graph is the whole recording, both ends
    severity: major
    check: >
      The time axis runs from where the recording began to where it ended,
      not from the first detected note to the last. The stretch after the last
      note is drawn as the same faint ground as the pickup (INV-NOTES-107). A
      stated end earlier than the singing is ignored rather than truncating
      it. Verified by asserting the axis reaches the recording's end, that the
      notes do not move when the window widens, and that an end before the
      last note is refused.

      The pickup was already let in at the start (INV-NOTES-080) and the tail
      was not, so the graph was asymmetric: silence before the singing was
      drawn and silence after it was simply absent. A take that ran on after
      the last note therefore looked cut off at exactly the point detection
      stopped finding things.

      That matters most where detection is weakest. A quiet note at the end of
      a take that the detector missed does not read as a missed note — it
      reads as a recording that ended early, which is a claim about the
      hardware rather than about the reading. Drawing the whole recording puts
      the missing note back in view as a gap in ground that is plainly there.

  - id: INV-NOTES-109
    description: A page under a sheet can still be scrolled clear of it
    severity: major
    check: >
      While ANY sheet is up, the page beneath keeps room at its foot equal to
      what the sheet is covering, so its last row can be scrolled into view.
      Every sheet reports that height from where it actually settled rather
      than it being assumed, and gives the room back when it goes. Verified by
      asserting the reported cover is the screen below the sheet's position,
      that it is never negative, that dismissal returns zero, and that a sheet
      dragged to a new height reports the new one.

      Any sheet, not one of them. This was fixed for the selection sheet and
      then reappeared with the next sheet that covered a page, because the
      reporting was written into that sheet rather than into what a sheet is.
      One sheet with the behaviour built in is what stops it being fixed a
      third time (INV-NOTES-181).

      The sheet is undimmed and non-modal so the page stays live behind it
      (INV-NOTES-078). That promise is only half kept if the page cannot be
      reached: the bottom of the column sat under the sheet and scrolling
      there sprang back, because the content ended where it always had and
      there was nothing below to scroll to.

      Measured rather than assumed because the sheet sizes itself to its
      content, and its content is whatever was chosen — one note's facts, or a
      list of nine.

  - id: INV-NOTES-110
    description: The loupe shows the note, not only its name
    severity: minor
    check: >
      While a note is being dragged, the readout above the finger shows the
      lanes around the pitch it would become, with the note drawn in its own,
      highest at the top as on the graph. Verified by asserting the strip is
      drawn when a pitch is given and absent when none is.

      The name alone answers "what will this become" and leaves "where is
      that" to be worked out from a word, while the thing that would answer it
      is under the hand. This is what the text cursor's bubble does: it shows
      the letters either side of where the cursor would land, so the placement
      is seen rather than recalled.

  - id: INV-NOTES-111
    description: A note can be moved without being covered
    severity: major
    check: >
      The selection sheet offers a control that moves everything chosen: up
      and down by a semitone, left and right by a sixteenth, notched so one
      notch is one step. The sideways bar is withheld where the take has no
      tempo. Moving in time keeps each note's length, leaves other notes where
      they are, and stops against a neighbour rather than pushing it along.
      Verified by asserting a shifted note keeps its duration, that neighbours
      do not move, that a set moves as one, and that the time bar is absent
      without a grid.

      Dragging on the graph is the fast way and stays the fast way, but the
      thing being aimed at is under the hand aiming at it and a semitone lane
      is a few points tall. The loupe answers that by showing what is covered
      (INV-NOTES-110); this answers it by covering nothing — the hand is in
      the sheet and the note is on the graph, in full view, moving.

      Notched for the same reason the length control is: a heavy thumb cannot
      land between two steps, so "up one semitone" is a thing that can be
      asked for exactly rather than aimed at.

      It also moves a set, which dragging does but awkwardly — several chosen
      notes have no single thing to put a finger on.

  - id: INV-NOTES-117
    description: The struck sounds get a band of their own, on the graph's axis
    severity: major
    check: >
      Hits are drawn in a band inside the graph's own scroll, placed
      horizontally by the graph's own time axis and vertically by what they
      sounded like — brightest lane at the top, deepest at the bottom, and a
      lane for a hit whose kind was never worked out. Only the lanes in use
      take room, and the band takes its height out of the graph's slot rather
      than adding to it. It takes no touches. Verified by asserting a mark per
      hit including unknown ones, that the band is empty and takes no height
      when nothing was struck, that one kind of hit yields one lane, and that
      a harder hit is drawn larger.

      A band of its own because a hit has no pitch. There is no height on the
      melody graph that means anything for it, and placing one there would be
      inventing a pitch for a sound that has none — the same category error as
      giving a drum a note name.

      On the graph's own time axis, handed in rather than derived, so a drum
      sits under the note it was struck against at every zoom and scroll
      position. This is the rule the chord cards follow (INV-NOTES-061) and
      the one the downbeats had to be fixed for twice (INV-NOTES-104): two
      mappings over one timeline disagree eventually, and the disagreement is
      invisible until it is large.

      Only the lanes in use, because a take of nothing but thumps drawn as
      three empty rows and one full one says the app was expecting something
      that did not happen.

      Drawn from how hard each was struck rather than from how sure the app is
      that it was a drum. Confidence is a fact about the reading, not about the
      sound, and expressing it as loudness would draw a softly-struck hit the
      app is certain of more weakly than a loud one it is guessing at.
