# Render economy: what must keep its identity between renders, and what must
# never reach the JS thread at all. Its own file because the failures here look
# like performance faults and are not — they are correctness faults that
# present as heat, and two of them have stopped this app dead.
invariants:
  - id: INV-NOTES-234
    description: An absent reading is the same absence on every render
    severity: major
    check: >
      A value handed to a memo, a callback, or anything published upward must
      keep its identity while the thing it describes has not changed. Where the
      value is a reading that may be missing, the stand-in for missing is one
      object reused, never a fresh empty literal per render: an empty array
      written at the point of use is a different array every time, and every
      memo downstream of it recomputes for ever.

      Verified by asserting that a note with no reading yields the same reading
      object across renders, and that what is derived from it does too.

      This is a correctness rule wearing a performance rule's clothes. What it
      actually prevents is the shape that has already broken this app once: a
      value regenerated each render travels up into something published, the
      publish re-renders the holder, the holder makes a new value, and the JS
      thread never comes back. Nothing there is slow — it is a loop, and it
      presents as an app that will not start rather than as an app that lags.

      A note with a reading was never at risk, because its reading is stable as
      long as the note is. The one that suffers is the note with no reading
      yet, which is the note just captured and the note whose reading failed —
      the two least able to afford it.

  - id: INV-NOTES-235
    description: A dragged control moves on the UI thread and commits once
    severity: major
    check: >
      Anything dragged along the graph — an end of a playable stretch, a level,
      the readout that follows a moved note — is drawn from a value the UI
      thread owns, and follows the finger without a render. What it means is
      written down once, when the finger leaves. Not per frame: a control that
      commits on every update re-renders whatever holds that state sixty times
      a second, and where that state is read beside the graph, the graph
      reconciles sixty times a second with it.

      Anything that has to happen the moment a drag begins — falling silent
      while a stretch is being decided — happens on the first touch and not
      again. Once is what "while it is being moved" means; sixty times a
      second is the same instruction repeated until the finger lifts.

      What the gesture is built from must be stable too, or the memo around it
      is decoration: an inline arrow passed as the handler is a new handler
      every render, so the gesture is rebuilt on every frame of the very drag
      it is handling.

      Verified by asserting a drag from touch to release writes the moved
      value once, that what must happen at the start happens once, and that
      the drawn position comes from a shared value rather than from a prop.

      The exception is what a drag genuinely changes as it goes. Moving a note
      by a semitone is a change to the reading and must be written down when
      it crosses, which is why that one is gated on crossing rather than on
      the frame — the rule is that a frame is not a reason, not that a drag
      may never write.
