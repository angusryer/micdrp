views:
  - id: VIEW-NOTES-001
    name: Notes
    route: Notes
    description: >
      The tab. Every sung idea the singer has kept, newest first, each
      card showing its title, when it was captured, how long it is, and
      the shape of its melody. Capture starts from here.
    requires_auth: true
    min_role: singer
    data_sources:
      - notes.list
    elements:
      - A record control that starts and stops a capture — a compact
        circle filled solid in the palette's red, reading as a disc and
        not as a ring, showing a stop glyph while a capture is running
      - A live pitch line while recording, drawn off the JS thread — a
        slim band, kept short enough that the note list below it stays
        the larger half of the screen
      - A list of note cards, newest first
      - A play control on each card that starts the capture playing on
        the press itself, shown only on a card whose audio is stored;
        the press moves that same control into its playing state, from
        which it stops the take — no player opens and nothing is closed
      - A failure line beside that control when the take cannot be
        played, replacing neither the control nor the card
      - The take's length on each card, sitting on its own line directly
        above the play control rather than among the facts at the top,
        and shown once; while that take plays, the same line counts the
        running position against the length
      - A melody shape on each card, drawn from the persisted melody
      - A pull-to-refresh that re-syncs from the server
      - An empty state shown when the singer has kept nothing yet
      - A delete action on each card, confirmed before it runs

  - id: VIEW-NOTES-002
    name: Note detail
    route: Notes/:id
    description: >
      One idea, examined. The melody as a piano roll with bar lines and
      its time signature, the descriptive analysis, the editable chord
      backdrop underneath it, playback, and export.
    requires_auth: true
    min_role: singer
    parent_view: VIEW-NOTES-001
    data_sources:
      - notes.list
      - notes.open_chord_track
      - notes.play
      - notes.play_backdrop
      - notes.set_playback_mix
      - notes.export_midi
    elements:
      - The note's title
      - A piano-roll melody view over time and pitch
      - Bar lines and the time signature, presented as an assumption when
        the metre was not measured
      - The descriptive analysis — key, tempo, range, steadiness — with no
        headline score
      - A chord track under the melody, one slot per bar, scrolled
        sideways when the progression runs past the screen
      - Controls on each chord slot to nudge it, reshape it, and revert
        it, none of which claim a sideways drag
      - A revert-all control, shown only once something has been edited
      - A playback bar, absent when the note has no stored audio, whose
        play control sounds the chord backdrop under the take as well as
        the take itself, and silences it again on stop
      - A choice beside that play control of what it sounds — the take,
        the chords, or both, which is what is offered until something
        else is chosen — shown only when the melody implied chords to
        choose between
      - An export control offering the melody as a MIDI file
