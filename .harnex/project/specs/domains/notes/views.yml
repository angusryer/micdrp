views:
  - id: VIEW-NOTES-001
    name: Notes
    route: Notes
    description: >
      The tab. Every sung idea the singer has kept, newest first, each
      card showing its title, when it was captured, how long it is, and
      the shape of its melody. Capture starts from here.
    requires_auth: true
    min_role: singer
    data_sources:
      - notes.list
    elements:
      - The list of kept notes, and nothing above it. This is the first
        thing the app opens on, so it is what the singer sees and it is
        the whole page
      - A record control floating over the list at the bottom — a circle
        filled solid in the palette's red, reading as a disc and not as
        a ring — which opens the recording view rather than starting a
        capture where it stands
      - Room below the last card for that control, so scrolling to the
        end reaches the card rather than the button covering it
      - A list of note cards, newest first
      - A play control on each card that starts the capture playing on
        the press itself, shown only on a card whose audio is stored;
        the press moves that same control into its playing state, from
        which it stops the take — no player opens and nothing is closed
      - A failure line beside that control when the take cannot be
        played, replacing neither the control nor the card
      - The take's length on each card, sitting on its own line directly
        above the play control rather than among the facts at the top,
        and shown once; while that take plays, the same line counts the
        running position against the length
      - A melody shape on each card, drawn from the persisted melody
      - A pull-to-refresh that re-syncs from the server
      - An empty state shown when the singer has kept nothing yet
      - A delete action on each card, confirmed before it runs

  - id: VIEW-NOTES-010
    name: Recording
    route: Record
    description: >
      Singing, with nothing else on the screen. Full screen and dark, so
      what little is drawn is what is happening: the pitch as it is
      heard, the note it is nearest, and the two things a singer does
      with their hands while singing — tapping the beat, and stopping.
    requires_auth: true
    min_role: singer
    parent_view: VIEW-NOTES-001
    data_sources:
      - notes.capture
    elements:
      - A dark ground, so a lit phone held at arm's length in a room is
        legible and is not the brightest thing in it
      - A capture already running on arrival: the press that opened this
        view was the decision to sing, and asking for a second press
        asks twice for one intention
      - A way out at the top left that keeps nothing, always available —
        a view that records the moment it opens must never be one you
        are stuck in
      - The note being heard, named, in the top right on its own light
        disc — where a glance lands without the eye leaving the line
        being drawn, and readable, which dark text on a dark ground is
        not
      - The pitch as it is heard, drawn near the top and off the JS
        thread, so nothing about the drawing can delay the capture
      - A large button along the bottom that taps the beat in while the
        take is being sung, tapping the fingertip back on every press
      - A record control that becomes a stop control once a capture is
        running, and a pause beside it
      - How long the take has run so far
      - The screen kept awake for as long as the view is open

  - id: VIEW-NOTES-002
    name: Note detail
    route: Notes/:id
    description: >
      One idea, examined. The melody as a piano roll with bar lines and
      its time signature, the descriptive analysis, the editable chord
      backdrop underneath it, playback, and export.
    requires_auth: true
    min_role: singer
    parent_view: VIEW-NOTES-001
    data_sources:
      - notes.list
      - notes.open_chord_track
      - notes.play
      - notes.play_melody
      - notes.play_backdrop
      - notes.set_playback_mix
      - notes.export_midi
    elements:
      - The note's title
      - A toggle in the playback options for which reading is drawn — as
        sung, or as written on the grid — offered as written only once
        the take has a metre to be written against, and changing what the
        graph and the note list show without changing what play sounds
        or what is stored
      - A piano-roll melody view over time and pitch, occupying the upper
        part of the graph
      - A chord lane along the bottom edge of that graph, on the same time
        axis as the melody above it, one band per chord read from the
        take, marked when the chord has been chosen by hand
      - Bar lines and the time signature, presented as an assumption when
        the metre was not measured
      - The descriptive analysis — key, tempo, range, steadiness — with no
        headline score
      - A chord track directly under that lane, one slot per bar, scrolled
        sideways when the progression runs past the screen
      - Controls on each chord slot to nudge it, reshape it, and revert
        it, none of which claim a sideways drag
      - A revert-all control, shown only once something has been edited
      - A playback bar, absent when the note has no stored audio, whose
        play control sounds the chord backdrop under the take as well as
        the take itself, and silences it again on stop
      - That play control drawn as a round button carrying a triangle
        while it will start the take and a pair of upright bars while it
        is playing, with no word on it
      - A control at the far end of that bar which opens the playback
        options, drawn as a sliders glyph and carrying no word, named to
        a screen reader by what it opens
      - One toggle per track in the playback options — the take, the
        chords, the melody read from the take — each turned on and off
        on its own, with the take and the chords on and the melody off
        until they are turned, offering only the tracks the note has and
        nothing at all when there is none to turn
      - A toggle in that same list for which reading is sounded when the
        melody itself is played, made separately from which reading is
        drawn and from what the take's play control sounds
      - A control under the graph which sounds the melody read from the
        take and stops it again on a second press, carrying a triangle
        while a press would start it and a square while a press would
        stop it, saying which it is doing in its own word and naming the
        chosen reading to a screen reader
      - A level in those same options for how loudly that melody sits
        against the take when its track is on, and no separate switch
        for turning it on — that is the melody's track toggle
      - An export control offering the melody as a MIDI file
