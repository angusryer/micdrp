invariants:
  - id: INV-NOTES-001
    description: Every capture is kept
    severity: critical
    check: >
      No path in notes.capture discards a take for being too short, too
      quiet, too out of tune, or too anything. The only outcomes are a
      saved note or a reported failure. Verified by capturing a
      deliberately poor take and asserting a note row exists.

  - id: INV-NOTES-002
    description: A note is described, never graded
    severity: critical
    check: >
      Neither the Note entity nor any Notes view carries a headline
      score. The analysis surfaces key, tempo, range and steadiness as
      description. Verified by asserting no score field on the row and no
      score element in VIEW-NOTES-002.

  - id: INV-NOTES-003
    description: The melody is the source of truth, not the audio
    severity: critical
    check: >
      Every question asked of a note after capture — its shape, its
      chords, its export, its contribution to the corpus — is answered
      from melody_json. No path re-reads the stored audio to compute
      anything. Verified by deleting the audio blob and asserting every
      analysis still resolves.

  - id: INV-NOTES-004
    description: A note without audio is still a note
    severity: major
    check: >
      audioPath is nullable and a null value degrades only playback. The
      note lists, opens, analyses, and exports with audioPath null.

  - id: INV-NOTES-005
    description: A singer reaches only their own notes
    severity: critical
    check: >
      Every read, update and delete against the notes table and the notes
      bucket is constrained to rows where user_id matches the
      authenticated user. Enforced by backend access rules declared in the
      schema,
      not by client code. Verified by attempting a read and a delete
      against another singer's note and asserting both fail.

  - id: INV-NOTES-006
    description: The server is the authority and the cache is a hint
    severity: major
    check: >
      A completed sync replaces the cached list outright rather than
      merging into it. A failed sync leaves the previous cache intact.
      The cache is never written from a source other than a server
      response.

  - id: INV-NOTES-007
    description: Deleting a note leaves nothing behind
    severity: critical
    check: >
      A successful delete removes the row, the audio blob in the notes
      bucket, and the cache entry. Verified by listing the bucket prefix
      after a delete and asserting the object is gone.

  - id: INV-NOTES-008
    description: A hand-chosen chord survives re-inference
    severity: critical
    check: >
      Re-opening or recomputing a chord track preserves the root and
      quality of every slot the singer edited. Only unedited slots are
      recomputed. This is the notes-side obligation matching INV-TRANS-004.

  - id: INV-NOTES-009
    description: The chord backdrop sits below the sung line
    severity: minor
    check: >
      Every voicing the backdrop sounds — a tapped chord or the whole
      progression played under a take — is placed at or above the
      backdrop's floor note, so the harmony supports the melody rather
      than competing with it. Played under a take the backdrop is also
      quieter per tone than an audition, which is heard on its own.

  - id: INV-NOTES-068
    description: The chords are drawn on the melody's own pitch ruler
    severity: minor
    check: >
      The sung line and the chords read from it share one vertical scale,
      so a chord note and a sung note at the same pitch sit at the same
      height, and the cards that edit those chords are the next thing
      below the graph. Verified by asserting both are laid out from one
      pitch axis and one time axis.

      A spoken request asked for the chords as a lane along the bottom
      edge instead. Put to the maintainer, the answer was to keep them on
      the shared ruler: the graph's whole claim is that vertical distance
      is pitch distance, and a second scale on the same screen makes the
      same interval measure two different heights. What prompted the
      request — chords appearing among the low notes of the melody — is a
      consequence of lifting them for the phone speaker (INV-NOTES-039),
      not of the axis they are drawn on.

      Both lanes share the time axis too, so a chord is drawn under the
      notes it was inferred from (INV-NOTES-061).

  - id: INV-NOTES-017
    description: A chord slot never eats a sideways drag
    severity: major
    check: >
      No gesture on a chord slot activates on horizontal movement, so a
      sideways drag always reaches the scrolling track underneath. A slot
      that answered a sideways drag with an edit made the rest of a long
      progression unreachable and changed a chord the singer never meant
      to touch.

  - id: INV-NOTES-010
    description: Analysis never runs on the live audio path
    severity: critical
    check: >
      notes.analyze_capture is invoked only after the engine has stopped,
      and adds no per-frame work while recording. The live pitch stream
      reaches the view through shared values on the UI thread and is not
      routed through analysis.

  - id: INV-NOTES-011
    description: A weak detection is reported as absent, not as a guess
    severity: major
    check: >
      key is null when the key confidence is below the floor and tempoBpm
      is null when the tempo confidence is below the floor. No view
      renders a detected value that the analysis declined to assert.

  - id: INV-NOTES-013
    description: A finished capture leaves the transport ready for the next one
    severity: major
    check: >
      Once a capture has been saved, discarded, or failed, pressing record
      starts a new capture. A terminal state that only a reset can leave, with
      nothing issuing that reset, makes the record control inert for the rest
      of the session and is only recoverable by relaunching the app.

  - id: INV-NOTES-139
    description: A take is kept on the device before it is sent anywhere
    severity: critical
    check: >
      Stopping a capture writes the note into the local store and shows it in
      the list before any request is made. The upload runs afterwards, in the
      background, and is retried; a note waiting to go is marked as such and
      is playable from its local audio meanwhile. A sync from the server
      replaces what the server knows about and never removes a note the server
      has not been told about yet. Verified by asserting a capture with the
      network refused still appears in the list and still plays, that a
      later sync does not delete it, and that a successful upload leaves one
      note rather than two.

      A take used to exist only if the round trip succeeded. The audio was
      written to the device, the create was posted, and a failure left the
      recording somewhere the app would never show again — so singing
      something with no signal lost it. For an app whose whole job is catching
      an idea before it evaporates, that is the wrong way round: the network
      is the least reliable part of the phone and it was load-bearing.

      Local first, therefore, and the server second. What was sung is a fact
      the moment it was sung; where it is stored is a detail that can be
      retried.

      Which also settles a confusion the list could not resolve. An empty list
      meant either "nothing kept" or "could not ask", and it said the first
      while meaning the second. With the local store as what the list reads,
      an empty list means empty, and a sync that failed is a separate thing
      that can be said separately.

  - id: INV-NOTES-140
    description: An expired session is signed out, not silently signed in
    severity: critical
    check: >
      A session restored from storage is only a session while its token is
      still valid. On launch the app refreshes a restored token; where the
      refresh fails for any reason the session is cleared and the singer is
      asked to sign in. A request refused for want of a session is reported as
      that and never as a failure to reach the server. Verified by asserting
      an expired token leaves no session, that a refresh which succeeds keeps
      one, and that an unauthorized read says so rather than blaming the
      network.

      The session was read back as "a token and a record exist", which is not
      the same question as "is this token still good". So an expired token
      left the app looking signed in while every request failed the check that
      does test validity — and the failure surfaced as "couldn't reach the
      server", about a server that was up and answering.

      That combination is the worst kind of wrong: it points away from the
      cause. The singer sees their notes gone, the app says the network is at
      fault, and the one action that would fix it — signing in again — is the
      one the app has just told them is unnecessary.

      Refreshed rather than merely checked, because a token that is still good
      should not cost anybody a sign-in, and a token near its end should be
      renewed while the app has a working one to renew with.

  - id: INV-NOTES-170
    description: What was performed is kept; what was derived is re-derivable
    severity: critical
    check: >
      Everything a person did is stored and never overwritten by a reading of
      it: the audio of every take and every layer, the beats they tapped,
      which of those they called bar starts, the notes they corrected, the
      bars they arranged, the tempo they typed. Everything the app worked out
      — the analysed frames, the segmented notes, the key, the tempo estimate,
      the metre, the chords — is a reading, carries the version of the
      algorithm that produced it, and can be thrown away and produced again
      from what was performed. Verified by asserting that discarding every
      derived field and re-deriving reproduces the same note, and that no
      derived field is ever the only record of something a person did.

      The line is between what cannot be recovered and what can. A take sung
      once cannot be sung again the same way, and neither can a beat tapped
      by the person who sang it. A key, a metre, a chord are opinions about
      those things, and an opinion that cannot be revised is a worse opinion
      than one that can.

      Which means the audio is the raw data, not the frames read out of it.
      Storing the frames would preserve one algorithm's reading of the sound
      at the moment it was made — the very thing a better algorithm is meant
      to replace. Re-reading the audio is what improves; re-reading a stored
      reading is not. The frames are a cache, and a cache is allowed to be
      thrown away.

      And it means every reading records which version made it, so a take
      read by an older engine can be found and read again (INV-NOTES-116).

  - id: INV-NOTES-171
    description: Harmony is asked for, not assumed
    severity: major
    check: >
      A freshly captured note shows what was sung and what was struck, and no
      chords. Chords are produced when somebody asks for them, and what they
      are built on is stated: the metre and tempo in force at the time. Once
      asked for they stay, and they can be asked for again after the take has
      been given more to go on — beats tapped, bars marked, a bass line sung
      and corrected — producing a new reading rather than editing the old one.
      Verified by asserting a new note carries no chord track, that asking
      produces one, and that asking again after a bass line is added produces
      a different one without destroying the first.

      The chords appeared on their own, built on a tempo nobody had confirmed
      and a metre nobody had stated. That is the app asserting the harmony of
      somebody's idea before they have said what the beat was — and the more
      confident the drawing, the harder it is to see it as a guess.

      Asked for, the same reading means something else entirely: it is an
      answer to a question, at a moment when the person asking knows what they
      have given it to work with.

      Which is the shape of the whole pipeline. A person sings; the app writes
      down what it heard. The person taps the beat; the app can now say where
      the bars are. The person says which beats begin bars; the app can now
      say the metre and the tempo, and therefore which notes fall inside which
      bar, and therefore what the harmony might be. The person sings a bass
      line and corrects it; the app can say it again, better. Each step is a
      human statement, and each derivation waits for one.

  - id: INV-NOTES-172
    description: Every threshold the reading depends on is adjustable, beside the take
    severity: major
    check: >
      Every number the melody reading turns on — the smoothing, the
      segmentation, what counts as a bend, what counts as a struck sound — is
      an adjustable with a name, a range, and a sentence saying what moving it
      does. They sit on the note being listened to, next to the control that
      reads it again, so one screen closes the loop between changing a number
      and hearing the result. A reading made under one set is replaced by a
      reading made under another; nothing a person did is touched. Verified by
      asserting every option the reading accepts appears as an adjustable, and
      that re-reading uses the current values.

      Tuning a detector is a loop: change a number, listen, change it again.
      The numbers lived on the account screen and the take lived three
      navigations away, so each turn of the loop cost more than the judgement
      it was serving — and a loop that expensive does not get run enough times
      to converge.

      Every number, because the one that matters is never the one you
      expected. Half the surface exposed is a search with half the dimensions
      missing, and the missing one is where the fault turns out to live.

      It changes a reading and never a performance. What was sung stays what
      was sung, and a reading is allowed to be wrong because it can be made
      again (INV-NOTES-170).

  - id: INV-NOTES-195
    description: Reading a take again replaces everything read from it
    severity: critical
    check: >
      A re-read writes the melody, the hits, the note count, the range,
      the key, the tempo and the tuning measures — every field derived
      from the recording, from the same pass. Verified by re-reading a
      take whose range has changed and asserting the stored range moved
      with the melody.

      Only the melody, the hits, the count and the version were written.
      The range and the tuning measures stayed as the first reading left
      them, so a take re-read with a raised pitch ceiling held notes up
      to MIDI 93 while still reporting a range topping out at 86, and a
      mean error of 35 cents measured against a reading that no longer
      existed.

      A stale summary is worse than an absent one: it is read as a
      measurement of the take rather than as a leftover, and it was
      nearly used as evidence about the singer.

