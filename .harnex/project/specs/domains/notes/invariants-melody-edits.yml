# Correcting what the detector heard. Split for the 150-line spec-file budget.
invariants:
  - id: INV-NOTES-053
    description: A note read wrongly can be put right
    severity: critical
    check: >
      A note of the melody can be chosen on the graph and moved to the
      pitch that was actually sung. What it becomes is what everything
      downstream reads: the chords implied, the downbeats proposed, the
      export. Verified by asserting a corrected note changes the melody
      handed to harmony, and that correcting one leaves every other note
      where it was.

      Detection is a starting position, not an answer. The whole point
      of the graph is that what you see is what you are editing, and a
      note the detector heard a semitone out has until now been a thing
      you could see was wrong and could not touch — while the harmony
      read from it inherited the mistake.

  - id: INV-NOTES-054
    description: A correction is kept as a difference, not as a new melody
    severity: critical
    check: >
      What is stored is the correction alone, anchored to a moment, and
      replayed over whatever the detector now says. A correction whose
      moment lands in no note is dropped rather than applied to whatever
      has since moved there. Verified by round-tripping corrections
      through storage, and by replaying one whose note has gone.

      The melody as sung is the one thing that never changes, and
      overwriting it would destroy the record of what was actually
      heard — after which no later improvement in detection could ever
      be applied, because there would be nothing left to re-read. Every
      other claim on this screen is kept this way (INV-NOTES-022), and a
      correction is a claim like any other.

  - id: INV-NOTES-095
    description: A note lengthened into its neighbour joins with it
    severity: critical
    check: >
      Changing a note's length leaves every other note where it is. Where
      the change makes one note reach into the next, the two become one,
      keeping the covering note's pitch and running to whichever ended
      later. No two notes ever sound at once. A note cannot be shortened
      past being a note. Verified by asserting untouched notes do not move,
      that no note starts before the previous one ends however far a length
      is dragged, and that a long enough drag swallows every note it
      reaches.

      Pushing the rest of the phrase along was tried first and is worse to
      use: every small change to one note rearranged everything after it,
      so a length already settled kept sliding away while the note before
      it was being worked on.

      Joining is what a singer means by the gesture. Lengthening a note
      over its neighbour says the two were one held note the detector
      split, which is among the commonest things to want to correct.

      The pipeline assumes notes do not overlap: a moment belongs to one
      note, which is what lets an edit be anchored to a moment inside it
      and what lets the harmony read a span. Allowing two at once would
      reach into segmentation, the chord reading and playback together,
      for something a single voice cannot perform anyway.

  - id: INV-NOTES-096
    description: A timing edit is anchored where the detector heard it
    severity: critical
    check: >
      An edit that changes when a note happens is anchored to the moment
      the detector originally placed it, not to where the edit puts it.
      Verified by asserting an edit collected after a note is moved still
      finds that note on replay, and that editing the same note twice
      leaves one edit rather than two.

      The stored reading is what edits replay over, so anchoring to it is
      anchoring to something that does not move. Anchoring to the edited
      time would make the anchor and the value the same quantity: move a
      note and its own edit could no longer find it.

  - id: INV-NOTES-097
    description: Length is dragged in notches, and the handle comes home
    severity: minor
    check: >
      The length control changes the chosen notes by one beat per notch of
      travel, each notch committing once as it is crossed, and its handle
      returns to where it started when the finger lifts. It says so when
      the take has no steady beat, rather than offering a control that
      cannot act. Verified by asserting one beat per notch, no repeat
      while a notch is held, and a reset on release.

      Notched rather than accelerating: acceleration makes the same
      gesture mean different amounts depending how fast a hand moved,
      which cannot be aimed when the intent is exactly two beats. The
      spring-back already answers the range problem acceleration was there
      to solve — a short drag repeated is unbounded.

  - id: INV-NOTES-098
    description: A length can be put back on its own
    severity: major
    check: >
      A note that differs from what was heard — in pitch or in length —
      offers to be put back, and doing so undoes both. Separately, every
      length can be put back at once while every pitch correction stays.
      That is offered only where some length has been changed. Verified by
      asserting a note whose length alone changed offers the undo, and
      that putting lengths back leaves pitch edits standing.

      Correcting a wrong note and shaping how long it lasts are different
      pieces of work. Throwing away both because one was wanted back would
      cost more than it saved — most often the pitches were right and the
      lengths were the experiment.
