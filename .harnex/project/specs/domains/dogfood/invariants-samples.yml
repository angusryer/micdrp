# What must hold of a shared take. Each of these is damage that sharing
# audio could do and must not.
invariants:
  - id: INV-DOG-031
    description: A shared take carries the reading it exists to check
    severity: critical
    check: >
      Every sample holds the melody as read, the analysis version, and
      every measured value, in the same record as the audio. Verified by
      sharing a take and asserting the reading is present and equal to
      what the note held at that moment.

      Audio on its own proves nothing. The question a sample answers is
      "did the app hear this correctly", and that question has two
      halves; a corpus of recordings with no readings beside them is a
      pile of sound that someone has to listen to by hand, which is the
      work this was built to avoid.

      Where the person corrected notes by hand, those travel too. A
      correction is the only statement of what the take should have been
      that exists anywhere, and it costs nothing to carry.

  - id: INV-DOG-032
    description: A sample is a copy, and stops changing once it is made
    severity: critical
    check: >
      The sample holds its own audio file and its own frozen reading.
      Verified by sharing a take, re-reading it, and asserting the
      sample's reading is unchanged; and by deleting the note and
      asserting the sample and its audio survive.

      A note is local first and takes a new id when it reaches the
      server, is re-read every time a detector is tuned, and can be
      deleted. A fixture that followed it would repair itself the moment
      the mistake it recorded was papered over, and the evidence of a
      bad reading would be gone exactly when it was needed.

  - id: INV-DOG-033
    description: A share is not lost by a bad connection
    severity: critical
    check: >
      A share whose upload fails stays queued, survives a relaunch, and
      is retried. Verified by failing an upload, restarting, and
      asserting the share is still pending. Same discipline as a spoken
      clip (INV-DOG-004): the tap is the last thing the maintainer
      should have to do about it, and a share that silently failed is a
      recording the agent will never know it was promised.

  - id: INV-DOG-034
    description: A take is shared once, and says which it is
    severity: high
    check: >
      Sharing a take that is already shared or already queued does
      nothing, and the control shows shared rather than offering to
      share again. Verified by tapping twice and asserting one sample
      exists. A take is minutes of audio; a second copy costs the same
      as the first and answers nothing the first did not.

  - id: INV-DOG-035
    description: Sharing is revocable, and revoking takes the audio with it
    severity: critical
    check: >
      Withdrawing deletes the sample record and its audio from the
      server, and drops a share still waiting in the queue before it is
      sent. Verified by sharing, withdrawing, and asserting the record
      is gone and a fresh pull finds nothing. This is a recording of a
      person singing; the control that shared it has to be able to take
      it back without anyone being asked.

  - id: INV-DOG-036
    description: A shared take is never an instruction
    severity: critical
    check: >
      No sample is ever claimed, transcribed, interpreted, or built
      from. Verified by asserting the loop's claim reads dogfood_clips
      alone and that no sample state is reachable from a loop run.

      A clip is speech and carries a request. A sample is whistling and
      carries none — but it is audio arriving from the same person
      through the same door, and an unattended machine that transcribed
      one would find words in it and act on them. The two are kept
      apart in different collections for that reason and not for
      tidiness.

  - id: INV-DOG-037
    description: Sharing never competes with singing
    severity: high
    check: >
      The share queue does not upload while a capture or practice
      session is running; a share tapped during one is sent when it
      ends. Verified by asserting no upload starts while the microphone
      is held.

      A take is a whole audio file going up a phone's uplink. Nothing
      here is worth a dropped frame in a recording, and the take being
      shared is worth less than the take being sung.

  - id: INV-DOG-038
    description: The corpus stays out of the repository
    severity: critical
    check: >
      The directory samples are pulled into is ignored by git, and no
      pulled audio is ever committed. Verified by asserting the pull
      target is matched by .gitignore.

      These are recordings of a person's voice, pulled onto a machine to
      be worked with and not to be published. A fixture that earns a
      permanent place in the test suite is promoted by hand, as a
      deliberate act, with the person who sang it saying so.
