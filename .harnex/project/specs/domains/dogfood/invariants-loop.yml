# What must hold of the agent loop while it runs.
invariants:
  - id: INV-DOG-008
    description: Nothing ships that the harness has not passed
    severity: critical
    check: >
      Preflight passes on each change and again on the assembled batch
      before anything is committed or published. Verified by making a
      change that fails preflight and asserting it is abandoned rather
      than delivered. The batch is checked as a whole because two changes
      that each pass alone can fail together.

  - id: INV-DOG-009
    description: A failed attempt leaves nothing behind
    severity: critical
    check: >
      An abandoned request leaves the working tree as it was found, with
      no partial edit and no stray branch, and costs only itself: work
      already built in the same run survives. Verified by building one
      request, abandoning the next, and asserting the first is intact.

      Each built request is checkpointed for this reason. Without one,
      restoring after a failure discarded everything the run had built,
      and the check for a clean tree — correct for the first request —
      refused every request after a success.

  - id: INV-DOG-010
    description: A loop that is failing stops itself
    severity: critical
    check: >
      Consecutive failed runs, or a delivered bundle that rolled back,
      halt the loop until a human restarts it. Verified by failing runs
      to the threshold and asserting no further clip is claimed. An
      automated process that keeps going after repeated failure does more
      damage than one that stops and says so.

  - id: INV-DOG-011
    description: A bundle is never offered to a binary that predates it
    severity: critical
    check: >
      A bundle the loop publishes carries the running build as its
      minimum, never lower. Verified by delivering and asserting the
      published minimum equals the build the changes were made against.
      This is INV-UPD-002 restated at the point where a machine, rather
      than a person, chooses the number.

  - id: INV-DOG-012
    description: A clip is worked on by one run at a time
    severity: high
    check: >
      A claimed clip is never returned to a second run, and a claim left
      by a run that died becomes reclaimable after the stale threshold.
      Verified by claiming twice concurrently and asserting the second
      claim returns nothing.

  - id: INV-DOG-013
    description: Audio is transcribed once
    severity: high
    check: >
      A clip already carrying a transcript is not sent for transcription
      again, including across runs and restarts. Verified by running the
      loop twice over the same clip and asserting one transcription call.

  - id: INV-DOG-016
    description: A clip is never stranded partway through the loop
    severity: critical
    check: >
      A clip left in any state short of a conclusion becomes reclaimable
      once its claim goes stale, whatever state it stopped in. Verified
      by leaving a clip in each intermediate state with an old claim and
      asserting the next run picks every one of them up.

      The first version reclaimed only clips still in state claimed. A
      run that died after transcribing left its clip in interpreted,
      which nothing looked for again — the work was done, paid for, and
      then invisible. Whether a clip is abandoned is a question about
      its claim, not about how far it happened to get.

      Resuming also means not repeating: a request already delivered is
      skipped, because its change is in main and building it again is at
      best a no-op and at worst a second, conflicting edit.


  - id: INV-DOG-020
    description: A run holds its lock for as long as it actually runs
    severity: critical
    check: >
      A second run never begins while the first is alive, however long
      the first takes, and a lock left by a dead run is always taken.
      Verified by holding the lock from a live process and asserting a
      second run declines, then killing it and asserting the next run
      proceeds.

      The first version called a lock stale after thirty minutes. A clip
      carrying four requests takes about half an hour, so a healthy run
      began outliving its own lock and the next tick was free to start a
      second one on the same checkout. Any elapsed-time threshold is a
      guess at how long work may legitimately take; asking whether the
      holder is still alive needs no guess.

  - id: INV-DOG-021
    description: A scheduled run resolves the same tools as a manual one
    severity: critical
    check: >
      Every interpreter and binary the harness invokes resolves under the
      schedule's environment, to the same one the maintainer's shell
      finds. Verified by running the harness with only the scheduled
      environment set and asserting it passes.

      This was the third reason nothing ever shipped, and the hardest to
      see: the harness passed when run by hand and failed under the
      schedule. A launchd job inherits almost no environment, so python3
      resolved to a different interpreter without the YAML module, spec
      validation tried to install it, and the fallback was not on the
      path either. Every change was discarded for a reason that never
      appeared when anyone looked.

  - id: INV-DOG-023
    description: Work that reached main is never built a second time
    severity: critical
    check: >
      A batch whose commit reached main is recorded as delivered even
      when a later step fails, and a resumed clip never rebuilds it.
      Verified by failing the publish after a successful push and
      asserting the next run publishes rather than rebuilds.

      Delivery is two outward steps and only one of them can be undone.
      Pushing to main is public the moment it happens; publishing a
      bundle is a retry away. Treating the pair as one act meant a
      failed publish left three pushed changes recorded as unbuilt, and
      the next run set about making them again — against a tree that
      already had them.

  - id: INV-DOG-024
    description: Reporting progress never costs the work it reports on
    severity: high
    check: >
      A failure to write progress is swallowed, and the run carries on.
      Verified by making every progress write fail and asserting the clip
      is still built and delivered.

      Progress is a convenience. A loop that abandoned real work because
      it could not describe itself would be worse than one that says
      nothing at all.

  - id: INV-DOG-025
    description: A backend that is briefly away costs the loop nothing
    severity: high
    check: >
      A failure that says the backend was unreachable does not count
      toward the halt, and the work is retried rather than abandoned.
      Verified by failing every backend call with an unreachable error
      and asserting the failure count is unchanged.

      The halt exists to stop a loop failing at its job. A backend
      restarting is not that: nothing was attempted and nothing was
      damaged. Counting it spent two of three lives during one routine
      deploy, which is a thing that happens on an ordinary afternoon.

  - id: INV-DOG-026
    description: A clip removed underneath a run stops it, and costs nothing
    severity: high
    check: >
      A run whose clip is deleted while it works stops without counting a
      failure. Verified by removing a claimed clip mid-run and asserting
      the loop neither halts nor records a failure.

      Removing a remark is a decision, not a fault. Treating the
      disappearance as an error would spend the loop's lives on the
      maintainer tidying their own list.
