# What gets recorded and uploaded. The agent-side shapes are in
# entities-loop.yml.
entities:
  - name: DogfoodClip
    description: >
      One spoken remark about the app, with the trail of screens it was
      spoken over. The trail matters more than it looks: "this button is
      in the wrong place" is unactionable without knowing which screen
      was on show when it was said.
    properties:
      - name: id
        type: string
        required: true
      - name: audioPath
        type: string
        required: false
        description: >
          The clip's durable server-side filename. Deliberately not a
          URL: a file token expires in about two minutes, so a URL stored
          here would be dead before anything read it (INV-NOTES-014
          learned this the hard way).
      - name: durationMs
        type: number
        required: true
        constraints: ["is greater than 0", "is at most the recording cap"]
      - name: screenTrail
        type: array
        required: true
        description: >
          Every screen shown while recording, in order, each with the
          offset it appeared at. A clip recorded without moving has one
          entry.
      - name: appVersion
        type: string
        required: true
        description: >
          The VERSION_NUMBER of the binary that recorded it, so a remark
          about behaviour that has since changed can be recognised.
      - name: buildNumber
        type: number
        required: true
      - name: bundleId
        type: string
        required: false
        description: >
          The over-the-air bundle running when the clip was recorded, or
          null for the binary's own. Without this a remark cannot be tied
          to the JavaScript that produced the behaviour.
      - name: recordedAtMs
        type: number
        required: true
      - name: state
        type: string
        required: true
    states:
      - name: recording
        description: Being spoken now. Exists only on the device.
      - name: paused
        description: Held, retaining what has been said so far.
      - name: pending_upload
        description: Finished and on disk, not yet accepted by the server.
      - name: uploaded
        description: Accepted by the server; the device is done with it.
      - name: claimed
        description: An agent loop run has taken it and is working on it.
      - name: interpreted
        description: Transcribed and split into tasks.
      - name: delivered
        description: Every task it produced reached a conclusion.
      - name: cancelled
        description: >
          Withdrawn by the maintainer while a run held it. An
          instruction to the run that holds it, not a description of
          something that happened to it.
    transitions:
      - from: recording
        to: paused
        trigger: dogfood.pause_clip
      - from: paused
        to: recording
        trigger: dogfood.resume_clip
      - from: recording
        to: pending_upload
        trigger: dogfood.stop_clip, or the cap elapsing
      - from: paused
        to: pending_upload
        trigger: dogfood.stop_clip, or the cap elapsing
      - from: pending_upload
        to: uploaded
        trigger: the server accepts the clip
      - from: uploaded
        to: claimed
        trigger: dogfood.claim_clip
      - from: claimed, or interpreted
        to: cancelled
        trigger: >
          dogfood.discard_clip, when a run holds the clip. A clip nobody
          holds is removed outright instead: there is no one to tell.
      - from: claimed
        to: interpreted
        trigger: dogfood.interpret_clip
      - from: interpreted
        to: delivered
        trigger: dogfood.deliver_batch
      - from: claimed, or interpreted
        to: claimed
        trigger: >
          dogfood.claim_clip, once the claim on it has gone stale. A run
          that stops partway leaves the clip wherever it got to; the next
          run takes it from there rather than leaving it there.

  - name: ScreenVisit
    description: One screen, and when during the clip it was on show.
    properties:
      - name: route
        type: string
        required: true
        description: The navigator route name, not a human title.
      - name: atMs
        type: number
        required: true
        description: Offset from the start of the clip, excluding pauses.

  - name: RecordingSession
    description: >
      The live recording, as the control renders it. Held on the device
      and never uploaded; only the clip it produces is.
    properties:
      - name: elapsedMs
        type: number
        required: true
        description: Time recorded, excluding anything spent paused.
      - name: remainingMs
        type: number
        required: true
        description: The cap minus elapsedMs.
      - name: isCountingDown
        type: boolean
        required: true
        description: >
          True once remainingMs is at or under the warning threshold. The
          control shows the countdown only then — a timer running the
          whole time invites watching the clock instead of talking.
      - name: canRecord
        type: boolean
        required: true
        description: >
          False while a capture or practice session holds the microphone.
          The device serves one at a time, and a take outranks a remark.

  - name: ClipProgress
    description: >
      How far the loop has got with a clip, reported as it goes.

      The loop runs on a machine the maintainer is not looking at, often
      while they are elsewhere. Without this, a clip that has been
      claimed is indistinguishable from one that is stuck, and the only
      way to tell is to go and read a log.
    properties:
      - name: percent
        type: number
        required: true
        description: How far through, 0 to 100.
        constraints: ["is within 0 and 100 inclusive"]
      - name: note
        type: string
        required: true
        description: >
          One short phrase saying what is happening now, for example
          "building 2 of 4". Written to be read at a glance on a phone,
          not to be complete.
      - name: atMs
        type: number
        required: true
        description: >
          When this was reported. A percentage that has not moved for a
          long time is the signal that something is wrong, and only the
          time it was written can say so.
