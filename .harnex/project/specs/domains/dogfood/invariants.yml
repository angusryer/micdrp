# What must hold of the recorder on the device.
invariants:
  - id: INV-DOG-001
    description: Recording a remark never interrupts singing
    severity: critical
    check: >
      The record control is unavailable while a capture or a practice
      session is running, and starting one while a clip is recording
      stops the clip rather than the take. Verified by asserting
      canRecord is false throughout both activities. The microphone
      serves one purpose at a time and a take cannot be sung again
      identically; a remark can be repeated word for word.

  - id: INV-DOG-002
    description: A remark is never separated from what it was about
    severity: critical
    check: >
      Every clip carries the screens shown while it was being recorded,
      in order, with offsets; and the version, build and bundle it was
      recorded on. Verified by recording across a navigation and
      asserting both screens appear in the trail. "Move this button" is
      not actionable without knowing which screen was on show, and a
      remark about behaviour that has since shipped differently must be
      recognisable as stale.

  - id: INV-DOG-003
    description: Stopping sends, and the cap stops
    severity: critical
    check: >
      dogfood.stop_clip and the cap elapsing produce the same outcome: a
      clip in state pending_upload, uploading. Verified by driving both
      and comparing the resulting state. A recording that has to be sent
      as a second deliberate act is a recording that gets forgotten.

  - id: INV-DOG-004
    description: A spoken remark is not lost by a bad connection
    severity: critical
    check: >
      A clip whose upload fails stays in pending_upload, survives a
      relaunch, and is retried. Verified by failing an upload, restarting,
      and asserting the clip is still queued. Nothing is deleted locally
      until the server has accepted it.

  - id: INV-DOG-014
    description: The control is somewhere it can actually be pressed
    severity: critical
    check: >
      The record control renders inside the safe area, within a header
      the navigator lays out, and never as an overlay positioned from the
      top of the window. Verified by asserting it is rendered by the
      navigator's headerRight rather than by the app root.

      The first version placed it absolutely at the top of the window so
      that a recording would survive navigating away. It did survive —
      and landed under the status bar, where it could not be tapped, so
      no recording could be started in the first place. Every screen in
      this app already renders inside a SafeAreaView; the control was the
      one thing that did not, because it deliberately sat outside them
      all.

      A recording survives navigation because the session is module
      state, not because the control avoids unmounting. Those are
      separate concerns and conflating them is what caused this.

      It also owns a real touch target of at least 44 points rather than
      a small mark with hitSlop. hitSlop reserves no layout space, so two
      neighbours can claim the same points and the later one wins: the
      account control's padding and hitSlop reached 28 points to its
      left, exactly where this sits, and every tap opened settings
      instead of starting a recording.

