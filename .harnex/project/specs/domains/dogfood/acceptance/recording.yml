# The control, the session, and the rule that singing wins.
acceptance:
  - id: ACC-DOG-001
    interface: ui
    title: A remark can be spoken across screens without stopping
    given:
      - the maintainer is on the Notes screen
    when:
      - the maintainer taps record
      - the maintainer navigates to Practice
    then:
      - the clip is in state recording
      - the trail is Notes,Practice
    maps_to:
      capability: dogfood.start_clip
      invariants: [INV-DOG-002]

  - id: ACC-DOG-002
    interface: ui
    title: A take keeps the microphone
    given:
      - a capture is in progress
    when:
      - the maintainer taps record
    then:
      - the record control is unavailable
      - the clip is in state idle
    maps_to:
      capability: dogfood.start_clip
      invariants: [INV-DOG-001]

  - id: ACC-DOG-003
    interface: ui
    title: A practice session keeps it too
    given:
      - a practice session is in progress
    when:
      - the maintainer taps record
    then:
      - the record control is unavailable
    maps_to:
      capability: dogfood.start_clip
      invariants: [INV-DOG-001]

  - id: ACC-DOG-004
    interface: ui
    title: The control returns the moment the take ends
    given:
      - a capture is in progress
    when:
      - the capture ends
    then:
      - the record control is available
    maps_to:
      capability: dogfood.start_clip
      invariants: [INV-DOG-001]

  - id: ACC-DOG-005
    interface: ui
    title: The one control both starts and stops
    given:
      - a clip is recording
    when:
      - the maintainer taps record
    then:
      - the clip is in state pending_upload
    maps_to:
      capability: dogfood.stop_clip
      invariants: [INV-DOG-003]

  - id: ACC-DOG-007
    interface: ui
    title: The countdown runs the whole clip and warns only near the end
    given:
      - a clip is recording
      - the clip has been recording for 30 seconds
    when:
      - the maintainer navigates to Practice
    then:
      - the remaining time is 90 seconds
      - the countdown urgency is none
    maps_to:
      capability: dogfood.start_clip

  - id: ACC-DOG-032
    interface: ui
    title: The countdown cautions before it warns
    given:
      - a clip is recording
    when:
      - the clip runs on to 15 seconds left
    then:
      - the countdown urgency is caution
    maps_to:
      capability: dogfood.expire_clip

  - id: ACC-DOG-033
    interface: ui
    title: The countdown warns for the last stretch
    given:
      - a clip is recording
    when:
      - the clip runs on to 5 seconds left
    then:
      - the countdown urgency is warning
    maps_to:
      capability: dogfood.expire_clip

  - id: ACC-DOG-008
    interface: ui
    title: Stopping sends without a second action
    given:
      - a clip is recording
    when:
      - the maintainer taps stop
    then:
      - the clip is in state pending_upload
    maps_to:
      capability: dogfood.stop_clip
      invariants: [INV-DOG-003]

  - id: ACC-DOG-009
    interface: ui
    title: Running out of time sends what was said
    given:
      - a clip is recording
    when:
      - the cap elapses
    then:
      - the clip is in state pending_upload
    maps_to:
      capability: dogfood.expire_clip
      invariants: [INV-DOG-003]

  - id: ACC-DOG-034
    interface: ui
    title: Running out of time says so, and says another can be recorded
    given:
      - a clip is recording
    when:
      - the cap elapses
    then:
      - an alert says another feature request can be submitted
    maps_to:
      capability: dogfood.expire_clip

  - id: ACC-DOG-035
    interface: ui
    title: Stopping deliberately raises no alert
    given:
      - a clip is recording
    when:
      - the maintainer taps stop
    then:
      - no alert is shown
    maps_to:
      capability: dogfood.stop_clip

  - id: ACC-DOG-029
    interface: ui
    title: A recording outlives the control that started it
    given:
      - the maintainer is on the Notes screen
    when:
      - the maintainer taps record
      - the maintainer navigates to Practice
    then:
      - the clip is in state recording
      - the trail is Notes,Practice
    maps_to:
      capability: dogfood.start_clip
      invariants: [INV-DOG-014]
