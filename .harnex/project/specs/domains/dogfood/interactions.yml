interactions:
  - id: INT-DOG-001
    name: Talk through the app
    view: VIEW-DOG-001
    precondition: >
      The maintainer is signed in, the microphone permission is granted,
      and no capture or practice session is running.
    steps:
      - Tap the round record control, which becomes a square
      - Describe what is on screen and what should be different
      - Navigate to another screen and keep talking
      - Tap the square
    outcome: >
      The clip is sent with the trail of screens it was spoken over. The
      agent loop picks it up without anything else being done.
    error_handling: >
      A failed upload keeps the clip queued and retries; nothing is lost
      by closing the app. A denied microphone permission surfaces the
      prompt to grant it and leaves no clip behind.
    maps_to:
      capability: dogfood.stop_clip

  - id: INT-DOG-003
    name: Run out of time
    view: VIEW-DOG-001
    precondition: A clip has been recording for close to the cap.
    steps:
      - Notice the countdown turn to the caution colour, then the
        warning colour
      - Finish the sentence
    outcome: >
      At zero the clip sends itself, exactly as stopping would. Nothing
      spoken is discarded. An alert says the recording went and that
      anything left unsaid can be recorded as another remark, because
      the clip ending was not something the maintainer asked for and
      the header is not where they were looking.
    error_handling: >
      Tapping the square in the last stretch does the same thing sooner,
      and raises no alert: that ending was deliberate.
    maps_to:
      capability: dogfood.expire_clip

  - id: INT-DOG-004
    name: Try to talk mid-take
    view: VIEW-DOG-001
    precondition: A capture or practice session is running.
    steps:
      - Look at the record control
    outcome: >
      It is visibly unavailable. The take keeps the microphone, and the
      remark can be made the moment it ends.
    error_handling: >
      The control becomes available again as soon as the take finishes,
      without needing to change screens.
    maps_to:
      capability: dogfood.start_clip

  - id: INT-DOG-005
    name: Hand over a recording
    view: VIEW-DOG-003
    precondition: >
      The maintainer is looking at a take whose reading is wrong, and is
      signed in.
    steps:
      - Open the take's details
      - Tap share, in the top right
      - Read what the confirmation says will be sent, and confirm
    outcome: >
      The recording and the reading it produced go up together as one
      sample. The row says it is shared. Nothing else happens: no
      transcription, no request, no build — the agent has a recording to
      test against, which is the whole of it.
    error_handling: >
      A failed upload keeps the share queued and retries; the row says
      it is waiting rather than saying it is done. A take with no
      recording on the device or the server cannot be shared, and the
      row says why.
    maps_to:
      capability: dogfood.share_take

  - id: INT-DOG-006
    name: Take it back
    view: VIEW-DOG-003
    precondition: A take is shared.
    steps:
      - Open the take's details
      - Tap the control, which now says the take is shared
      - Confirm stopping
    outcome: >
      The sample and the copy of the audio are deleted from the server.
      The take, its audio and its reading are untouched, and the row
      offers to share again.
    error_handling: >
      A share still queued on the device is dropped before it is sent,
      so withdrawing something that never left works the same way as
      withdrawing something that did.
    maps_to:
      capability: dogfood.withdraw_take
