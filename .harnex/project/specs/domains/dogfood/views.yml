views:
  - id: VIEW-DOG-001
    name: Feedback control
    route: header/DogfoodControl
    description: >
      A record control in the header, immediately left of the account
      control, on every screen that has a header — which is every screen
      where feedback can be given. The headerless ones are the login
      screen, the splash, and a running practice session, where the
      control would be unavailable anyway because the take holds the
      microphone.

      It was first built as an overlay above the navigator, on the
      reasoning that a recording must survive navigating away. That
      reasoning was right; the placement was wrong. Sitting outside every
      screen's tree also put it outside every screen's safe area, so on a
      device it rendered beneath the status bar and could not be tapped
      at all. The recording survives navigation because the session is
      held outside the component, not because the component is.

      Idle, it is a single unobtrusive round control. Recording, that
      same control becomes a square and the time left appears beside it;
      tapping the square ends the clip and sends it. One control with
      two shapes, and no third state: pausing a remark means holding a
      thought the app cannot use, and a hold that has to be released is
      one more thing to get wrong mid-sentence.

      The time beside it counts down from the cap to zero for the whole
      clip, never up. What a speaker needs to know is how much of the
      two minutes is left, and a count that only ever appeared near the
      end left the rest of the clip with no sense of how far along it
      was. The last stretch is still marked, but by the countdown
      changing colour rather than by a number appearing: the caution
      colour first, then the warning colour nearer zero. Two steps, so
      that the first arrives while there is still time to bring a
      sentence to a close and the second says finish now.

      When the cap ends the clip rather than a tap, an alert says so.
      Colour is enough warning while someone is watching the header, but
      the whole point of the control is that a remark is spoken while
      looking at the screen it is about — so the moment the clip leaves
      is otherwise silent, and a sentence cut off mid-word reads as the
      app having dropped it. The alert says the recording went, and that
      whatever was left unsaid can be said in another one. Tapping stop
      raises nothing: that outcome was asked for.

      While a capture or practice session holds the microphone it is
      visibly unavailable rather than hidden. Hiding it would read as a
      bug; showing it disabled says the app is busy with something else.
    requires_auth: true
    min_role: maintainer
    data_sources:
      - dogfood.start_clip
      - dogfood.stop_clip
    elements:
      - A record control, present on every screen, with a touch target of
        at least 44 points that no neighbour overlaps
      - A round mark while idle, and a square one while recording
      - A countdown while recording, from the cap to zero
      - The countdown in the caution colour once the cap is close, and
        in the warning colour for the last stretch before zero
      - Tapping the square ends and sends in one action
      - An alert when the cap ends the clip, saying that another remark
        can be recorded if this one ran out before it was finished
      - A disabled appearance while idle and the microphone is otherwise
        in use; a clip already recording stays stoppable, because with
        one control a disabled one would strand what was said
      - A brief confirmation that a clip was sent
    absent_elements:
      - Any placement outside the safe area, where it cannot be tapped
      - Any separate send action, because stopping is the instruction to send
      - Any pause or resume control
      - Any alert when the square is tapped, because ending it then was
        the instruction
      - Any second control beside the record one, because the one control
        both starts and stops
      - Any transcript or playback, because the clip is not for reading back
      - Any list of past clips, because they are the agent loop's business
      - Any time that counts up, because what matters while talking is
        how much is left, not how much has gone

  # VIEW-DOG-002 is the feedback queue in settings, which exists in code
  # and has not been written down yet. Left free rather than reused.
  - id: VIEW-DOG-003
    name: Share this take
    route: Notes/NoteDetailsPage
    description: >
      A quiet control in the top right of a take's details sheet, beside
      the one that closes it.

      It was first built as a full-width button at the foot of the sheet,
      below export, on the reasoning that sharing is a sibling of
      exporting. The reasoning holds and the weight did not: a filled
      button the width of the screen is the loudest thing on a sheet
      whose job is tuning a reading, for an action taken once per take at
      most. Sharing is occasional and reversible; it should be findable
      and it should not compete.

      So it reads as a word rather than a button, in the muted colour the
      section labels use, left of the accent-coloured close. Both are in
      the header, which is where a person looks for what to do with the
      whole thing rather than with a part of it.

      Being small costs it the room to explain itself, and this is the
      one control in the app that sends a recording of the maintainer's
      singing anywhere — so the explanation moves into a confirmation
      raised before anything is sent. Nothing leaves the device on a
      single tap of an unlabelled word. The confirmation says exactly
      what travels: this recording, and the reading the app made of it.

      Shared, the same control says so and raising it again offers to
      take it back. Sending, it says that instead, so a bad connection
      looks like a bad connection rather than like nothing happening.

      A take with no recording behind it shows the control unavailable
      rather than hidden. Hidden reads as a bug; dimmed says there is
      nothing here to send.
    requires_auth: true
    min_role: maintainer
    data_sources:
      - dogfood.share_take
      - dogfood.withdraw_take
    elements:
      - A word in the details sheet header, left of the control that
        closes it, in the muted colour rather than the accent one
      - A touch target of at least 44 points that no neighbour overlaps
      - A confirmation before anything is sent, saying what travels
      - The same control saying it is sending while a share is queued
      - The same control saying it is shared once it is, and offering to
        take it back when raised again
      - A dimmed, unavailable control when there is no recording to send
    absent_elements:
      - Any full-width button, because the sheet is for tuning a reading
        and this is not what it is opened for
      - Anything sent on one tap, without the confirmation that says what
        is being sent
      - Any way to share part of a take, because the context around a
        bad passage is usually what explains it
      - Any prompt to say something while sharing, because that is what
        the record control is for and the two arrive separately
      - Any playback here, because the take is played on the graph behind
