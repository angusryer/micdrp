phase: specifying
phase_detail: >
  Specs written from a crawl of auth/, lib/secureSession.ts,
  screens/Account, screens/Login, profilesRepo, and migration 0001.
  10 capabilities, 12 invariants, 20 acceptance tests, 2 views, 9
  interactions.

  Two security properties are pinned with rejection tests rather than
  left as comments: the refresh token lives only in the platform secret
  store (INV-ACCOUNT-001), and every read of that store degrades to "no
  session" instead of throwing (INV-ACCOUNT-002), covering a locked
  device, an empty store, and a store that raises.

  Account deletion is specified in order — storage objects first, then
  the auth user — because the database cascade does not reach storage
  (INV-ACCOUNT-003), and the routine is scoped so it can only ever
  delete its caller (INV-ACCOUNT-004).
