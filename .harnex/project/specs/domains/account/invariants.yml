invariants:
  - id: INV-ACCOUNT-001
    description: The refresh token lives only in the platform secret store
    severity: critical
    check: >
      No auth token is written to plain application storage. The session
      adapter reads and writes the platform secret store exclusively.
      Verified by asserting the app's document storage contains no token
      after a sign-in.

  - id: INV-ACCOUNT-002
    description: A failed secret-store read never blocks a launch
    severity: critical
    check: >
      Every session read resolves rather than throwing. A missing entry,
      a locked device, and a store that raises all resolve to no session,
      so the app opens at the sign-in gate instead of crashing. Verified
      by driving the store to each failure and asserting the app reaches
      a rendered state.

  - id: INV-ACCOUNT-003
    description: Deletion removes storage before it removes the account
    severity: critical
    check: >
      The singer's storage objects are deleted before the account
      routine is called, because the database cascade does not cover
      storage objects. Verified by asserting the ordering and by listing
      the bucket prefix after a deletion.

  - id: INV-ACCOUNT-004
    description: The deletion routine can only delete its caller
    severity: critical
    check: >
      The routine's body is scoped to the authenticated user, and execute
      is granted to the authenticated role only, revoked from anonymous
      and public. No parameter selects which account is deleted.

  - id: INV-ACCOUNT-005
    description: Signing out keeps everything the singer made
    severity: critical
    check: >
      Sign-out clears the stored session and nothing else. No profile,
      note, or progress row is deleted, and the cached lists survive so a
      re-sign-in on the same device paints immediately.

  - id: INV-ACCOUNT-006
    description: A singer reaches only their own profile
    severity: critical
    check: >
      Every read, insert, update and delete against profiles is
      constrained to the row whose id matches the authenticated user,
      enforced by backend access rules.

  - id: INV-ACCOUNT-007
    description: Every account has exactly one profile
    severity: major
    check: >
      A profile row is created automatically when an auth user is
      created, and creating one twice for the same user is a no-op rather
      than a failure, so a retried sign-up cannot produce a duplicate.

  - id: INV-ACCOUNT-008
    description: Each settings key has exactly one write seam
    severity: major
    check: >
      Only account.set_engine_settings writes the engine settings key and
      only account.set_analysis_settings writes the analysis settings
      key. Verified by searching the client for writes to either key.

  - id: INV-ACCOUNT-009
    description: Settings defaults come from one place
    severity: major
    check: >
      Engine defaults come from the audio contract and chord-inference
      defaults from the logic package. No screen restates a default
      value, so the interface and the analysis cannot disagree.

  - id: INV-ACCOUNT-010
    description: A settings change is a merge, never a replacement
    severity: major
    check: >
      Applying a partial override leaves every unsupplied field at its
      current value. Verified by setting one field twice and asserting
      the first change survives the second.

  - id: INV-ACCOUNT-011
    description: The palette is not a setting this domain owns
    severity: minor
    check: >
      The theme palette is read and written through the theme provider,
      not through the settings store, so a change recolours the live tree
      rather than waiting for a restart.

  - id: INV-ACCOUNT-012
    description: A password reset does not reveal who is registered
    severity: major
    check: >
      The response to a reset request is identical for a registered and
      an unregistered address, so the screen cannot be used to enumerate
      accounts.

  - id: INV-ACCOUNT-013
    description: Every setting says when you would notice it
    severity: major
    check: >
      Each adjustable setting carries a line naming the real situation in
      which changing it is most obviously felt — not a restatement of what
      the number is. Verified by asserting every field in the settings
      screen has a hint, and that no hint is empty.

      These are detector internals with names like "clarity threshold" and
      "hop size". Their labels say what they are, which their names
      already did, and nothing about when to reach for one. The knob that
      lets a quiet whistle be heard was already on this screen and went
      unfound for exactly that reason: nothing on the page connected it to
      the room the singing was happening in.

      The wording is a situation, not a direction: "whistling, or singing
      softly in a quiet room" rather than "lower to detect quieter
      sounds". A situation lets a person recognise their own case; a
      direction only tells them which way the number goes, which the
      stepper already shows.

  - id: INV-ACCOUNT-014
    description: Every knob is drawn from the table the analysis reads
    severity: major
    check: >
      The settings that decide what counts as a note live in one table. The
      analysis reads it to know what to use and the settings screen reads it
      to know what to draw, so a knob cannot exist in one and not the other.
      Every entry has a name and a description of the situation it is noticed
      in, and a default with room to move in both directions. Verified by
      asserting each entry in the table has both strings, that the description
      names a situation rather than a direction, and — by adding an entry
      without one — that the check fails.

      Two lists would drift the moment one was edited, and the failure is
      quiet in both directions: a knob the analysis reads but the screen never
      shows is unreachable, and a knob the screen shows but nothing reads is
      a control that does nothing. Deriving the screen from the analysis's own
      list makes both impossible (Axiom 2).

      The description is not decoration. These are detector internals with
      names like "gap tolerance", and the knob that lets a quiet whistle be
      heard sat on this screen unfound for months because nothing connected it
      to the room the singing was happening in (INV-ACCOUNT-013). A knob that
      cannot ship without one is the only version of that rule that holds.
