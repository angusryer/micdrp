# How a sung note is told apart from the way a voice arrives at it. Split
# from invariants.yml for the 150-line spec-file budget.
invariants:
  - id: INV-PITCH-017
    description: A note is its steady part, not the slide into it
    severity: critical
    check: >
      Where a voice slides into or out of a pitch, that movement joins
      the note it belongs to rather than becoming a note of its own.
      Verified by asserting a scooped note is read as one note at the
      pitch it settled on, and that the same phrase sung with and
      without a scoop reads as the same melody.

      A voice does not arrive at a pitch instantly and does not leave one
      instantly. Reading the approach as a separate note produces a
      melody nobody sang, and — because the chords are read from the
      melody — a harmony nobody implied.

  - id: INV-PITCH-018
    description: A change of note is at least a semitone
    severity: critical
    check: >
      Two notes in succession whose pitches lie less than a semitone
      apart are one note that bent, and are read as one. What survives
      takes the pitch of whichever was held longer, since that is the
      one being sung and the other is the way in or the way out.
      Merging repeats until nothing is left within a semitone of its
      neighbour, so an approach, a note and a release become one note
      rather than two. Verified by asserting a note flanked by two
      sub-semitone fragments is read as one note at the held pitch, and
      that a real semitone step is never merged.

      This is what "a different note" means: a singer moving between
      scale degrees crosses at least a semitone, and anything smaller is
      the voice on its way somewhere rather than arriving. Judging each
      fragment on its own cannot see that — only a note read against its
      neighbours can, because the evidence for a bend is entirely in how
      near it sits to what surrounds it.

  - id: INV-PITCH-019
    description: Nothing shorter than a voice can articulate is a note
    severity: major
    check: >
      A reading that survives the joining of bends and is still briefer
      than a voice can deliberately articulate is discarded rather than
      kept. Applied after joining, never before: an approach is brief and
      belongs to its note, so discarding brief things first would throw
      away the slide instead of absorbing it. Verified by asserting a
      brief fragment a tone from both its neighbours is dropped, while a
      brisk but real phrase survives intact, and a scooped note keeps its
      approach.

      Changing pitch means changing the length and tension of the vocal
      folds, and that takes time — the fastest trained melisma runs at
      about ten notes a second, ordinary singing at half that. Nothing
      briefer was meant.

      This is the one duration in the analysis worth trusting, and the
      reason is worth keeping: it is a limit of the instrument, not of
      the music. Every other span in milliseconds is a guess about tempo,
      and tempo is the singer's to choose — which is why the chord
      reading counts notes rather than time. The body does not speed up
      because the song does.

      It rejects; it does not detect. It cannot say where a note begins,
      only that this one cannot have been meant.

  - id: INV-PITCH-020
    description: How loud each note was, and whether anyone measured it
    severity: major
    check: >
      Every analysed frame carries the level of the window it was read from,
      in dBFS with a floor rather than negative infinity, and every note
      carries the mean of the levels of the frames that made it that note. A
      note no frame measured reports null, not the floor. Notes that fold
      together weigh their parts by duration, over the parts that had a
      reading. Verified by asserting halving the amplitude reads six dB down
      from anywhere, that two notes keep their difference, that an unmeasured
      note is null rather than silent, and that it survives the smoothing and
      the merging that run between the frames and the note.

      In dB because accent is a ratio. What makes the stressed beat of a
      count-in the stressed one is how many times louder it was than its
      neighbours, and dB is that ratio written as a number you can subtract.
      Averaged in dB for the same reason: the mean of the ratios is what
      "how loud was this note" means, where a mean of pressures is not.

      Measured over the same window the pitch came from, and travelling with
      it, because a note's loudness is the loudness of the frames that made
      it that note. Measured separately it would be a second reading of the
      same audio, free to disagree with the first (Axiom 2).

      Null rather than a floor value when nothing measured it. "Nobody
      looked" and "it was silent" are different claims and only one of them
      is about the singing — and the first is ordinary, since a bundle can be
      newer than the binary it runs inside, and takes captured before this
      existed are still in the library. Anything reading accent has to be
      able to tell them apart, or a take from an older engine reads as one
      sung entirely without emphasis.

      Every stage between the frame and the note has to carry it, and the
      smoothing is the one that will not by default: it rebuilds each frame
      to decide which note was sung, and a rebuild that lists the fields it
      keeps drops this one silently — leaving every note in the take
      unmeasured with nothing to say why.

      The measurement is defined once (cpp/dsp/level.h) and there is now one
      streaming engine to use it (INV-PITCH-021). The Tier-2 worklet computes
      the same reading with the same floor on its own runtime, which cannot
      reach native code; the two are held together by this invariant rather
      than by a shared file.

  - id: INV-PITCH-021
    description: One streaming engine, and voicing is three questions
    severity: critical
    check: >
      Exactly one C++ streaming pitch engine exists, declaring PitchSample,
      PitchEngine and EngineConfig once each, and the bridge under ios/ holds
      none of its own. Whether a frame is voiced is decided by three separate
      numbers: MPM's peak-picking parameter, an absolute floor on the chosen
      peak's height, and a floor on the window's level. Verified by counting
      the declarations across every C++ source, and by asserting the counting
      fails when a second is introduced.

      There were two engines. The fuller one was built around a lock-free ring
      precisely so the audio thread neither allocates nor blocks; the second
      re-implemented the same job on the audio thread, and it was the one
      capture ran. The duplication was recorded in a comment at the top of the
      file that lost, which is not a guard: a field added to the shared
      PitchSample compiled, passed its unit tests, and never reached the app,
      because the struct the bridge marshalled was the other one. The archive
      was the first thing able to notice.

      The parity pair is not this. `logic/mpm.ts` and `cpp/dsp/mpm.cpp` are two
      implementations of one algorithm checked against each other every run —
      that is a duplication with a proof attached. Two shells nobody compares
      is the kind this forbids.

      Splitting voicing into three numbers is the same fault in miniature.
      `clarityThreshold` is MPM's peak-picking parameter: it decides which NSDF
      peak is the fundamental, as a fraction of the tallest. It was also being
      used as an absolute confidence gate, so one setting answered "which
      pitch" and "is there a pitch" at once — and the two want opposite values.
      At 0.9 the gate discarded quiet singing and whistling, which is exactly
      what the setting's own description promised lowering it would fix, while
      lowering it also loosened peak-picking and invited octave errors.

      The level floor is the honest form of the question the gate was really
      being asked. "Too quiet to be anything" is about loudness, and loudness
      is now measured (INV-PITCH-020); clarity is a measure of shape, and a
      quiet, perfectly periodic whistle has a clear shape and a low level.

  - id: INV-PITCH-022
    description: A counted tempo overrules an inferred one
    severity: major
    check: >
      A run of evenly spaced notes at the head of a take, whose loudness shows
      a repeating accent, is read as a count: its interval is the beat, its
      accent period is the bar, and beat one is where the counting started.
      That grid replaces the fitted one. Anything without accents is not a
      count and is left to the fitter untouched. Verified by asserting a
      counted waltz comes back as 3/4 at the counted tempo with beat one where
      it was counted, and that a take with no count is unchanged.

      Every other tempo reading here infers a beat from music, which is
      genuinely hard: onsets fall on some beats and not others, syncopation
      lies, and the strongest periodicity is often twice or half what a person
      would tap. A count is not an inference — it is somebody stating the
      tempo out loud before playing — so the only job is to not lose it.

      The accents are what make it a count, and they are the whole reason this
      needs per-note loudness (INV-PITCH-020). Even spacing alone describes a
      metronomic melody exactly as well, and the first version of this read
      any steady opening as a stated tempo: a waltz came back as 4/4, and
      eighth notes came back as quarters, because one inter-onset interval was
      taken for one beat. A reading that overrules another has to be sure
      rather than plausible.

      Takes whose loudness was never measured therefore have no count and keep
      the tempo they have always had, which is the correct answer for every
      recording made before this existed.

      Beat one is the first counted beat rather than a fitted phase. Somebody
      counting put beat one where they put it, and re-deriving it from the
      audio afterwards would discard the clearest statement in the take.

  - id: INV-PITCH-023
    description: A re-articulated note is a new note
    severity: major
    check: >
      A run of short notes on one pitch, each stopping before the next, is
      read as that many notes. A note is ended by a gap in which the level
      collapses, however brief; a gap in which the level holds is the detector
      flickering and is ridden out as before. Notes separated by a real
      silence are not joined as a bend, and a note briefer than the
      articulation limit is kept when its spacing to a neighbour shows it was
      played short rather than slipped. Verified by asserting eight tongued
      sixteenths read as eight notes at their own onsets, and that a held note
      survives detector dropouts, an ordinary swell, and unmeasured levels
      intact.

      "da da da da" on one pitch came back as a single held note, and nothing
      in the reading was wrong on its own terms: the segmenter splits on a
      change of pitch, and the pitch never changed. The articulation is not in
      the pitch at all. It is in the envelope, and until every frame carried a
      level (INV-PITCH-020) there was nothing to read it from.

      The level is also what makes splitting safe. A stop consonant collapses
      it by tens of dB; a detector losing confidence for a frame does not move
      it at all. Splitting on the gap alone would shatter every sustained note
      in the app, which is exactly what the gap tolerance exists to prevent —
      so the tolerance stays, and the collapse is what overrides it.

      Three stages had to agree, and each was wrong in the same way. The bend
      merger joined any two notes within a semitone regardless of the silence
      between them, so the pieces were put back together immediately: a bend
      is the voice sliding without stopping, and its parts touch. The brevity
      filter measured how long a note SOUNDED, when the limit it encodes is
      how fast one note can follow another — the body cannot re-articulate ten
      times a second, but it has no trouble making a short sound and stopping.

      Takes with no measured level keep exactly the reading they had.

  - id: INV-PITCH-024
    description: A note pushed again on the breath is a new note
    severity: major
    check: >
      Where the level climbs sharply out of a recent dip at one pitch, with no
      silence between, a new note begins at the dip. The climb must happen
      inside a short window: the same rise spread over a long one is a
      crescendo and splits nothing. Two segments at the very same pitch are
      never joined as a bend. Verified by asserting four breathed attacks read
      as four notes at their own onsets, that a slow swell over the same range
      stays one note, and that takes with no measured level are unchanged.

      "ha ha ha" has no stop consonant. The level never collapses, so the rule
      for tongued notes (INV-PITCH-023) does not see it, and the pitch never
      moves, so the segmenter does not either. What marks each attack is how
      fast the level climbs, and speed is the only thing separating it from a
      singer swelling into a held note — both may cover fifteen dB, and only
      one does it in a breath.

      The bend merger had to learn the same distinction. It joined any two
      notes within a semitone, and two pieces at the identical pitch are
      within a semitone of each other trivially — so every breath-split note
      was reassembled immediately. A bend is a change of pitch; where there is
      no movement there is nothing being bent, and the only reason the
      segmenter split there was articulation.
