invariants:
  - id: INV-PITCH-001
    description: PCM never crosses the native boundary
    severity: critical
    check: >
      No message delivered from the engine to the JS thread carries raw
      audio samples. Subscribers receive PitchSample frames only. Verified
      by inspecting the native emitter payload shape on both tiers and the
      worklet post message: neither contains a sample buffer.

  - id: INV-PITCH-002
    description: Clarity is always a probability
    severity: critical
    check: >
      Every clarity value produced by detection or carried through
      smoothing is within 0 and 1 inclusive, including on the paths that
      return no frequency. Verified by asserting the bound on the result
      of pitch.detect for silent, noisy, and tonal frames.

  - id: INV-PITCH-003
    description: An unvoiced frame is unvoiced in every field
    severity: critical
    check: >
      A PitchSample with midi null also has cents null and frequencyHz 0,
      and a PitchSample with a non-null midi has frequencyHz greater than
      0. The two representations never disagree about whether the frame
      is voiced.

  - id: INV-PITCH-004
    description: Smoothing preserves the frame timeline
    severity: critical
    check: >
      pitch.smooth returns exactly as many frames as it was given, in the
      same order, with each output frame carrying the input frame's
      timestampMs and clarity unchanged. Only midi and cents may differ.

  - id: INV-PITCH-005
    description: Detection respects the configured frequency bounds
    severity: critical
    check: >
      When minFrequency or maxFrequency is supplied, no returned
      frequency lies outside them. A peak outside the bounds yields a
      null frequency and still reports its clarity.

  - id: INV-PITCH-006
    description: The note reference is A4 = 440 Hz
    severity: critical
    check: >
      frequencyToMidi(440) is exactly 69 and midiToFrequency(69) is
      exactly 440. Every other domain that shows a note name derives it
      from these conversions rather than restating the reference.

  - id: INV-PITCH-007
    description: Cents never exceed half a semitone
    severity: critical
    check: >
      Every cents value produced by pitch.read_note is within -50 and 50
      inclusive, because cents measures distance to the NEAREST note. A
      value outside that range means the wrong note was chosen.

  - id: INV-PITCH-008
    description: The live stream is throttled, the stored analysis is not
    severity: major
    check: >
      During a session, PitchSample frames reach subscribers at no more
      than emitRateHz per second. The RecordingHandle returned by
      pitch.stop_capture carries the full-resolution analysis, so
      transcription never sees a decimated timeline.

  - id: INV-PITCH-009
    description: Tier selection is invisible to callers
    severity: major
    check: >
      Both the native C++ tier and the worklet fallback satisfy the same
      AudioEngine contract and emit the same PitchSample shape. No caller
      branches on which tier is active. Verified by the C++/TS parity
      test, which runs both detectors over the same frames and requires
      matching results.

  - id: INV-PITCH-010
    description: A capture session is single-flight
    severity: major
    check: >
      pitch.start_capture rejects while a session is already running, and
      pitch.stop_capture rejects when no session is running. There is at
      most one microphone session per process at any time.

  - id: INV-PITCH-011
    description: A capture is written where the operating system cannot reclaim it
    severity: major
    check: >
      The audio file a capture resolves with is written under the app's own
      recordings directory, which persists until the app deletes it. It must
      not be written to a temporary or cache location: the system may reclaim
      those at any point, which would leave a saved note pointing at audio
      that has silently disappeared. The directory is chosen by the caller and
      passed to the engine, so the path is defined in one place rather than
      once in JavaScript and again in native code.


  - id: INV-PITCH-012
    description: Captured audio is written in a format playback can open
    severity: critical
    check: >
      A capture is written in a container and sample format the app's
      own decoder can open. Verified by recording a take and decoding
      the file it produced, not merely by asserting the file exists.

      Every note ever recorded was unplayable because of this. Capture
      wrote CAF holding Float32 PCM — correct for Core Audio and correct
      for the analysis path — while playback decodes through miniaudio,
      which reads WAV, MP3 and FLAC and routes only .mp4, .m4a and .aac
      to ffmpeg. CAF matched nothing, so every decode failed and the UI
      said "Playback failed" without ever naming the format.

      Writing a file and reading it back are two halves of one contract.
      A test that only proves the first half proves nothing a user cares
      about.

  - id: INV-PITCH-013
    description: A take is judged against its own pitch centre, not concert A
    severity: high
    check: >
      A phrase sung consistently in tune with itself scores as in tune
      however far its centre sits from A440. Verified by shifting a whole
      take by a fixed number of cents and asserting the score does not
      change.

      Someone humming an idea has no reference to tune to. What matters
      to them is whether the notes agree with one another, not whether
      they agree with a tuning fork — a take sung beautifully thirty
      cents sharp was being reported as thirty cents wrong on every note,
      which is true and useless.

      The centre is measured with circular statistics, as the pulse is.
      Deviations wrap at half a semitone, so a take sitting at +48 and
      one at -48 are nearly the same take, and an ordinary average of
      them lands at zero — the answer that is exactly wrong.

  - id: INV-PITCH-014
    description: What the pitch centre is gets reported, never silently applied
    severity: medium
    check: >
      The measured offset is carried alongside the score. Verified by
      asserting a take centred away from concert pitch reports how far.

      Adjusting a reading without saying so is how a tool stops being
      trustworthy. A singer who wants to know they are consistently sharp
      should be able to find that out; they should just not be told their
      phrase is wrong because of it.
