# Four commands and one subscription. Everything else is somebody's job.
capabilities:
  - name: transport.play
    description: >
      Sound the take, from where the head is or from a moment given.
    actor: singer
    implemented_by: packages/client/src/audio/transport.ts
    parameters:
      required: []
    preconditions:
      - there is audio to resolve
    postconditions:
      - the state becomes loading, then playing once the engine accepts
      - a press while already loading is refused rather than queued, so
        one take is never decoded twice
      - a press that arrives while a run is being cancelled belongs to
        the newer press; the older one starts nothing
      - a start already on its way when a newer command supersedes it
        is waited for and then silenced, because it schedules audio
        whether or not anyone is still watching (INV-TPORT-015)
      - the head advances on the UI thread and notifies nobody
      - a refusal ends in failed with the reason, never in silence

  - name: transport.pause
    description: >
      Fall silent, holding the moment. The next play carries on from it.
    actor: singer
    implemented_by: packages/client/src/audio/transport.ts
    parameters:
      required: []
    preconditions: []
    postconditions:
      - everything sounding is silenced, not the one bus the transport
        believed the take was on (INV-NOTES-205)
      - the head stays where the run reached
      - pausing what is already silent changes nothing and is not an error

  - name: transport.stop
    description: >
      Fall silent and give the moment back to wherever it was put.
    actor: singer
    implemented_by: packages/client/src/audio/transport.ts
    parameters:
      required: []
    preconditions: []
    postconditions:
      - everything sounding is silenced
      - a press still waiting on a count-in is cancelled and starts
        nothing afterwards (INV-NOTES-204)

  - name: transport.seek
    description: >
      Put the head somewhere. Decides nothing about sound.
    actor: singer
    implemented_by: packages/client/src/audio/transport.ts
    parameters:
      required: [atMs]
    preconditions: []
    postconditions:
      - the head moves, and every display follows it at once whether or
        not anything is sounding (INV-NOTES-208)
      - seeking while sounding stops first and starts again from there,
        because this engine begins at a moment rather than jumping to one
      - a take still loading counts as sounding, so the load is
        cancelled and a run begins from the new moment and nothing is
        left at loading with no start on its way (INV-TPORT-016)
      - seeking while silent sounds nothing
      - a continuous gesture seeks once, on release, with the head
        following the finger meanwhile. Restarting the take per frame
        would mint a file token and decode per frame (INV-TPORT-018)

  - name: transport.observe
    description: >
      Learn when what the transport is doing changes.

      Changes, not ticks. The moment moves constantly and reaches
      displays through the head; this fires when the state does, which
      is rare.
    actor: system
    implemented_by: packages/client/src/audio/transport.ts
    parameters:
      required: [listener]
    preconditions: []
    postconditions:
      - the listener is called on every state change and on no tick
      - unsubscribing stops it being called at all
      - nothing published to a subscriber changes while a take plays
        (INV-NOTES-206)

  - name: transport.report
    description: >
      Read what the engine is doing: where the run has reached, whether
      it is running, and which run it is.

      Read rather than pushed. The audio thread publishes a snapshot as
      it renders and never waits for anyone; whatever wants to know
      asks, at whatever rate suits it. That is the shape professional
      audio uses and the reason it can draw a playhead at sixty frames
      a second without troubling the engine sixty times.
    actor: system
    implemented_by: packages/client/cpp/dsp/synth.cpp
    parameters:
      required: []
    preconditions: []
    postconditions:
      - the position is in samples on the engine's own clock
      - position, running and generation are consistent with each other
        (INV-TPORT-012)
      - a run that reached its end reports stopped without being told
        (INV-TPORT-011)
      - reading never blocks the audio thread and never allocates

  - name: transport.run
    description: >
      Tell the engine a run has begun, from a moment, until a moment.

      Separate from scheduling a voice. A run is time passing; a voice
      is a sound. Muting the take must not stop the clock
      (INV-TPORT-013).
    actor: system
    implemented_by: packages/client/cpp/dsp/synth.cpp
    parameters:
      required: [startSample, offsetSamples, endSample]
    preconditions: []
    postconditions:
      - the position advances with rendered blocks from the offset given
      - the run ends itself at the end given, and says so
      - starting a run replaces the one before it rather than joining it
