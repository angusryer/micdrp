# Every one of these is a fault this app actually had. None is a
# precaution; each is a day already spent.
invariants:
  - id: INV-TPORT-001
    description: One thing knows what is sounding
    severity: critical
    check: >
      Exactly one module starts or stops a sound, and exactly one holds
      the state and the head. Verified by asserting no other module
      calls the engine's schedule or clear.

      There were seven, and each read as correct on its own. That is the
      point: a fault distributed across seven correct-looking places is
      not findable by reading any of them, and five fixes went into the
      audio path for a fault that was never in it.

  - id: INV-TPORT-002
    description: What moves every frame never crosses into React
    severity: critical
    check: >
      The head is a shared value the UI thread advances. Nothing the
      transport publishes to a subscriber changes while a take runs.
      Verified by asserting the published object is identical across a
      run of playback.

      The moment used to tick into the screen above as React state
      twice a second, re-rendering a Skia canvas that cost more than the
      interval. The JS thread never went idle, so a press had nowhere to
      be handled — which presented as pause not working, for hours
      (INV-NOTES-206).

  - id: INV-TPORT-003
    description: A control sends a command and holds no opinion
    severity: critical
    check: >
      No control sets transport state. Every control calls a command and
      renders what it is told. Verified by asserting the controls hold
      no playback state of their own.

      A control that sets state is a second answer to "what is
      sounding", and two answers is how a button came to show a pause
      glyph over a take that had already stopped.

  - id: INV-TPORT-004
    description: A press is answered as the finger lands
    severity: high
    check: >
      Transport controls act on the press going down, not on release.
      Verified by asserting a press-in issues the command.

      A press that must survive until release is one that anything
      cancelling a press can take away, and something was: the trace
      read two touches, two accepted, one fired. Which of them was lost
      was never established, and a transport should answer the finger
      anyway.

  - id: INV-TPORT-005
    description: Silence is not contingent on bookkeeping
    severity: critical
    check: >
      Stopping silences the engine rather than the one bus the
      transport believes is sounding. Verified by asserting a stop
      clears every voice whatever bus each went to.

      Clearing by index worked only while the transport's idea of where
      a voice went matched the engine's, and when that stopped being
      true nothing said so (INV-NOTES-205).

  - id: INV-TPORT-006
    description: A refused command is an error, never silence
    severity: critical
    check: >
      A command the engine will not take ends in failed, carrying why,
      and the reason reaches the surface. Verified by refusing a
      schedule and asserting the state and the reason.

      Every fault in this history presented as nothing happening. A
      transport that cannot say "I was told and it did not work" is one
      nobody can debug from outside, and outside is where the only
      person using it stands.

  - id: INV-TPORT-007
    description: One head, running or waiting
    severity: high
    check: >
      One value carries where the take is, and every display reads it
      whether or not a sound is running. Verified by seeking a stopped
      take and asserting what is drawn moves.

      Two values meant two answers: a rewind on a stopped take set the
      position correctly and left every mark where it was
      (INV-NOTES-208).

  - id: INV-TPORT-008
    description: A press cancels the press before it
    severity: high
    check: >
      Anything resuming after an await checks it is still the current
      press, and stops if it is not. Verified by stopping during a
      count-in and asserting nothing starts afterwards.

      Play waited out a count on a timer nothing could cancel, so a
      stop during the count silenced everything, set the state to
      stopped, and then started the take regardless — leaving a take
      playing that the transport considered stopped (INV-NOTES-204).

  - id: INV-TPORT-009
    description: Anything the UI thread runs is a worklet of its own
    severity: critical
    check: >
      Placement arithmetic reached from an animated style lives in its
      own module with the directive on it, and borrows nothing written
      for the JS thread. Verified by asserting every function an
      animated style calls carries it.

      Nothing catches a violation: types pass, lint passes, and no test
      here can run a worklet. Three terms of arithmetic called from an
      animated style exited the app natively the instant a note was
      opened (INV-NOTES-207).

  - id: INV-TPORT-010
    description: The engine owns the position; nothing above it infers one
    severity: critical
    check: >
      Where the run has reached is read from the engine, in samples on
      its own clock, and never computed from a wall clock or a start
      time remembered elsewhere. Verified by asserting the position
      advances with rendered blocks and stops advancing when the engine
      does.

      Professional audio puts the transport in the engine and lets the
      interface read it — a host hands a plugin its position, it does
      not ask the plugin to guess. This inferred one: a start moment was
      remembered in JavaScript and elapsed time computed against the
      audio clock, which is right until the engine is late, suspended,
      or short of a block. Then the app's idea of where it was drifted
      from where it was, and every symptom of that reads as the app
      lying about what is happening.

  - id: INV-TPORT-011
    description: The engine says when a run ended; nothing predicts it
    severity: critical
    check: >
      A run that reaches its end marks itself stopped and counts the
      ending, and the app learns of it by reading. Verified by
      rendering past the end and asserting the report says stopped.

      There was a timer. A take's length was measured at decode, a
      timeout was set for it, and the transport called itself stopped
      when the timeout fired — "the engine has no way to say a voice
      ended" was written in the source as an explanation. A transport
      that predicts the end is one that is wrong whenever the
      prediction is, and it cannot be right about a run that failed
      early.

  - id: INV-TPORT-012
    description: What the engine reports is read whole or not at all
    severity: high
    check: >
      Position, running and generation are published together and read
      as one consistent snapshot; a reader never sees the position from
      one block beside the running flag from another. Verified by the
      report's sequence guard.

      Fields read one at a time tear. A position taken from the block
      before a stop, beside a flag taken from the block after it,
      describes a moment that never happened — and a display drawn from
      it is wrong in a way nothing can reproduce.

  - id: INV-TPORT-013
    description: Muting is not stopping
    severity: high
    check: >
      The transport runs whether or not any particular voice is
      audible. Turning a track off sets a bus level and changes nothing
      about the run. Verified by asserting the position advances with
      the take's bus silent.

      Conflating them is why a second running-state existed for the
      case where the take was muted: the transport had been defined as
      "the take is sounding" rather than "time is passing". No mixing
      desk works that way, and the state that came of it was a state
      machine kept in parallel with the real one.

  - id: INV-TPORT-014
    description: A newer bundle on an older binary asks and falls back
    severity: critical
    check: >
      Where the engine cannot report a transport, the app uses what it
      can compute and says nothing is wrong. Verified by asserting the
      transport works against an engine with no report at all.

      A bundle can be newer than the binary running it. Reading a
      method that is not there is a crash on somebody's phone, and the
      whole point of shipping JavaScript over the air is that it
      arrives before the binary does (INV-PITCH-020).

  - id: INV-TPORT-015
    description: A cancelled run takes its sound back with it
    severity: critical
    check: >
      A start already on its way when a newer command supersedes it
      still reaches the engine and still schedules audio. The transport
      waits for it to land and then silences it, so no run nobody is
      watching is left sounding. Verified by superseding a start that
      has not resolved and asserting nothing is scheduled afterwards.

      Checking the run counter after the await and returning was enough
      to stop the *state* being wrong and did nothing about the sound:
      the take went on playing under a transport that had already
      called itself stopped. Cancelling a press is not the same act as
      taking back what the press already did.

  - id: INV-TPORT-016
    description: Loading is a promise, and a cancelled load must be released
    severity: critical
    check: >
      No command leaves the transport in loading unless a start is
      actually on its way. A command that supersedes a load either
      starts a run of its own or moves the state off loading. Verified
      by seeking mid-load and asserting the state is never loading once
      everything has settled.

      Seek only asked whether the take was *playing*, so a seek
      arriving mid-load moved the head, silenced the engine, and left
      the state at loading with nothing left to resolve it. The spinner
      never stopped — not when the seek finished, not when the take ran
      out — and the abandoned decode went on sounding underneath it.

  - id: INV-TPORT-017
    description: The binding hands over the engine, not a copy of three of it
    severity: high
    check: >
      What the store is given is the engine itself, forwarded whole. No
      call site lists the methods by hand. Verified by asserting the
      transport built by the hook can answer everything the engine can.

      `useTakeVoice` hand-copied `start`, `silence` and `reachedMs`
      onto an adapter. `hasEnded` was added to the engine one commit
      later and never reached the store, so the engine-owned end
      detection of INV-TPORT-011 was dead in the app and only the
      fallback timer ever ran. Nothing failed: the subset type-checked,
      because the missing method is optional by design (INV-TPORT-014).

  - id: INV-TPORT-018
    description: A drag moves the head; the release restarts the take
    severity: critical
    check: >
      A continuous gesture issues at most one transport command per
      gesture, not one per frame. Verified by asserting a pan of many
      updates decodes the take once.

      The scrubber sent a seek on every pan update. Playing, each of
      those was a full stop, mint a file token, decode and reschedule —
      sixty times a second, each one superseding the last. That is the
      storm INV-TPORT-015 and INV-TPORT-016 were found underneath, and
      fixing them alone would leave a scrub that hammers the backend
      for a token per frame.

  - id: INV-TPORT-019
    description: A length the engine could not give is a failure, not a duration
    severity: critical
    check: >
      Every number the engine hands back is checked against what it
      means before it is used as one. A decode that did not happen ends
      in failed with a reason (INV-TPORT-006), never in a run.
      Verified by refusing a decode and asserting the state and reason.

      `loadSample` returns -1 when the decode fails — its documented
      failure value — and that was consumed as the take's length. The
      arithmetic that followed did not error: the offset clamped to 0,
      the clip was scheduled with an end one millisecond before its
      start, and the run's fallback end fired at once. So a press gave
      a spinner, a flicker of the graph as following turned on and off,
      the play glyph back, and no sound and no reason anywhere. A
      failure that presents as a control that did nothing is the exact
      shape this whole domain was built after.

  - id: INV-TPORT-020
    description: A take is decoded once per take, not once per token
    severity: high
    check: >
      What is already decoded is recognised across presses. The address
      a take is fetched from carries a credential that changes every
      time it is minted, so the decision cannot be made on the whole
      address. Verified by asserting a pause and a resume decode once.

      The cache compared the full signed URL, and a backend file token
      is good for about two minutes and freshly minted per press
      (INV-NOTES-014) — so it never matched, and every resume
      re-fetched and re-decoded the whole recording. The comment beside
      it said a second press was "a schedule and nothing else, which is
      what makes it immediate". It was neither, and the re-decode is
      what had a chance to fail at all (INV-TPORT-019).


  - id: INV-TPORT-021
    description: The moment and the frame that dates it are written together
    severity: critical
    check: >
      A reading of the clock and the frame stamp it is measured from are
      one value, written once. No reader can see one of them updated and
      the other not. Verified by advancing a frame between a write of
      each and asserting the drawn position never moves backwards.

      They were two shared values written one after the other from the
      JS thread. A frame landing between the two computed the new moment
      plus the time since the *old* stamp — a jump forward of the whole
      sample interval, and a snap back on the next frame. It read as the
      playhead jumping a few times a second, and it grew with whatever
      else was keeping the JS thread busy, which is why it looked like a
      graph problem.

  - id: INV-TPORT-022
    description: The drawn head reads the engine's position, not a second clock
    severity: critical
    check: >
      What the head is drawn from is the position the engine reports,
      sampled and carried between samples by frame time. Where the
      engine cannot be asked it falls back to what it can compute, and
      says nothing is wrong (INV-TPORT-014). Verified by asserting the
      drawn head follows a reported position that does not match
      elapsed time.

      The head was computed from the audio clock and a start moment
      remembered in JavaScript. That is the inference INV-TPORT-010
      exists to forbid, kept alive in one last place because the engine
      that owns the position has never been built into a binary — so
      every reading on a device came from the fallback, and the fallback
      was the only path anyone was actually running.

  - id: INV-TPORT-023
    description: Following a head never scrolls a view that cannot scroll
    severity: high
    check: >
      The view follows the head only where the drawing is wider than the
      window. With the whole take in view there is nowhere to go, and
      the reaction that would follow it never runs. Verified by
      asserting the centring offset is the current one whenever the
      content fits, and that following is off in that case.

      Zoomed out far enough that the take fits, the follow issued a
      native scroll command every frame to the offset it was already at
      — sixty a second for the length of a take, to move nothing. Found
      while looking for why a press of pause was not answered in exactly
      that configuration and answered in every other. Whether it is that
      cause is not established; that it is work done to no effect is.
