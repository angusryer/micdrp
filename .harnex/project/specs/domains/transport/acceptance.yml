# What the transport must do, stated as the failures it came from.
acceptance:
  - id: ACC-TPORT-001
    interface: module
    title: Playing reaches the engine and says so
    given:
      - a take with audio
    when:
      - the transport is told to play
    then:
      - the transport state is playing
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-001]

  - id: ACC-TPORT-002
    interface: module
    title: A refused schedule fails loudly
    given:
      - a take whose audio cannot be resolved
    when:
      - the transport is told to play
    then:
      - the transport state is failed
      - the transport reports a reason
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-006]

  - id: ACC-TPORT-003
    interface: module
    title: Pausing silences everything
    given:
      - a take is playing
    when:
      - the transport is told to pause
    then:
      - the engine was silenced entirely
      - the transport state is paused
    maps_to:
      capability: transport.pause
      invariants: [INV-TPORT-005]

  - id: ACC-TPORT-004
    interface: module
    title: Pausing holds the moment for the next press
    given:
      - a take is playing
    when:
      - the transport is told to pause
      - the transport is told to play
    then:
      - the run started from where it was paused
    maps_to:
      capability: transport.pause
      invariants: [INV-TPORT-007]

  - id: ACC-TPORT-005
    interface: module
    title: Seeking a silent take moves the head and sounds nothing
    given:
      - a take is stopped at 12000 ms
    when:
      - the transport is told to seek to 7000 ms
    then:
      - the head is at 7000 ms
      - the transport state is stopped
    maps_to:
      capability: transport.seek
      invariants: [INV-TPORT-007]

  - id: ACC-TPORT-006
    interface: module
    title: Nothing published changes while a take plays
    given:
      - a take is playing
    when:
      - the clock is read 4 times
    then:
      - the published transport is unchanged
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-002]

  - id: ACC-TPORT-007
    interface: module
    title: A second press while loading is refused, not queued
    given:
      - a take with audio
    when:
      - the transport is told to play
      - the transport is told to play
    then:
      - the take was decoded 1 time
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-001]

  - id: ACC-TPORT-008
    interface: module
    title: Stopping cancels a press that has not started
    given:
      - a take with a count-in in force
    when:
      - the transport is told to play
      - the transport is told to stop before the count ends
    then:
      - the take never starts
    maps_to:
      capability: transport.stop
      invariants: [INV-TPORT-008]

  - id: ACC-TPORT-009
    interface: module
    title: A subscriber hears a state change and no tick
    given:
      - a take is playing
    when:
      - the clock is read 4 times
      - the transport is told to pause
    then:
      - the subscriber was told 1 time
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-002]

  - id: ACC-TPORT-010
    interface: module
    title: A seek arriving mid-load starts again rather than stranding
    given:
      - a take is playing
      - a seek whose decode has not resolved
    when:
      - the transport is told to seek to 9000 ms
      - the outstanding decode resolves
    then:
      - the transport state is playing
      - the head is at 9000 ms
    maps_to:
      capability: transport.seek
      invariants: [INV-TPORT-016]

  - id: ACC-TPORT-011
    interface: module
    title: A superseded start is silenced once it lands
    given:
      - a take whose decode has not resolved
    when:
      - the transport is told to stop
      - the outstanding decode resolves
    then:
      - the transport state is stopped
      - nothing is scheduled on the engine
    maps_to:
      capability: transport.stop
      invariants: [INV-TPORT-015]

  - id: ACC-TPORT-012
    interface: module
    title: The transport built by the hook can be asked whether a run ended
    given:
      - an engine that reports when a run has ended
    when:
      - the take is played through to its end
    then:
      - the transport state is stopped without any timer firing
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-011, INV-TPORT-017]

  - id: ACC-TPORT-013
    interface: view
    title: Dragging the scrubber decodes the take once
    given:
      - a take is playing
    when:
      - the scrubber is dragged across 20 updates and released
    then:
      - one file token is minted for the whole drag
      - the take is scheduled 1 time
      - the take is sounding again from where the finger let go
    maps_to:
      capability: transport.seek
      invariants: [INV-TPORT-018]

  - id: ACC-TPORT-014
    interface: module
    title: A take that will not decode fails loudly
    given:
      - a take whose audio resolves but will not decode
    when:
      - the transport is told to play
    then:
      - the transport state is failed
      - the transport reports a reason
      - nothing is scheduled on the engine
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-019, INV-TPORT-006]

  - id: ACC-TPORT-015
    interface: module
    title: Resuming a paused take does not decode it again
    given:
      - a take that has been played and paused
    when:
      - the transport is told to play
    then:
      - the take was decoded 1 time
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-020]

  - id: ACC-TPORT-016
    interface: module
    title: The head never moves backwards between samples
    given:
      - a run whose clock is read every 200 ms
    when:
      - a frame is drawn between the reading and the stamp that dates it
    then:
      - the drawn position is the reading itself
      - the drawn position never moves backwards
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-021]

  - id: ACC-TPORT-017
    interface: module
    title: The head follows the engine rather than elapsed time
    given:
      - an engine reporting a position of 12000 ms
    when:
      - the head is sampled
    then:
      - the drawn position is 12000 ms
    maps_to:
      capability: transport.report
      invariants: [INV-TPORT-022, INV-TPORT-010]

  - id: ACC-TPORT-018
    interface: view
    title: A take that fits the window is not followed
    given:
      - a drawing no wider than the window it is in
    when:
      - the take plays
    then:
      - the view issues no scroll
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-023]

  - id: ACC-TPORT-019
    interface: module
    title: No screen imports the audio engine
    given:
      - the client source tree
    when:
      - imports of the native synth spec are collected
    then:
      - every importing module is under src/audio
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-024]

  - id: ACC-TPORT-020
    interface: module
    title: A resident take costs two bytes a frame
    given:
      - a recording of known length
    when:
      - it is loaded into a slot
    then:
      - the resident audio is 16-bit mono at the engine rate
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-026]

  - id: ACC-TPORT-021
    interface: module
    title: A second load of the same recording decodes nothing
    given:
      - a recording already loaded once
    when:
      - it is loaded again
    then:
      - no decoder is opened
      - the frames come from the raw file written by the first load
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-027]

  - id: ACC-TPORT-022
    interface: module
    title: A streamed take renders silence rather than waiting
    given:
      - a streamed take whose window has been drained
    when:
      - the audio thread reads a frame that is not resident
    then:
      - the read reports a shortfall
      - the underrun is counted
      - nothing blocks
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-028]

  - id: ACC-TPORT-023
    interface: module
    title: A reading behind the head is paid off, not jumped to
    given:
      - a head drawn at 12200 ms
      - a reading from the engine of 12000 ms
    when:
      - the reading is folded in
    then:
      - the head is still at 12200 ms that frame
      - the head is at the engine's position one interval later
      - the head never moves backwards in between
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-029, INV-TPORT-030]

  - id: ACC-TPORT-024
    interface: module
    title: A large disagreement still never reverses the head
    given:
      - a head drawn a full second ahead of what the engine reports
    when:
      - the reading is folded in and frames are drawn
    then:
      - the head never moves backwards
      - the head converges on the engine's position
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-030, INV-TPORT-029]

  - id: ACC-TPORT-025
    interface: module
    title: A frame clock that restarts does not move the head
    given:
      - a head folded in at a frame clock reading of 5000
    when:
      - the frame clock returns 0, as it does when the callback re-registers
    then:
      - the head does not move backwards
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-031, INV-TPORT-030]

  - id: ACC-TPORT-026
    interface: view
    title: Resuming behind the middle holds the view still
    given:
      - a take paused with the head dragged to before the middle of the view
    when:
      - the take is played
    then:
      - the view does not move until the head reaches the middle
      - the head then stays in the middle
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-032]

  - id: ACC-TPORT-027
    interface: view
    title: Resuming past the middle catches up rather than jumping
    given:
      - a take paused with the head dragged to beyond the middle of the view
    when:
      - the take is played
    then:
      - the view moves forward faster than the take
      - it never moves more than one window in a second
      - the head ends in the middle
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-032]

  - id: ACC-TPORT-028
    interface: view
    title: Dragging the head to the edge scrolls the drawing
    given:
      - a take drawn wider than its window
      - the head held by a finger
    when:
      - the finger comes within the margin of an edge
    then:
      - the view scrolls towards that edge
      - it scrolls faster the closer the finger gets
      - it does not scroll while the finger is away from both edges
    maps_to:
      capability: transport.seek
      invariants: [INV-TPORT-033]
