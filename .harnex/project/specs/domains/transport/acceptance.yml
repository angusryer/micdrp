# What the transport must do, stated as the failures it came from.
acceptance:
  - id: ACC-TPORT-001
    interface: module
    title: Playing reaches the engine and says so
    given:
      - a take with audio
    when:
      - the transport is told to play
    then:
      - the transport state is playing
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-001]

  - id: ACC-TPORT-002
    interface: module
    title: A refused schedule fails loudly
    given:
      - a take whose audio cannot be resolved
    when:
      - the transport is told to play
    then:
      - the transport state is failed
      - the transport reports a reason
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-006]

  - id: ACC-TPORT-003
    interface: module
    title: Pausing silences everything
    given:
      - a take is playing
    when:
      - the transport is told to pause
    then:
      - the engine was silenced entirely
      - the transport state is paused
    maps_to:
      capability: transport.pause
      invariants: [INV-TPORT-005]

  - id: ACC-TPORT-004
    interface: module
    title: Pausing holds the moment for the next press
    given:
      - a take is playing
    when:
      - the transport is told to pause
      - the transport is told to play
    then:
      - the run started from where it was paused
    maps_to:
      capability: transport.pause
      invariants: [INV-TPORT-007]

  - id: ACC-TPORT-005
    interface: module
    title: Seeking a silent take moves the head and sounds nothing
    given:
      - a take is stopped at 12000 ms
    when:
      - the transport is told to seek to 7000 ms
    then:
      - the head is at 7000 ms
      - the transport state is stopped
    maps_to:
      capability: transport.seek
      invariants: [INV-TPORT-007]

  - id: ACC-TPORT-006
    interface: module
    title: Nothing published changes while a take plays
    given:
      - a take is playing
    when:
      - the clock is read 4 times
    then:
      - the published transport is unchanged
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-002]

  - id: ACC-TPORT-007
    interface: module
    title: A second press while loading is refused, not queued
    given:
      - a take with audio
    when:
      - the transport is told to play
      - the transport is told to play
    then:
      - the take was decoded 1 time
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-001]

  - id: ACC-TPORT-008
    interface: module
    title: Stopping cancels a press that has not started
    given:
      - a take with a count-in in force
    when:
      - the transport is told to play
      - the transport is told to stop before the count ends
    then:
      - the take never starts
    maps_to:
      capability: transport.stop
      invariants: [INV-TPORT-008]

  - id: ACC-TPORT-009
    interface: module
    title: A subscriber hears a state change and no tick
    given:
      - a take is playing
    when:
      - the clock is read 4 times
      - the transport is told to pause
    then:
      - the subscriber was told 1 time
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-002]

  - id: ACC-TPORT-010
    interface: module
    title: A seek arriving mid-load starts again rather than stranding
    given:
      - a take is playing
      - a seek whose decode has not resolved
    when:
      - the transport is told to seek to 9000 ms
      - the outstanding decode resolves
    then:
      - the transport state is playing
      - the head is at 9000 ms
    maps_to:
      capability: transport.seek
      invariants: [INV-TPORT-016]

  - id: ACC-TPORT-011
    interface: module
    title: A superseded start is silenced once it lands
    given:
      - a take whose decode has not resolved
    when:
      - the transport is told to stop
      - the outstanding decode resolves
    then:
      - the transport state is stopped
      - nothing is scheduled on the engine
    maps_to:
      capability: transport.stop
      invariants: [INV-TPORT-015]

  - id: ACC-TPORT-012
    interface: module
    title: The transport built by the hook can be asked whether a run ended
    given:
      - an engine that reports when a run has ended
    when:
      - the take is played through to its end
    then:
      - the transport state is stopped without any timer firing
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-011, INV-TPORT-017]

  - id: ACC-TPORT-013
    interface: view
    title: Dragging the scrubber decodes the take once
    given:
      - a take is playing
    when:
      - the scrubber is dragged across 20 updates and released
    then:
      - one file token is minted for the whole drag
      - the take is scheduled 1 time
      - the take is sounding again from where the finger let go
    maps_to:
      capability: transport.seek
      invariants: [INV-TPORT-018]

  - id: ACC-TPORT-014
    interface: module
    title: A take that will not decode fails loudly
    given:
      - a take whose audio resolves but will not decode
    when:
      - the transport is told to play
    then:
      - the transport state is failed
      - the transport reports a reason
      - nothing is scheduled on the engine
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-019, INV-TPORT-006]

  - id: ACC-TPORT-015
    interface: module
    title: Resuming a paused take does not decode it again
    given:
      - a take that has been played and paused
    when:
      - the transport is told to play
    then:
      - the take was decoded 1 time
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-020]

  - id: ACC-TPORT-016
    interface: module
    title: The head never moves backwards between samples
    given:
      - a run whose clock is read every 200 ms
    when:
      - a frame is drawn between the reading and the stamp that dates it
    then:
      - the drawn position is the reading itself
      - the drawn position never moves backwards
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-021]

  - id: ACC-TPORT-017
    interface: module
    title: The head follows the engine rather than elapsed time
    given:
      - an engine reporting a position of 12000 ms
    when:
      - the head is sampled
    then:
      - the drawn position is 12000 ms
    maps_to:
      capability: transport.report
      invariants: [INV-TPORT-022, INV-TPORT-010]

  - id: ACC-TPORT-018
    interface: view
    title: A take that fits the window is not followed
    given:
      - a drawing no wider than the window it is in
    when:
      - the take plays
    then:
      - the view issues no scroll
    maps_to:
      capability: transport.observe
      invariants: [INV-TPORT-023]

  - id: ACC-TPORT-019
    interface: module
    title: No screen imports the audio engine
    given:
      - the client source tree
    when:
      - imports of the native synth spec are collected
    then:
      - every importing module is under src/audio
    maps_to:
      capability: transport.play
      invariants: [INV-TPORT-024]
