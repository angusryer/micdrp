# Getting out of a bad push. The only path that has to work when the
# bundle that would carry the fix is the broken thing.
acceptance:
  - id: ACC-UPD-022
    interface: module
    title: A bundle that never starts is replaced without the singer acting
    given:
      - the install is a testflight install
      - the install is running bundle A
      - bundle B is pending
      - bundle B throws before first render
    when:
      - the app relaunches
    then:
      - the running bundle is A
      - bundle B is in state rolled_back
    maps_to:
      capability: updates.roll_back
      invariants: [INV-UPD-003]

  - id: ACC-UPD-023
    interface: module
    title: A rolled-back bundle is never offered to that install again
    given:
      - the install is a testflight install
      - the binary is version 1.0.0 build 4
      - the install is running bundle A
      - bundle B is published for version 1.0.0 build 4
      - bundle B throws before first render
      - bundle B is in state rolled_back
    when:
      - the app checks for an update
    then:
      - the decision is none
    maps_to:
      capability: updates.roll_back
      invariants: [INV-UPD-003]

  - id: ACC-UPD-024
    interface: module
    title: With no earlier bundle, rollback lands on the binary's own
    given:
      - the install is a testflight install
      - the install is running the embedded bundle
      - bundle A is pending
      - bundle A throws before first render
    when:
      - the app relaunches
    then:
      - the running bundle is embedded
      - bundle A is in state rolled_back
    maps_to:
      capability: updates.roll_back
      invariants: [INV-UPD-003]

  - id: ACC-UPD-025
    interface: module
    title: Withdrawing a bundle pulls it back off the installs running it
    given:
      - the install is a testflight install
      - the binary is version 1.0.0 build 4
      - bundle A is published for version 1.0.0 build 4
      - the install is running bundle A
      - bundle A is disabled
    when:
      - the app checks for an update
    then:
      - the decision is rollback
    maps_to:
      capability: updates.disable_bundle
      invariants: [INV-UPD-003]

  - id: ACC-UPD-026
    interface: module
    title: Booting successfully is what makes a bundle keepable
    given:
      - the install is a testflight install
      - bundle A is pending
    when:
      - the singer chooses restart now
    then:
      - bundle A is in state active
      - the running bundle is A
    maps_to:
      capability: updates.mark_boot_successful
      invariants: [INV-UPD-003]
