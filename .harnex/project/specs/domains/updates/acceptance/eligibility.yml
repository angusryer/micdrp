# Who is allowed to take an update at all. The gate that keeps a beta
# push away from an App Store user.
acceptance:
  - id: ACC-UPD-001
    interface: module
    title: A TestFlight install asks the update server
    given:
      - the install is a testflight install
      - the binary is version 1.0.0 build 4
      - bundle A is published for version 1.0.0 build 4
    when:
      - the app checks for an update
    then:
      - the decision is update
      - the offered bundle is A
    maps_to:
      capability: updates.check_for_update
      invariants: [INV-UPD-001]

  - id: ACC-UPD-002
    interface: module
    title: An App Store install never contacts the update server
    given:
      - the install is a app_store install
      - the binary is version 1.0.0 build 4
      - bundle A is published for version 1.0.0 build 4
    when:
      - the app checks for an update
    then:
      - no request reaches the update server
      - the decision is none
    maps_to:
      capability: updates.check_for_update
      invariants: [INV-UPD-001]

  - id: ACC-UPD-003
    interface: module
    title: A development build never contacts the update server
    given:
      - the install is a development install
      - bundle A is published for version 1.0.0 build 4
    when:
      - the app checks for an update
    then:
      - no request reaches the update server
      - the decision is none
    maps_to:
      capability: updates.resolve_eligibility
      invariants: [INV-UPD-001]

  - id: ACC-UPD-004
    interface: module
    title: An unreadable receipt is treated as ineligible
    given:
      - the install is a unknown install
      - bundle A is published for version 1.0.0 build 4
    when:
      - the app checks for an update
    then:
      - no request reaches the update server
      - the decision is none
    maps_to:
      capability: updates.resolve_eligibility
      invariants: [INV-UPD-001]
