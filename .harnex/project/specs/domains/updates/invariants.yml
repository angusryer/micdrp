invariants:
  - id: INV-UPD-001
    description: An App Store install never receives an over-the-air update
    severity: critical
    check: >
      updates.resolve_eligibility returns isEligible false for every
      reason other than testflight, and updates.check_for_update issues
      no network request when isEligible is false. Verified by driving
      the check with each receipt kind and asserting that only
      sandboxReceipt produces a request. The gate is runtime rather than
      build-time on purpose: the binary promoted to the App Store is the
      same binary TestFlight ran, carrying the same baked-in values, so
      no environment flag can tell them apart.

      The receipt lives in the app's DATA container, beside Documents —
      not in the app bundle. Looking for it in the bundle finds nothing,
      resolves every install to unknown, and silently disables updates
      everywhere: the app never asks, so no bundle can ever reach it,
      including the one that would fix the check. Build 6 shipped with
      exactly that fault and needed build 7 to recover.

  - id: INV-UPD-002
    description: A bundle is never offered to a binary that cannot run it
    severity: critical
    check: >
      No install is offered a bundle whose targetAppVersion differs from
      its VERSION_NUMBER, or whose minBuildNumber exceeds its
      BUILD_NUMBER. Verified by publishing bundles either side of both
      boundaries and asserting decision none for each mismatching
      install. A mismatch is a crash rather than a degraded experience,
      because JavaScript calling a native module absent from the binary
      cannot fail softly.

  - id: INV-UPD-003
    description: A bundle that does not boot is replaced without the singer acting
    severity: critical
    check: >
      A launch that finds bootSucceeded false on the current bundle
      loads the last bundle with bootSucceeded true, and never offers the
      failed bundleId to that install again. Verified by applying a
      bundle that throws before first render, relaunching, and asserting
      the previous bundle is running. Without this, a bundle broken at
      boot cannot be fixed over the air, because the mechanism that
      would deliver the fix never starts.

  - id: INV-UPD-004
    description: An update never interrupts singing
    severity: critical
    check: >
      No reload occurs without the singer choosing it, and the control that
      would cause one is not offered while a capture is in progress or a
      practice session is running. Saying a bundle has arrived is allowed at
      any time: it takes no input and costs no take. Verified by holding a
      bundle ready, starting a capture, and asserting the arrival is still
      shown while the way to act on it is not.

      This used to hold back the whole prompt, because the prompt was a modal
      and a modal over a live take costs the take. The prompt is no longer a
      modal (INV-UPD-025), so the thing being guarded against is now only the
      reload — and suppressing the notice as well meant a take, an overdub, or
      an activity left marked busy hid an update entirely (INV-UPD-024).

  - id: INV-UPD-005
    description: An update changes JavaScript and nothing else
    severity: critical
    check: >
      Applying a bundle leaves the binary, every native module, the C++
      pitch engine, and every react-native-config value identical.
      Verified by reading BACKEND_URL, VERSION_NUMBER and BUILD_NUMBER
      before and after an apply and asserting they are unchanged. A
      bundle that needs a different value for any of them is a bundle
      that needs a new build.

  - id: INV-UPD-006
    description: A bundle is applied only after its hash is verified
    severity: critical
    check: >
      No archive reaches state pending unless its hash equals the
      fileHash published with it. Verified by serving an archive whose
      bytes do not match its published hash and asserting the install
      stays on its current bundle.

  - id: INV-UPD-007
    description: Deferring is honoured, and never becomes a nag
    severity: high
    check: >
      A bundle the singer deferred does not prompt again for the rest of
      that app session, on cold start or on return to the foreground.
      Verified by deferring, backgrounding and foregrounding, and
      asserting no second prompt. A newer bundle published afterwards
      prompts normally.

  - id: INV-UPD-008
    description: A failed update is silent
    severity: high
    check: >
      A failed check, a failed download and a hash mismatch each leave
      the install on its current bundle and surface nothing to the
      singer. Verified by driving each failure and asserting no visible
      error and no state change. The update path is not a feature the
      singer asked for, so its failures are not the singer's problem.

  - id: INV-UPD-009
    description: The app can say what it is running
    severity: high
    check: >
      Settings shows the version and build number the binary was built
      with, the over-the-air bundle in use, and whether this install is
      eligible for updates with the reason. Verified by asserting each is
      rendered from the runtime source rather than from package.json.

      Without this, diagnosing why an update did not arrive means
      guessing from the outside. Build 6 was unreachable by any bundle
      and there was no way to tell from the device — the version on
      screen came from package.json, which is not what the build was
      stamped with, and neither the build number nor the running bundle
      appeared at all.

  - id: INV-UPD-010
    description: A bundle older than the binary's own is never offered
    severity: critical
    check: >
      No install is offered a bundle whose id does not sort after the
      bundle compiled into the binary. Verified by publishing a bundle,
      then a binary built after it, and asserting the binary is offered
      nothing.

      Every guard until now asked whether a binary could run a bundle.
      None asked whether the bundle was actually newer than what the
      binary already had. A fresh install reports no running bundle, so
      any published bundle looked newer than nothing — and build 7, which
      shipped the fix for INV-UPD-001, would have been handed JavaScript
      published before that fix existed. It would have downgraded itself
      into being unable to ask for updates at all, and the only route out
      would have been another build.

  - id: INV-UPD-011
    description: Published bundles are judged by the rules in the repository
    severity: critical
    check: >
      Publishing deploys the update server first. Verified by asserting a
      publish cannot complete without a deploy having run.

      The rules deciding who may take a bundle live in the Worker, so a
      publish against a stale Worker enforces stale rules — and nothing
      about the repository shows it. The recency rule was once changed,
      committed, tested and not deployed; a bundle built from build 7 was
      then handed to build 9, which reverted itself to older JavaScript
      and lost the fixes that build existed to deliver.

  - id: INV-UPD-020
    description: A stale resident bundle is a binary problem, not a server one
    severity: critical
    check: >
      An install whose running bundle predates the binary executing it is NOT
      answered with a rollback. The server offers it nothing and says nothing;
      getting it off that bundle is the native layer's job, and where that
      fails the only routes are a new binary and a fresh install. Verified by
      asserting such a client is told nothing, that the bundle is still never
      offered to anyone, and that a withdrawn bundle is still a rollback.

      INV-UPD-010 already says a bundle older than the binary must never be
      handed out. That rule governed what could be OFFERED and said nothing
      about what was already RESIDENT — and a bundle is applied natively at
      launch, before any of this is consulted, so nothing was checking.

      Which made a stale bundle permanent. An install took a bundle at one
      build; every later build shipped a new binary whose JavaScript was
      immediately overridden by that bundle, and the server answered every
      check with "nothing for you" because there genuinely was nothing newer
      it was allowed to offer. Four builds in a row installed and none of them
      appeared. The app was not broken and the release was not broken; the
      only symptom was that shipping stopped working, silently, from both
      ends at once.

      Answering it with a rollback was tried, and it put installs into a boot
      loop: a rollback asks the install to reload, and the reload restarts the
      same resident bundle, which checks again and is told to roll back again.
      The server cannot get an install off a bundle the server is not the one
      loading. That is the whole lesson — the layer that loads first is the
      only layer that can decide not to.

      The real guard is `updateStrategy`. It was 'appVersion' while this
      project pins the version at 1.0.0 and climbs only the build number, so
      the native invalidation never fired. It is 'fingerprint' now, which
      changes whenever the native side does. Neither setting can help an
      install that already has a stale bundle: that one needs a reinstall.

