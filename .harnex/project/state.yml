known_gaps:
  - >
    No verification target exists. The harness executes acceptance tests
    against a URL or a direct adapter; micdrp has neither. A Node adapter
    over packages/logic would make the pure domains executable.
  - >
    The naming_alignment release gate indexes Python only and looks under
    .harnex/framework/<domain>/, so TypeScript capabilities cannot resolve
    by convention. Every capability declares implemented_by with a path.
  - >
    Several logic files exceed the 150-line budget: analysis.ts (839),
    tempo.ts (440), quantize.ts (401), harmony.ts (380), key.ts (197),
    mpm.ts (153).
