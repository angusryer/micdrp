# Project Development State — snapshot, not a log. Overwrite.
updated_at: "2026-08-18T00:00:00Z"
phase: specifying
summary: >
  micdrp is a built and merged React Native singing app (Practice,
  Notes, Dashboard) over Supabase, with its DSP core in pure TS plus a
  parity-tested C++ port. The harness was adopted after the fact, so
  spec-writing was a crawl of working code rather than a green field.

domains:
  registered: [account, insights, notes, pitch, practice, transcription]
  planned: []

current_work: >
  All six domains are specified and validate. Next is either promoting
  domains to building, or building the verification target that would
  let the acceptance tests actually run.

known_gaps:
  - >
    No verification target exists, so every acceptance test reports SKIP.
    The harness executes against a URL or a direct adapter
    (test-config.yml direct.adapter_command); micdrp has neither. A Node
    adapter over packages/logic plus fakes for the engine, the secret
    store, and a row-level-security-enforcing Supabase client would make
    all 126 acceptance tests executable.
  - >
    All 53 capabilities fail the naming_alignment release gate, which is
    registered in release_gate.CHECKS. Three causes, filed upstream as
    harnex#152: consumer-domain code dirs resolve to .harnex/framework/
    <domain>/ which never exists (index size 0, so convention resolution
    is impossible); the symbol index reads Python and shell only; and
    implemented_by paths are joined to .harnex/ rather than the project
    root, so the declared paths do not resolve. A ../-prefixed path-only
    implemented_by would pass but bakes the harness install location into
    every spec file, and the ::symbol form still cannot be used.
    run.sh --validate and doctor --specs are unaffected and green.
  - >
    test-extensions.yml exceeds the 150-line budget in notes (160),
    practice (170), insights (182) and account (184). The framework globs
    siblings for entities, capabilities and invariants, and accepts an
    acceptance/ directory, but loads exactly one test-extensions.yml per
    domain, so the file cannot be split. Filed upstream as harnex#153.
    pitch (149) and transcription (147) comply only because most of their
    resolution prose was stripped to buy lines.
  - >
    Several logic files exceed the 150-line budget: analysis.ts (839),
    tempo.ts (440), quantize.ts (401), harmony.ts (380), key.ts (197),
    mpm.ts (153).
  - >
    The headphone route probe is unimplemented on device, so practice
    play-along never engages in the real app (Phase V work).
